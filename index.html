          `Đại cách cục và dưỡng sinh Đông Y trên lá số của ${horoscope.info.name}.`,
          ...horoscope.patterns.map(pat => `Cách cục ${pat.title}, xếp hạng ${pat.rank}. ${pat.desc}`),
          `Về sức khỏe Đông Y, cung cần lưu tâm nhất là ${horoscope.info.worstSatPalace} tại ${horoscope.info.worstSatBranch}, ứng với ${horoscope.info.healthOrgan.organ}. ${horoscope.info.healthOrgan.advice}`
        ]);
      }

      // Mặc định: Tab Giải mã cung đang chọn
      const majorsSpeech = currentReading.majorDetailedList.length > 0
        ? currentReading.majorDetailedList.map(ms => `Sao ${ms.name} ở trạng thái ${ms.brightness}. ${ms.coreDesc} ${ms.mutagenExplain || ''}`)
        : [currentReading.coreAnalysis];

      const phiLoc = currentPhiTinh.find(x => x.key === 'Lộc');
      const phiKy = currentPhiTinh.find(x => x.key === 'Kỵ');

      return splitIntoSpeechSentences([
        `Giải mã cung ${currentPalace.palaceName} tại ${currentPalace.stemName} ${currentPalace.branchName} của ${horoscope.info.name}. Độ tốt ${currentReading.score} trên 10, xếp loại ${currentReading.ratingLabel}.`,
        `Cung này nói về ${currentReading.plainGuide.plainTitle}. Đại vận 10 năm tại cung này diễn ra từ ${currentPalace.daiHanRange} tuổi.`,
        ...majorsSpeech,
        phiLoc ? `Từ cung ${currentPalace.palaceName}, sao ${phiLoc.starName} hóa Lộc bay sang cung ${phiLoc.targetPalaceName}, mở ra nguồn thuận lợi tại đó.` : '',
        phiKy ? `Đồng thời sao ${phiKy.starName} hóa Kỵ bay vào cung ${phiKy.targetPalaceName}, nhắc nhở chỗ cần giữ gìn cẩn trọng.` : '',
        currentReading.synthesisText,
        ...currentReading.contextAdvice
      ]);
    }

    function ChartSpeechBar({ sentences }) {
      const [isSpeaking, setIsSpeaking] = useState(false);
      const [isPaused, setIsPaused] = useState(false);
      const [sentIdx, setSentIdx] = useState(0);
      const [rate, setRate] = useState(1.0);
      const [bgmOn, setBgmOn] = useState(false);
      const [showTranscript, setShowTranscript] = useState(false);

      const activeRef = useRef({ speaking: false, idx: 0, rate: 1.0, list: sentences });
      activeRef.current.rate = rate;
      activeRef.current.list = sentences;

      const pickVietnameseVoice = () => {
        if (!window.speechSynthesis) return null;
        const voices = window.speechSynthesis.getVoices() || [];
        const viVoices = voices.filter(v => (v.lang || '').toLowerCase().startsWith('vi'));
        return (
          viVoices.find(v => /natural|online|hoaimy|namminh/i.test(v.name)) ||
          viVoices[0] ||
          null
        );
      };

      const speakAtIndex = (index) => {
        if (!window.speechSynthesis) return;
        const list = activeRef.current.list;
        if (!list || index < 0 || index >= list.length) {
          window.speechSynthesis.cancel();
          activeRef.current.speaking = false;
          setIsSpeaking(false);
          setIsPaused(false);
          setSentIdx(0);
          return;
        }

        window.speechSynthesis.cancel();
        activeRef.current.speaking = true;
        activeRef.current.idx = index;
        setSentIdx(index);
        setIsSpeaking(true);
        setIsPaused(false);

        const utter = new SpeechSynthesisUtterance(list[index]);
        utter.lang = 'vi-VN';
        utter.rate = activeRef.current.rate;
        const voice = pickVietnameseVoice();
        if (voice) utter.voice = voice;

        utter.onend = () => {
          if (!activeRef.current.speaking) return;
          const next = index + 1;
          if (next < activeRef.current.list.length) {
            speakAtIndex(next);
          } else {
            activeRef.current.speaking = false;
            setIsSpeaking(false);
            setIsPaused(false);
            setSentIdx(0);
          }
        };

        utter.onerror = () => {
          if (!activeRef.current.speaking) return;
          activeRef.current.speaking = false;
          setIsSpeaking(false);
          setIsPaused(false);
        };

        window.speechSynthesis.speak(utter);
      };

      // Dừng đọc khi đổi cung / đổi tab và giải phóng âm thanh khi rời màn hình
      useEffect(() => {
        if (window.speechSynthesis) window.speechSynthesis.cancel();
        activeRef.current.speaking = false;
        setIsSpeaking(false);
        setIsPaused(false);
        setSentIdx(0);
      }, [sentences]);

      useEffect(() => {
        if (window.speechSynthesis && window.speechSynthesis.onvoiceschanged !== undefined) {
          window.speechSynthesis.getVoices();
        }
        return () => {
          if (window.speechSynthesis) window.speechSynthesis.cancel();
          activeRef.current.speaking = false;
          AncientZitherAudio.stop();
        };
      }, []);

      const handleTogglePlay = () => {
        if (!window.speechSynthesis) return;
        if (isSpeaking && !isPaused) {
          window.speechSynthesis.pause();
          setIsPaused(true);
        } else if (isSpeaking && isPaused) {
          window.speechSynthesis.resume();
          setIsPaused(false);
        } else {
          speakAtIndex(sentIdx);
        }
      };

      const handleStop = () => {
        if (window.speechSynthesis) window.speechSynthesis.cancel();
        activeRef.current.speaking = false;
        setIsSpeaking(false);
        setIsPaused(false);
        setSentIdx(0);
      };

      const handleStep = (delta) => {
        const next = Math.max(0, Math.min(sentences.length - 1, sentIdx + delta));
        if (isSpeaking) {
          speakAtIndex(next);
        } else {
          setSentIdx(next);
        }
      };

      const handleChangeRate = (newRate) => {
        setRate(newRate);
        activeRef.current.rate = newRate;
        if (isSpeaking && !isPaused) {
          speakAtIndex(sentIdx);
        }
      };

      const handleToggleBgm = () => {
        if (AncientZitherAudio.isPlaying()) {
          AncientZitherAudio.stop();
          setBgmOn(false);
        } else {
          AncientZitherAudio.start();
          setBgmOn(true);
        }
      };

      return (
        <div className="border-b border-[#C7B28E] bg-[#EFE6D4]/90 px-3 py-1.5 font-ui text-[11px] space-y-1.5">
          <div className="flex items-center justify-between flex-wrap gap-1.5">
            {/* Cụm nút Nghe đọc + Lùi / Tiến / Dừng + Tốc độ + Câu X/N */}
            <div className="flex items-center gap-1 flex-wrap">
              <button
                type="button"
                onClick={handleTogglePlay}
                className="px-2.5 py-1 rounded-full bg-[#6E4715] hover:bg-[#85561A] text-[#FFF8EB] font-bold text-[11px] flex items-center gap-1 cursor-pointer transition shadow-sm"
              >
                <span>{isSpeaking && !isPaused ? '⏸ Tạm dừng' : isPaused ? '▶ Đọc tiếp' : '▶ Nghe đọc'}</span>
              </button>

              <button
                type="button"
                onClick={() => handleStep(-1)}
                disabled={sentIdx <= 0}
                title="Lùi 1 câu"
                className="w-6 h-6 rounded-full bg-[#FAF6ED] hover:border-[#8C6226] border border-[#C7B28E] text-[#57452F] disabled:opacity-40 flex items-center justify-center cursor-pointer text-[10px]"
              >
                ⏮
              </button>
              <button
                type="button"
                onClick={() => handleStep(1)}
                disabled={sentIdx >= sentences.length - 1}
                title="Tiến 1 câu"
                className="w-6 h-6 rounded-full bg-[#FAF6ED] hover:border-[#8C6226] border border-[#C7B28E] text-[#57452F] disabled:opacity-40 flex items-center justify-center cursor-pointer text-[10px]"
              >
                ⏭
              </button>
              {isSpeaking && (
                <button
                  type="button"
                  onClick={handleStop}
                  title="Dừng hẳn"
                  className="w-6 h-6 rounded-full bg-[#FAF6ED] hover:border-[#9E241E] border border-[#C7B28E] text-[#9E241E] flex items-center justify-center cursor-pointer text-[10px]"
                >
                  ⏹
                </button>
              )}

              <select
                value={rate}
                onChange={e => handleChangeRate(parseFloat(e.target.value))}
                className="px-1.5 py-0.5 rounded-full bg-[#FAF6ED] border border-[#C7B28E] text-[#4A3822] font-semibold text-[10.5px] cursor-pointer"
                title="Tốc độ giọng đọc"
              >
                <option value={0.9}>0.9×</option>
                <option value={1.0}>1.0×</option>
                <option value={1.15}>1.15×</option>
                <option value={1.3}>1.3×</option>
              </select>

              <span className="text-[10.5px] text-[#6E5638] font-mono font-semibold whitespace-nowrap">
                Câu {sentIdx + 1}/{sentences.length}
              </span>
            </div>

            {/* Cụm phải: Âm nền cổ phong + Mở lời đọc */}
            <div className="flex items-center gap-1">
              <button
                type="button"
                onClick={handleToggleBgm}
                className={`px-2.5 py-0.5 rounded-full border text-[10.5px] font-semibold cursor-pointer transition ${
                  bgmOn
                    ? 'seal-jade border-transparent'
                    : 'bg-[#FAF6ED] border-[#C7B28E] text-[#57452F] hover:border-[#8C6226]'
                }`}
                title="Bật/tắt tiếng đàn cổ cầm ngũ cung êm dịu làm nền"
              >
                🎵 {bgmOn ? 'Âm cổ phong: BẬT' : 'Âm nền cổ phong'}
              </button>

              <button
                type="button"
                onClick={() => setShowTranscript(!showTranscript)}
                className="px-2 py-0.5 rounded-full bg-[#FAF6ED] hover:border-[#8C6226] border border-[#C7B28E] text-[#57452F] text-[10.5px] font-semibold cursor-pointer"
              >
                {showTranscript ? '▴ Ẩn lời' : '▾ Lời đọc'}
              </button>
            </div>
          </div>

          {showTranscript && (
            <div className="p-2 rounded-sm bg-[#FAF6ED] border border-[#D4C4A8] text-xs font-serif text-[#1C1610] leading-relaxed flex items-start justify-between gap-2">
              <span>“{sentences[sentIdx] || ''}”</span>
            </div>
          )}
        </div>
      );
    }

    // Luận giải nhanh ngay bên trong màn hình Lá Số 12 Cung (Hiểu cả tên Sao, Cung đang chọn, Tháng âm & Chuyện đời sống)
    function computeChartInlineQA({
      question = '',
      selectedPalace,
      horoscope,
      fortuneYear = CURRENT_LUNAR_YEAR,
      appliedData = {}
    }) {
      const q = (question || '').trim();
      const s = q.toLowerCase();
      const explicitYearMatch = s.match(/\b(19\d{2}|20\d{2})\b/);
      const askYear = explicitYearMatch
        ? Math.max(1950, Math.min(2099, parseInt(explicitYearMatch[1], 10)))
        : /năm sau|sang năm|năm tới/.test(s)
        ? NEXT_LUNAR_YEAR
        : /năm ngoái|năm trước/.test(s)
        ? CURRENT_LUNAR_YEAR - 1
        : /năm nay/.test(s)
        ? CURRENT_LUNAR_YEAR
        : fortuneYear;

      const fmtMajors = (p) => p.majorStars.map(st => `${st.name} (${st.brightShort}${st.mutagen ? `·${st.mutagen}` : ''})`).join(', ') || 'Vô Chính Diệu';

      // 1. Nhận diện nếu người dùng hỏi đích danh một Ngôi Sao / Tuần / Triệt / Vô Chính Diệu trên bàn lá số
      const majorNames = MAJOR_14_META.map(m => m.name);
      const minorNames = Object.keys(MINOR_STAR_MEANINGS);
      const matchedMajor = majorNames.find(name => s.includes(name.toLowerCase()));
      const matchedMinor = minorNames.find(name => s.includes(name.toLowerCase()));

      if (matchedMajor && /là gì|ý nghĩa|tốt|xấu|sao|thế nào|ra sao|ở đây|đóng|hãm|miếu|vượng|đắc/.test(s) && !/tháng mấy|vay|chuyển việc|mua nhà/.test(s)) {
        // Tìm cung chứa chính tinh đó trên lá số thật
        const foundPal = Object.values(horoscope.palaces).find(p => p.majorStars.some(ms => ms.name === matchedMajor)) || selectedPalace;
        const starObj = foundPal.majorStars.find(ms => ms.name === matchedMajor);
        const metaphor = STAR_EVERYDAY_METAPHOR[matchedMajor] || '';
        const brightInfo = starObj ? (BRIGHTNESS_EXPLAIN[starObj.brightness]?.desc || '') : '';
        const ctxNote = starObj ? getStarInPalaceContext(matchedMajor, foundPal.palaceName, starObj.brightness) : '';
        return {
          question: q,
          palaceName: foundPal.palaceName,
          branch: foundPal.branchName,
          headline: `Trên lá số của bạn, sao ${matchedMajor} đóng tại cung ${foundPal.palaceName} (${foundPal.branchName})${starObj ? ` — độ sáng ${starObj.brightness}` : ''}${starObj?.mutagen ? `, kèm Hóa ${starObj.mutagen}` : ''}.`,
          detail: `Hiểu một cách gần gũi, ${matchedMajor} giống như ${metaphor}. ${ctxNote} ${brightInfo}`,
          evidence: `Vị trí thật trên bàn 12 cung: ${foundPal.palaceName} (${foundPal.stemName} ${foundPal.branchName}) · Đại vận ${foundPal.daiHanRange} tuổi.`
        };
      }

      if (matchedMinor && /là gì|ý nghĩa|tốt|xấu|sao|sợ|lo|hóa giải|thế nào|ở đây/.test(s)) {
        const foundPal = Object.values(horoscope.palaces).find(p => p.minorCats.includes(matchedMinor) || p.minorSats.includes(matchedMinor)) || selectedPalace;
        const isSat = foundPal.minorSats.includes(matchedMinor);
        const rescue = (foundPal.hasTuan || foundPal.hasTriet)
          ? ` Điểm đáng mừng là cung ${foundPal.palaceName} có ấn ${foundPal.hasTuan ? 'Tuần' : 'Triệt'} kìm bớt tính gắt của sao này, biến va vấp ban đầu thành kinh nghiệm chắc tay.`
          : foundPal.minorCats.length >= 3
          ? ` Cung này có nhiều sao tốt đi kèm (${foundPal.minorCats.slice(0, 3).join(', ')}) nên đủ sức chế hóa, bạn chỉ cần cẩn trọng đúng khâu đó là êm.`
          : '';
        return {
          question: q,
          palaceName: foundPal.palaceName,
          branch: foundPal.branchName,
          headline: `Sao ${matchedMinor} trên lá số của bạn nằm ở cung ${foundPal.palaceName} (${foundPal.branchName}) — thuộc nhóm ${isSat ? 'sao thử thách cần lưu tâm' : 'sao trợ lực tốt lành'}.`,
          detail: `${MINOR_STAR_MEANINGS[matchedMinor]}${rescue}`,
          evidence: `Cung ${foundPal.palaceName} (${foundPal.branchName}) · Chính tinh đi cùng: ${fmtMajors(foundPal)}.`
        };
      }

      if (/vô chính diệu/.test(s)) {
        const vcdPal = selectedPalace.majorStars.length === 0
          ? selectedPalace
          : (Object.values(horoscope.palaces).find(p => p.majorStars.length === 0) || selectedPalace);
        const r = generatePalaceReading(vcdPal, horoscope.palaces);
        return {
          question: q,
          palaceName: vcdPal.palaceName,
          branch: vcdPal.branchName,
          headline: `Cung ${vcdPal.palaceName} (${vcdPal.branchName}) Vô Chính Diệu không phải là xấu hay trống rỗng, mà là cung mềm dẻo mượn sức từ xung chiếu (${r.oppPal.palaceName}: ${fmtMajors(r.oppPal)}).`,
          detail: `Ở mảng ${r.plainGuide.plainTitle.toLowerCase()}, buổi đầu thường linh hoạt thay đổi theo hoàn cảnh chứ không đóng khung cứng nhắc. ${vcdPal.hasTuan || vcdPal.hasTriet ? 'Đặc biệt cung này đắc Tuần/Triệt trấn giữ (Đắc Tam Không), càng về trung niên càng vững vàng hơn người.' : stripAdviceLabel(r.contextAdvice[0])}`,
          evidence: `Xung chiếu từ ${r.oppPal.palaceName} (${r.oppPal.branchName}) · Điểm đánh giá cung: ${r.score}/10.`
        };
      }

      if (/tuần|triệt/.test(s) && /là gì|ý nghĩa|tốt|xấu|sao|thế nào|mở/.test(s)) {
        return {
          question: q,
          palaceName: selectedPalace.palaceName,
          branch: selectedPalace.branchName,
          headline: `Trên cung ${selectedPalace.palaceName} (${selectedPalace.branchName}): ${selectedPalace.hasTriet ? 'Đang có ấn TRIỆT KHÔNG' : selectedPalace.hasTuan ? 'Đang có ấn TUẦN KHÔNG' : 'Không bị Tuần/Triệt đóng trực tiếp'}.`,
          detail: selectedPalace.hasTriet
            ? `Triệt Không mạnh nhất ở giai đoạn trước 32 tuổi — làm cho chuyện ${PALACE_PLAIN_GUIDE[selectedPalace.palaceName]?.plainTitle.toLowerCase()} buổi đầu hay phải đổi hướng hoặc vất vả tự lập, nhưng từ sau 32 tuổi Triệt nhả dần, đường đi thông thoáng rõ rệt. Nếu trong cung có sát tinh (${selectedPalace.minorSats.slice(0, 3).join(', ') || 'ít sát tinh'}), Triệt lại giúp khóa bớt rủi ro lớn.`
            : selectedPalace.hasTuan
            ? `Tuần Không tác động êm nhưng bền suốt đời như lớp đệm giảm xóc: làm chậm nhịp ăn xổi ở mảng ${PALACE_PLAIN_GUIDE[selectedPalace.palaceName]?.plainTitle.toLowerCase()}, bắt bạn làm chắc từng bước thì giữ được thành quả lâu dài.`
            : `Cung ${selectedPalace.palaceName} hiện không có Tuần hay Triệt đóng giữ, nên các sao ${fmtMajors(selectedPalace)} phát huy nguyên bản năng lượng trực tiếp mà không bị kìm hãm.`,
          evidence: `Cung ${selectedPalace.palaceName} (${selectedPalace.branchName}) · Đại vận ${selectedPalace.daiHanRange} tuổi.`
        };
      }

      // 2. Xác định cung người dùng đang hỏi (ưu tiên tên cung gõ trong câu, nếu không gõ tên cung thì bám thẳng vào cung đang bấm trên bàn cờ!)
      const palaceKeywordMap = [
        { match: /mệnh|bản thân|tính cách/, name: 'MỆNH CUNG', cat: 'career' },
        { match: /quan lộc|công việc|sự nghiệp|chuyển việc|nhảy việc|nghề|đi làm|cấp trên|sếp/, name: 'QUAN LỘC', cat: 'career' },
        { match: /tài bạch|tiền|tài chính|lương|giàu|vàng|tiết kiệm|vay|nợ/, name: 'TÀI BẠCH', cat: 'wealth' },
        { match: /điền trạch|nhà|đất|chung cư|chỗ ở|sổ đỏ|xây|sửa/, name: 'ĐIỀN TRẠCH', cat: 'property' },
        { match: /phu thê|vợ|chồng|hôn nhân|người yêu|tình duyên|tình cảm|cưới/, name: 'PHU THÊ', cat: 'love' },
        { match: /nô bộc|bạn bè|hùn vốn|góp vốn|làm chung|đối tác|nhân viên/, name: 'NÔ BỘC', cat: 'partnership' },
        { match: /tật ách|sức khỏe|sức khoẻ|bệnh|khám|ngủ/, name: 'TẬT ÁCH', cat: 'health' },
        { match: /tử tức|con cái|sinh con|nuôi con/, name: 'TỬ TỨC', cat: 'health' },
        { match: /phụ mẫu|cha mẹ|bố mẹ/, name: 'PHỤ MẪU', cat: 'health' },
        { match: /huynh đệ|anh chị em|anh em/, name: 'HUYNH ĐỆ', cat: 'partnership' },
        { match: /thiên di|đi xa|xuất ngoại|ra ngoài/, name: 'THIÊN DI', cat: 'career' },
        { match: /phúc đức|dòng họ|mồ mả|phúc phần|tâm linh/, name: 'PHÚC ĐỨC', cat: 'health' }
      ];

      const explicitHit = palaceKeywordMap.find(item => item.match.test(s));
      const targetPal = explicitHit
        ? (Object.values(horoscope.palaces).find(p => p.palaceName === explicitHit.name) || selectedPalace)
        : selectedPalace;

      const palaceToCat = {
        'MỆNH CUNG': 'career',
        'QUAN LỘC': 'career',
        'TÀI BẠCH': 'wealth',
        'ĐIỀN TRẠCH': 'property',
        'PHU THÊ': 'love',
        'NÔ BỘC': 'partnership',
        'HUYNH ĐỆ': 'partnership',
        'THIÊN DI': 'career',
        'TẬT ÁCH': 'health',
        'TỬ TỨC': 'health',
        'PHỤ MẪU': 'health',
        'PHÚC ĐỨC': 'health'
      };

      const baseReport = computeDecisionAdvisor({
        horoscope,
        targetYear: askYear,
        mode: 'one',
        questionText: q,
        category: explicitHit?.cat || palaceToCat[targetPal.palaceName] || 'career',
        workStatus: appliedData.workStatus || 'company',
        maritalStatus: appliedData.maritalStatus || 'single',
        useIChing: true
      });

      // Nếu hỏi về tháng âm / vay vốn / giấy tờ / con người / hoặc hỏi riêng cung đang bấm (như Phúc Đức, Thiên Di, Tử Tức...)
      if (
        /tháng mấy|tháng nào|khi nào|bao giờ|thời điểm|vay|ngân hàng|giấy tờ|sổ đỏ|chân trong|làm thêm|cha mẹ|bố mẹ|con cái/.test(s) ||
        !explicitHit
      ) {
        const patchedReport = { ...baseReport, focusPal: targetPal };
        const fu = computeFollowUpAnswer({
          followUpText: explicitHit ? q : `${q} (xét trực tiếp tại cung ${targetPal.palaceName})`,
          baseReport: patchedReport,
          horoscope,
          targetYear: askYear,
          workStatus: appliedData.workStatus || 'company',
          maritalStatus: appliedData.maritalStatus || 'single',
          useIChing: true
        });
        // Nếu người dùng hỏi tổng quát về cung đang bấm ("cung này năm 2026/2027 thế nào?")
        if (!/tháng mấy|tháng nào|vay|ngân hàng|giấy tờ|làm thêm/.test(s) && !explicitHit) {
          const r = generatePalaceReading(targetPal, horoscope.palaces);
          const f4 = baseReport.f4;
          const luuHere = (f4.luuTinh.fullByBranch[targetPal.branchName] || []).map(x => x.name);
          const phi = computePalacePhiTinh(targetPal, horoscope.palaces, horoscope.info.sihuaSchool || 'namphai');
          const pLoc = phi.find(x => x.key === 'Lộc');
          const pKy = phi.find(x => x.key === 'Kỵ');
          return {
            question: q,
            palaceName: targetPal.palaceName,
            branch: targetPal.branchName,
            headline: `Cung ${targetPal.palaceName} (${targetPal.branchName}: ${fmtMajors(targetPal)}) đạt nền ${r.score}/10 — trong năm ${askYear}, các tháng dễ triển khai nhất là Tháng ${targetPal.lunarMonthNum} và Tháng ${f4.luuSihuaHits[0].pal.lunarMonthNum} ÂL.`,
            detail: `${stripAdviceLabel(r.contextAdvice[0])} Bước sang năm ${askYear} (${f4.luuTinh.stem} ${f4.luuTinh.branch})${luuHere.length ? `, cung này đón sao lưu (${luuHere.slice(0, 4).join(', ')})` : ''}. Từ ${targetPal.palaceName} bắn ${pLoc.starName} Hóa Lộc sang ${pLoc.targetPalaceName} (nơi đem lại cơ hội tốt) và bắn ${pKy.starName} Hóa Kỵ sang ${pKy.targetPalaceName} (chỗ cần rà kỹ lời nói, giấy tờ).`,
            evidence: fu.evidence
          };
        }
        return fu;
      }

      return {
        question: q,
        palaceName: baseReport.focusPal.palaceName,
        branch: baseReport.focusPal.branchName,
        headline: baseReport.directAnswer,
        detail: `${baseReport.howItUnfolds} Việc ưu tiên nhất: ${baseReport.actionChecklist[0]}`,
        evidence: baseReport.evidenceLine
      };
    }

    function ChartInlineQABar({
      currentPalace,
      horoscope,
      fortuneYear,
      appliedData,
      onSelectPalaceBranch,
      onOpenDeepAdvisor
    }) {
      const [inputVal, setInputVal] = useState('');
      const [qaList, setQaList] = useState([]);
      const [expanded, setExpanded] = useState(true);
      const listEndRef = useRef(null);

      // Làm mới danh sách chat nhanh khi đổi sang lá số người khác
      useEffect(() => {
        setQaList([]);
      }, [horoscope.info.name, horoscope.info.lunarText]);

      const firstStarName = currentPalace.majorStars[0]?.name || (currentPalace.minorSats[0] || 'Vô Chính Diệu');
      const quickChips = useMemo(() => [
        `Cung ${currentPalace.palaceName} năm ${fortuneYear} tốt xấu thế nào?`,
        `Tháng mấy âm lịch năm ${fortuneYear} thuận cho mảng này?`,
        `${firstStarName === 'Vô Chính Diệu' ? 'Vô Chính Diệu' : `Sao ${firstStarName}`} ở cung ${currentPalace.palaceName} có ý nghĩa gì?`
      ], [currentPalace.palaceName, firstStarName, fortuneYear]);

      const askNow = (rawText) => {
        const q = (rawText ?? inputVal).trim();
        if (!q) return;
        const ans = computeChartInlineQA({
          question: q,
          selectedPalace: currentPalace,
          horoscope,
          fortuneYear,
          appliedData
        });
        setQaList(prev => [...prev, { id: Date.now() + Math.random(), ...ans }]);
        setExpanded(true);
        if (rawText === undefined) setInputVal('');
        setTimeout(() => {
          if (listEndRef.current) {
            listEndRef.current.scrollIntoView({ behavior: 'smooth', block: 'end' });
          }
        }, 50);
      };

      return (
        <div className="shrink-0 border-t-2 border-[#8C6226] bg-[#EFE6D4] font-ui">
          {/* Ngăn hiển thị câu trả lời ngay trên thanh gõ (Vẫn thấy bàn 12 cung bên trái!) */}
          {qaList.length > 0 && (
            <div className="border-b border-[#C7B28E] bg-[#FAF6ED]">
              <div className="px-3 py-1.5 bg-[#E6DAC3] flex items-center justify-between text-[11px]">
                <button
                  type="button"
                  onClick={() => setExpanded(!expanded)}
                  className="font-bold text-[#9E241E] flex items-center gap-1 cursor-pointer"
                >
                  <span>{expanded ? '▾' : '▴'}</span>
                  <span>【問】 Hỏi Đáp Ngay Trên Lá Số ({qaList.length})</span>
                </button>
                <div className="flex items-center gap-2.5">
                  <button
                    type="button"
                    onClick={() => onOpenDeepAdvisor(qaList[qaList.length - 1].question)}
                    className="text-[10.5px] font-bold text-[#156839] hover:underline cursor-pointer"
                    title="Mở bản phân tích dài 4 mục cho câu hỏi này"
                  >
                    Mở bản luận sâu 4 mục →
                  </button>
                  <button
                    type="button"
                    onClick={() => setQaList([])}
                    className="text-[10.5px] font-semibold text-[#6E5638] hover:text-[#9E241E] cursor-pointer"
                  >
                    Xóa
                  </button>
                </div>
              </div>

              {expanded && (
                <div className="max-h-[210px] overflow-y-auto px-3 py-2.5 space-y-2.5 font-serif">
                  {qaList.map((item, idx) => (
                    <div key={item.id} className="p-2.5 bg-[#FFFDF8] border-l-4 border-[#9E241E] border border-[#DFD2BC] rounded-sm space-y-1 text-xs leading-relaxed">
                      <div className="flex items-center justify-between gap-2 font-ui text-[10.5px] text-[#7A5219] font-bold">
                        <span>Câu hỏi #{idx + 1}: “{item.question}”</span>
                        {item.branch && item.branch !== currentPalace.branchName && (
                          <button
                            type="button"
                            onClick={() => onSelectPalaceBranch(item.branch)}
                            className="text-[#156839] hover:underline shrink-0 cursor-pointer"
                          >
                            Chạm cung {item.branch} →
                          </button>
                        )}
                      </div>
                      <p className="font-bold text-[#9E241E] text-[12.5px] leading-snug">{item.headline}</p>
                      <p className="text-[#1C1610] text-[12px]">{item.detail}</p>
                      <div className="text-[10px] font-ui text-[#6E5638] pt-0.5 border-t border-[#EFE6D4]">
                        {item.evidence}
                      </div>
                    </div>
                  ))}
                  <div ref={listEndRef} />
                </div>
              )}
            </div>
          )}

          {/* Dải 3 gợi ý hỏi nhanh đổi tự động theo cung đang bấm trên bàn lá số */}
          <div className="px-2.5 pt-1.5 flex items-center gap-1 overflow-x-auto no-scrollbar">
            <span className="text-[10px] font-bold text-[#7A5219] whitespace-nowrap shrink-0">
              Gợi ý ({currentPalace.branchName}):
            </span>
            {quickChips.map((chip, idx) => (
              <button
                key={idx}
                type="button"
                onClick={() => askNow(chip)}
                className="px-2 py-0.5 rounded-full bg-[#FAF6ED] hover:border-[#9E241E] border border-[#C7B28E] text-[10.5px] text-[#3D3022] whitespace-nowrap shrink-0 cursor-pointer transition"
              >
                {chip}
              </button>
            ))}
          </div>

          {/* Thanh nhập câu hỏi bo tròn + Nút [Hỏi] ghim cố định dưới đáy */}
          <form
            onSubmit={(e) => {
              e.preventDefault();
              askNow();
            }}
            className="p-2 flex items-center gap-2"
          >
            <input
              type="text"
              value={inputVal}
              onChange={(e) => setInputVal(e.target.value)}
              placeholder={`Hỏi ngay về cung ${currentPalace.palaceName} (${currentPalace.branchName}), tên sao hoặc việc năm ${fortuneYear}...`}
              className="flex-1 px-3.5 py-2 rounded-full border-2 border-[#8C6226] bg-[#FAF6ED] text-xs text-[#1C1610] placeholder-[#8A7960] focus:border-[#9E241E] focus:outline-none shadow-inner"
            />
            <button
              type="submit"
              disabled={!inputVal.trim()}
              className="px-4 py-2 rounded-full bg-[#6E4715] hover:bg-[#85561A] disabled:opacity-45 text-[#FFF8EB] font-bold text-xs whitespace-nowrap cursor-pointer transition shadow-sm shrink-0"
            >
              Hỏi
            </button>
          </form>
        </div>
      );
    }

    function getTenGod(dayStem, targetStem) {
      if (!dayStem || !targetStem) return '';
      const dm = BAZI_STEM_INFO[dayStem];
      const tg = BAZI_STEM_INFO[targetStem];
      if (!dm || !tg) return '';
      const samePol = dm.pol === tg.pol;
      const meta = FIVE_ELEMENTS_META[dm.el];
      if (dm.el === tg.el) return samePol ? 'Tỷ Kiên' : 'Kiếp Tài';
      if (meta.generates === tg.el) return samePol ? 'Thực Thần' : 'Thương Quan';
      if (meta.controls === tg.el) return samePol ? 'Thiên Tài' : 'Chính Tài';
      if (meta.controlledBy === tg.el) return samePol ? 'Thất Sát' : 'Chính Quan';
      if (meta.generatedBy === tg.el) return samePol ? 'Thiên Ấn' : 'Chính Ấn';
      return '';
    }

    function computeBaziYongShen(horoscope) {
      const info = horoscope.info;
      const birthJd = info.birthJd || jdFromDate(info.sDay || 8, info.sMonth || 1, info.sYear || 1988);
      const trueHour = typeof info.trueHour === 'number' ? info.trueHour : 8;
      const isVanTyShifted = !info.unknownHour && trueHour >= 23 && String(info.lunarFull || '').includes('Vãn Tý');
      const astroJd = (isVanTyShifted ? birthJd - 1 : birthJd) + trueHour / 24;
      const sunDeg = getSunLongitudeDeg(astroJd, 7);

      const termIdx = Math.floor(sunDeg / 15) % 24;
      const currentTerm = SOLAR_TERMS_24[termIdx] || SOLAR_TERMS_24[0];
      const nextTerm = SOLAR_TERMS_24[(termIdx + 1) % 24];

      // Năm & Tháng Bát Tự Tử Bình tính theo Tiết Khí (Lập Xuân = 315 độ)
      const astroGreg = jdToGregorian(isVanTyShifted ? birthJd - 1 : birthJd);
      const sYear = astroGreg.year || info.sYear || info.lYear;
      const sMonth = astroGreg.month || info.sMonth || 1;
      const baziSolarYear = (sMonth <= 2 && sunDeg < 315) ? (sYear - 1) : sYear;
      const yearStemIdx = ((baziSolarYear - 4) % 10 + 10) % 10;
      const yearBranchIdx = ((baziSolarYear - 4) % 12 + 12) % 12;
      const yStem = CAN[yearStemIdx];
      const yBranch = CHI[yearBranchIdx];

      const shiftedFromLapXuan = (sunDeg - 315 + 360) % 360;
      const monthOrderFromDan = Math.floor(shiftedFromLapXuan / 30); // 0=Dần .. 11=Sửu
      const mBranchIdx = (2 + monthOrderFromDan) % 12;
      const tigerStemStart = ((yearStemIdx % 5) * 2 + 2) % 10;
      const mStemIdx = (tigerStemStart + monthOrderFromDan) % 10;
      const mStem = CAN[mStemIdx];
      const mBranch = CHI[mBranchIdx];

      // Trụ Ngày (Nhật Chủ) & Trụ Giờ
      const dStemIdx = ((birthJd + 9) % 10 + 10) % 10;
      const dBranchIdx = ((birthJd + 1) % 12 + 12) % 12;
      const dStem = CAN[dStemIdx];
      const dBranch = CHI[dBranchIdx];

      const hBranchIdx = info.unknownHour ? 0 : (Math.floor((trueHour + 1) / 2) % 12);
      const ratHourStemStart = ((dStemIdx % 5) * 2) % 10;
      const hStemIdx = (ratHourStemStart + hBranchIdx) % 10;
      const hStem = CAN[hStemIdx];
      const hBranch = CHI[hBranchIdx];

      const pillars = [
        { key: 'year',  label: 'Trụ Năm (Tổ nghiệp · Tiền vận)', stem: yStem, branch: yBranch, weightStem: 1.0, weightBranch: 1.1 },
        { key: 'month', label: 'Trụ Tháng (Nguyệt Lệnh · Đương thời)', stem: mStem, branch: mBranch, weightStem: 1.15, weightBranch: 2.5, isMonthCommand: true },
        { key: 'day',   label: 'Trụ Ngày (Nhật Chủ · Hôn nhân)', stem: dStem, branch: dBranch, weightStem: 1.2, weightBranch: 1.35, isDayMaster: true },
        { key: 'hour',  label: info.unknownHour ? 'Trụ Giờ (Tạm lập Tý · Hậu vận)' : 'Trụ Giờ (Con cái · Hậu vận)', stem: hStem, branch: hBranch, weightStem: info.unknownHour ? 0.45 : 1.0, weightBranch: info.unknownHour ? 0.5 : 1.15 }
      ].map(p => {
        const sMeta = BAZI_STEM_INFO[p.stem];
        const bMeta = BAZI_BRANCH_INFO[p.branch];
        const canChi = `${p.stem} ${p.branch}`;
        return {
          ...p,
          canChi,
          stemEl: sMeta.el,
          stemHan: sMeta.han,
          stemPol: sMeta.pol,
          tenGodStem: p.isDayMaster ? 'NHẬT CHỦ' : getTenGod(dStem, p.stem),
          branchEl: bMeta.el,
          branchHan: bMeta.han,
          napAm: NAP_AM[canChi] || '',
          hiddenStems: bMeta.hidden.map(([hs, ratio], idx) => ({
            stem: hs,
            el: BAZI_STEM_INFO[hs].el,
            ratio,
            role: idx === 0 ? 'Bản khí' : idx === 1 ? 'Trung khí' : 'Dư khí',
            tenGod: getTenGod(dStem, hs)
          }))
        };
      });

      // Cân đong điểm lực lượng 5 Hành: tách bạch 8 chữ Bề mặt (rawCounts) & Tàng Can ẩn dưới Địa Chi (hiddenCounts)
      const scores = { Moc: 0, Hoa: 0, Tho: 0, Kim: 0, Thuy: 0 };
      const rawCounts = { Moc: 0, Hoa: 0, Tho: 0, Kim: 0, Thuy: 0 };
      const hiddenCounts = { Moc: 0, Hoa: 0, Tho: 0, Kim: 0, Thuy: 0 };
      pillars.forEach(p => {
        scores[p.stemEl] += p.weightStem;
        rawCounts[p.stemEl] += 1;
        rawCounts[p.branchEl] += 1;
        p.hiddenStems.forEach(hs => {
          scores[hs.el] += p.weightBranch * hs.ratio;
          hiddenCounts[hs.el] += 1;
        });
      });

      const totalScore = Object.values(scores).reduce((a, b) => a + b, 0) || 1;
      const pcts = {};
      Object.keys(scores).forEach(k => {
        pcts[k] = Math.round((scores[k] / totalScore) * 100);
      });

      const dmMeta = BAZI_STEM_INFO[dStem];
      const dmElMeta = FIVE_ELEMENTS_META[dmMeta.el];
      const selfEl = dmMeta.el;                  // Tỷ Kiếp (Đồng đảng)
      const resourceEl = dmElMeta.generatedBy;   // Ấn tinh (Sinh trợ Nhật chủ)
      const outputEl = dmElMeta.generates;       // Thực Thương (Xì hơi tinh hoa)
      const wealthEl = dmElMeta.controls;        // Tài tinh (Nhật chủ khắc)
      const officerEl = dmElMeta.controlledBy;   // Quan Sát (Khắc chế Nhật chủ)

      const supportPct = (scores[selfEl] + scores[resourceEl]) / totalScore * 100;

      // Kiểm tra căn khí của Nhật Chủ dưới 4 Địa Chi & Ấn/Tỷ lộ trên 3 Thiên Can ngoài trụ Ngày (để nhận diện chuẩn Tòng Cách)
      const hasStrongSupportRoot = pillars.some(p =>
        p.hiddenStems.some(hs => (hs.el === selfEl || hs.el === resourceEl) && hs.ratio >= 0.25)
      );
      const nonDaySupportStems = pillars.filter(p => !p.isDayMaster && (p.stemEl === selfEl || p.stemEl === resourceEl)).length;
      const counterPct = ((scores[wealthEl] + scores[officerEl]) / totalScore) * 100;
      const isFollowStrong = !info.unknownHour && supportPct >= 86 && rawCounts[officerEl] === 0 && counterPct <= 8;
      const isFollowWeak = !info.unknownHour && supportPct <= 15 && !hasStrongSupportRoot && nonDaySupportStems === 0;

      let strengthType = 'balanced'; // 'follow_strong' | 'follow_weak' | 'strong' | 'weak' | 'balanced'
      let strengthLabel = 'Nhật Chủ Trung Hòa Vững Chãi';
      let specialStructure = null;

      if (isFollowStrong) {
        strengthType = 'follow_strong';
        strengthLabel = `Chuyên Vượng / Tòng Cường Cách (${Math.round(supportPct)}% khí thế độc vượng)`;
      } else if (isFollowWeak) {
        strengthType = 'follow_weak';
        strengthLabel = `Khí Mệnh Tòng Cách (${Math.round(supportPct)}% lực tự chủ — thuận theo thế mạnh)`;
      } else if (supportPct >= 53) {
        strengthType = 'strong';
        strengthLabel = `Thân Vượng (${Math.round(supportPct)}% lực Ấn – Tỷ trợ thân)`;
      } else if (supportPct <= 43) {
        strengthType = 'weak';
        strengthLabel = `Thân Nhược (${Math.round(supportPct)}% lực Ấn – Tỷ, cần bồi trợ gốc)`;
      } else {
        strengthLabel = `Thân Cân Bằng Trung Hòa (${Math.round(supportPct)}% lực tự chủ)`;
      }

      // Xét Điều Hầu Hàn - Nhiệt - Táo - Thấp theo Tháng Tiết Khí
      const isWinterCold = ['Hợi', 'Tý', 'Sửu'].includes(mBranch);
      const isSummerHot = ['Tỵ', 'Ngọ', 'Mùi'].includes(mBranch);
      const isAutumnDry = ['Thân', 'Dậu', 'Tuất'].includes(mBranch);
      let climateNote = `Sinh tháng ${mBranch} (Tiết ${currentTerm.name}) tiết Xuân sinh sôi ôn hòa — khí hậu Tứ trụ không bị quá hàn hay quá táo.`;
      let climateNeedEl = null;
      if (isWinterCold) {
        climateNeedEl = 'Hoa';
        climateNote = `Sinh tháng ${mBranch} (Tiết ${currentTerm.name}) tiết trời Đông hàn lạnh — phép Điều Hầu rất quý ánh ấm của hành Hỏa để sưởi mệnh cục thông suốt.`;
      } else if (isSummerHot) {
        climateNeedEl = 'Thuy';
        climateNote = `Sinh tháng ${mBranch} (Tiết ${currentTerm.name}) tiết trời Hạ viêm nhiệt khô nóng — phép Điều Hầu rất khát dòng mát của hành Thủy để nhuận mệnh an thần.`;
      } else if (isAutumnDry) {
        climateNeedEl = mBranch === 'Tuất' ? 'Thuy' : null;
        climateNote = mBranch === 'Tuất'
          ? `Sinh tháng Tuất (Tiết ${currentTerm.name}) cuối Thu Thổ táo khô hanh — rất ưa hành Thủy tưới nhuận để khí mạch không khô kiệt.`
          : `Sinh tháng ${mBranch} (Tiết ${currentTerm.name}) tiết Thu Kim khí thanh sảng — hợp Thủy – Mộc thông dòng hoặc Hỏa ôn luyện vừa độ.`;
      }

      // Xác định Dụng Thần, Hỷ Thần, Kỵ Thần chuẩn Phù Ức + Điều Hầu + Tòng Cách đặc biệt
      let yongShenEl = resourceEl;
      let xiShenEl = selfEl;
      let jiShenEl = officerEl;
      let yongReason = '';

      if (strengthType === 'follow_strong') {
        yongShenEl = selfEl;
        xiShenEl = scores[outputEl] >= scores[resourceEl] ? outputEl : resourceEl;
        jiShenEl = officerEl;
        specialStructure = {
          type: 'follow_strong',
          title: `Chuyên Vượng / Tòng Cường Cách (Thuận khí ${dmElMeta.name})`,
          desc: `Toàn cục Tứ trụ tụ khí hành ${dmElMeta.name} – ${FIVE_ELEMENTS_META[resourceEl].name} áp đảo (${Math.round(supportPct)}%) và không bị Quan Sát phá cục. Theo cổ pháp Tử Bình "Cực vượng bất khả nghịch", không dùng hành khắc chế mà thuận theo khí thế của hành ${FIVE_ELEMENTS_META[yongShenEl].name} & ${FIVE_ELEMENTS_META[xiShenEl].name}; tối kỵ hành ${FIVE_ELEMENTS_META[jiShenEl].name} kích nộ vượng thần.`
        };
        yongReason = specialStructure.desc;
      } else if (strengthType === 'follow_weak') {
        const dominantEl = [wealthEl, officerEl, outputEl].sort((a, b) => scores[b] - scores[a])[0];
        if (dominantEl === wealthEl) {
          yongShenEl = wealthEl;
          xiShenEl = outputEl;
          jiShenEl = selfEl;
          specialStructure = {
            type: 'tong_tai',
            title: `Khí Mệnh Tòng Tài Cách (Thuận theo Tài tinh ${FIVE_ELEMENTS_META[wealthEl].name})`,
            desc: `Nhật chủ ${dStem} vô căn độc lập trên 4 trụ (${Math.round(supportPct)}%), khí thế Tài tinh ${FIVE_ELEMENTS_META[wealthEl].name} làm chủ toàn cục. Thay vì cố bồi Ấn – Tỷ ngược dòng, phép Tòng Tài thuận theo hành ${FIVE_ELEMENTS_META[yongShenEl].name} (Tài) làm Dụng Thần và hành ${FIVE_ELEMENTS_META[xiShenEl].name} (Thực Thương sinh Tài) làm Hỷ Thần; kỵ hành ${FIVE_ELEMENTS_META[jiShenEl].name} tranh đoạt Tài.`
          };
        } else if (dominantEl === officerEl) {
          yongShenEl = officerEl;
          xiShenEl = wealthEl;
          jiShenEl = outputEl;
          specialStructure = {
            type: 'tong_sat',
            title: `Khí Mệnh Tòng Sát Cách (Thuận theo Quan Sát ${FIVE_ELEMENTS_META[officerEl].name})`,
            desc: `Nhật chủ ${dStem} vô căn (${Math.round(supportPct)}%), toàn bàn quy phục khí thế Quan Sát ${FIVE_ELEMENTS_META[officerEl].name}. Đắc phép Tòng Sát: lấy hành ${FIVE_ELEMENTS_META[yongShenEl].name} làm Dụng Thần và hành ${FIVE_ELEMENTS_META[xiShenEl].name} (Tài sinh Sát) làm Hỷ Thần; tối kỵ hành ${FIVE_ELEMENTS_META[jiShenEl].name} (Thực Thương khắc Sát) gây xung chiến.`
          };
        } else {
          yongShenEl = outputEl;
          xiShenEl = wealthEl;
          jiShenEl = resourceEl;
          specialStructure = {
            type: 'tong_nhi',
            title: `Thuận Cục Tòng Nhi Cách (Thuận theo Thực Thương ${FIVE_ELEMENTS_META[outputEl].name})`,
            desc: `Nhật chủ ${dStem} vô căn (${Math.round(supportPct)}%), tinh hoa dồn trọn sang Thực Thương ${FIVE_ELEMENTS_META[outputEl].name} ("Tòng nhi hỷ kiến nhi sinh nhi"). Lấy hành ${FIVE_ELEMENTS_META[yongShenEl].name} làm Dụng Thần và hành ${FIVE_ELEMENTS_META[xiShenEl].name} (Tài tinh) làm Hỷ Thần khơi thông tài hoa; tối kỵ hành ${FIVE_ELEMENTS_META[jiShenEl].name} (Kiêu Ấn đoạt Thực).`
          };
        }
        yongReason = specialStructure.desc;
      } else if (strengthType === 'strong') {
        const candidates = [outputEl, wealthEl, officerEl];
        if (isWinterCold && candidates.includes('Hoa')) {
          yongShenEl = 'Hoa';
        } else if (isSummerHot && candidates.includes('Thuy')) {
          yongShenEl = 'Thuy';
        } else {
          yongShenEl = candidates.slice().sort((a, b) => scores[a] - scores[b])[0];
        }
        const genYong = FIVE_ELEMENTS_META[yongShenEl].generatedBy;
        xiShenEl = candidates.includes(genYong) ? genYong : candidates.find(c => c !== yongShenEl) || wealthEl;
        jiShenEl = scores[selfEl] >= scores[resourceEl] ? selfEl : resourceEl;
        yongReason = `Nhật chủ ${dStem} (${dmElMeta.name}) đắc lực Ấn – Tỷ khá dày (${Math.round(supportPct)}%), nội lực sung mãn nên lấy hành ${FIVE_ELEMENTS_META[yongShenEl].name} làm Dụng Thần để khơi thông tài năng ra thành quả thực tế, kèm hành ${FIVE_ELEMENTS_META[xiShenEl].name} làm Hỷ Thần trợ lực; tiết chế bớt hành ${FIVE_ELEMENTS_META[jiShenEl].name}.`;
      } else if (strengthType === 'weak') {
        if (isWinterCold && (resourceEl === 'Hoa' || selfEl === 'Hoa')) {
          yongShenEl = 'Hoa';
          xiShenEl = resourceEl === 'Hoa' ? selfEl : resourceEl;
        } else if (isSummerHot && (resourceEl === 'Thuy' || selfEl === 'Thuy')) {
          yongShenEl = 'Thuy';
          xiShenEl = resourceEl === 'Thuy' ? selfEl : resourceEl;
        } else if (scores[officerEl] >= scores[outputEl] && scores[officerEl] >= scores[wealthEl]) {
          yongShenEl = resourceEl;
          xiShenEl = selfEl;
        } else {
          yongShenEl = scores[resourceEl] <= scores[selfEl] ? resourceEl : selfEl;
          xiShenEl = yongShenEl === resourceEl ? selfEl : resourceEl;
        }
        jiShenEl = [wealthEl, officerEl, outputEl].sort((a, b) => scores[b] - scores[a])[0];
        yongReason = `Nhật chủ ${dStem} (${dmElMeta.name}) đang gánh nhiều Tài – Quan – Thực xung quanh (lực trợ thân ${Math.round(supportPct)}%), giống như người đứng trước việc lớn cần bồi gốc thể lực & quý nhân trước: lấy hành ${FIVE_ELEMENTS_META[yongShenEl].name} làm Dụng Thần và hành ${FIVE_ELEMENTS_META[xiShenEl].name} làm Hỷ Thần nâng đỡ bản mệnh, tiết chế bớt hành ${FIVE_ELEMENTS_META[jiShenEl].name}.`;
      } else {
        if (isWinterCold) {
          yongShenEl = 'Hoa';
          xiShenEl = 'Moc';
        } else if (isSummerHot) {
          yongShenEl = 'Thuy';
          xiShenEl = 'Kim';
        } else {
          yongShenEl = Object.keys(scores).sort((a, b) => scores[a] - scores[b])[0];
          xiShenEl = FIVE_ELEMENTS_META[yongShenEl].generatedBy;
        }
        jiShenEl = Object.keys(scores).sort((a, b) => scores[b] - scores[a])[0];
        yongReason = `Bát tự của bạn đạt thế Trung Hòa quý giá (${Math.round(supportPct)}% lực tự chủ). Chọn hành ${FIVE_ELEMENTS_META[yongShenEl].name} làm Dụng Thần và hành ${FIVE_ELEMENTS_META[xiShenEl].name} làm Hỷ Thần để điều hòa khí hậu mệnh cục và nuôi dưỡng vòng Ngũ hành chu lưu.`;
      }

      // Tách rõ: (1) Khuyết tuyệt đối cả Tàng lẫn Lộ, (2) Khuyết trên 8 chữ mặt trụ (nhưng còn tia ẩn Tàng Can), (3) Mỏng yếu
      const surfaceMissingKeys = Object.keys(scores).filter(k => rawCounts[k] === 0);
      const totalMissingKeys = surfaceMissingKeys.filter(k => hiddenCounts[k] === 0);
      const hiddenOnlyKeys = surfaceMissingKeys.filter(k => hiddenCounts[k] > 0);
      const weakElements = Object.keys(scores).filter(k => rawCounts[k] > 0 && pcts[k] <= 13);
      const excessElements = Object.keys(scores).filter(k => pcts[k] >= 32);

      const lunarTuTruMonth = info.tuTru?.month || '';
      const baziMonthCanChi = `${mStem} ${mBranch}`;
      const hasSolarTermDiff = lunarTuTruMonth && lunarTuTruMonth !== baziMonthCanChi;

      // Đối chiếu giao thoa với Cung Quan Lộc & Mệnh Cung bên Tử Vi
      const quanPal = Object.values(horoscope.palaces).find(p => p.palaceName === 'QUAN LỘC');
      const menhPal = horoscope.palaces[info.menhBranch];
      const quanStars = quanPal ? (quanPal.majorStars.map(s => s.name).join(' · ') || 'Vô Chính Diệu') : '';
      const menhStars = menhPal ? (menhPal.majorStars.map(s => s.name).join(' · ') || 'Vô Chính Diệu') : '';

      return {
        sunDeg: sunDeg.toFixed(1),
        currentTerm,
        nextTerm,
        baziSolarYear,
        pillars,
        dayMaster: {
          stem: dStem,
          branch: dBranch,
          canChi: `${dStem} ${dBranch}`,
          meta: dmMeta,
          elMeta: dmElMeta
        },
        scores,
        pcts,
        rawCounts,
        hiddenCounts,
        supportPct: Math.round(supportPct),
        strengthType,
        strengthLabel,
        specialStructure,
        climateNote,
        climateNeed: climateNeedEl ? FIVE_ELEMENTS_META[climateNeedEl] : null,
        yongShen: FIVE_ELEMENTS_META[yongShenEl],
        xiShen: FIVE_ELEMENTS_META[xiShenEl],
        jiShen: FIVE_ELEMENTS_META[jiShenEl],
        yongReason,
        surfaceMissingElements: surfaceMissingKeys.map(k => FIVE_ELEMENTS_META[k]),
        missingElements: totalMissingKeys.map(k => FIVE_ELEMENTS_META[k]),
        hiddenOnlyElements: hiddenOnlyKeys.map(k => FIVE_ELEMENTS_META[k]),
        weakElements: weakElements.map(k => FIVE_ELEMENTS_META[k]),
        excessElements: excessElements.map(k => FIVE_ELEMENTS_META[k]),
        hasSolarTermDiff,
        lunarTuTruMonth,
        baziMonthCanChi,
        crossTuVi: {
          menhStars,
          quanStars,
          menhBranch: info.menhBranch,
          quanBranch: quanPal ? quanPal.branchName : 'Tý'
        }
      };
    }

    function BaziYongShenSubsystem({ horoscope, appliedData, onUpdateApplied, onCreateNewProfile, onOpenFormModal, onJumpToAlmanac, onJumpToTuViPalace }) {
      const bazi = useMemo(() => computeBaziYongShen(horoscope), [horoscope]);
      const elementOrder = ['Moc', 'Hoa', 'Tho', 'Kim', 'Thuy'];
      const [guideElKey, setGuideElKey] = useState(bazi.yongShen.key);

      useEffect(() => {
        setGuideElKey(bazi.yongShen.key);
      }, [bazi.yongShen.key, horoscope.info.name, horoscope.info.solarText, horoscope.info.birthHour]);

      const activeGuideMeta = FIVE_ELEMENTS_META[guideElKey] || bazi.yongShen;
      const isViewingYong = activeGuideMeta.key === bazi.yongShen.key;
      const isViewingXi = activeGuideMeta.key === bazi.xiShen.key;
      const isViewingJi = activeGuideMeta.key === bazi.jiShen.key;
      const isViewingSurfaceMissing = bazi.surfaceMissingElements.some(x => x.key === activeGuideMeta.key);

      // Tạo dòng tóm tắt "Khuyết gì trên mặt 8 chữ?" thật dễ hiểu cho người mới
      const surfaceMissingHeadline = bazi.missingElements.length > 0
        ? `Khuyết hẳn hành ${bazi.missingElements.map(x => x.name).join(', ')} (0/8 chữ nổi & 0 Tàng Can)`
        : bazi.hiddenOnlyElements.length > 0
        ? `Vắng hành ${bazi.hiddenOnlyElements.map(x => x.name).join(', ')} trên 8 chữ mặt trụ (0/8 chữ nổi, chỉ ẩn nhẹ trong Tàng Can)`
        : bazi.weakElements.length > 0
        ? `Đủ 5 hành trên 8 chữ, nhưng mỏng hành ${bazi.weakElements.map(x => x.name).join(', ')}`
        : 'Đủ mặt cả 5 hành Kim · Mộc · Thủy · Hỏa · Thổ khá cân đối';

      return (
        <div className="flex-1 w-full lg:overflow-y-auto p-1.5 sm:p-3 font-serif">
          <div className="max-w-[1380px] mx-auto xuan-paper rounded-sm border-2 border-[#8C6226] shadow-2xl overflow-hidden">
            {/* HEADER CHƯƠNG BÁT TỰ DỤNG THẦN */}
            <div className="p-4 sm:p-5 bg-[#EFE6D4] border-b-2 border-[#8C6226] flex flex-col lg:flex-row lg:items-center justify-between gap-3">
              <div className="space-y-1">
                <div className="flex items-center gap-2 flex-wrap">
                  <span className="px-2 py-0.5 rounded-sm seal-red text-xs font-bold">八字用神</span>
                  <h2 className="text-lg sm:text-xl font-bold text-[#9E241E]">
                    Bát Tự Tứ Trụ · Soi Khuyết Ngũ Hành &amp; Gợi Ý Cân Bằng — {horoscope.info.name}
                  </h2>
                </div>
                <p className="text-xs text-[#4A3822]">
                  Tính trụ tháng theo <strong>24 Tiết Khí Mặt Trời ({bazi.sunDeg}° · Tiết {bazi.currentTerm.name} {bazi.currentTerm.hanzi})</strong> &amp; <strong>Giờ Mặt Trời {horoscope.info.trueHourText} tại {horoscope.info.city}</strong>.
                </p>
              </div>
              <div className="flex flex-wrap items-center gap-2 font-ui shrink-0">
                {onCreateNewProfile && (
                  <button
                    type="button"
                    onClick={onCreateNewProfile}
                    className="px-3 py-2 rounded-sm bg-[#FAF6ED] hover:border-[#9E241E] border border-[#8C6226] text-[#9E241E] font-bold text-xs cursor-pointer transition"
                  >
                    + Tạo Hồ Sơ Mới
                  </button>
                )}
                <button
                  type="button"
                  onClick={onOpenFormModal}
                  className="px-3.5 py-2 rounded-sm seal-red hover:brightness-110 font-bold text-xs cursor-pointer transition shadow-sm"
                >
                  ✎ Đổi Ngày Sinh / Hồ Sơ
                </button>
                <button
                  type="button"
                  onClick={() => onJumpToAlmanac('contract')}
                  className="px-3 py-2 rounded-sm seal-jade hover:brightness-110 font-bold text-xs cursor-pointer transition"
                >
                  宿 Chọn Ngày Hợp Hành {bazi.yongShen.name} →
                </button>
              </div>
            </div>

            <div className="p-4 sm:p-6 space-y-6 text-[#1C1610]">
              <ResultAssumptionsBanner

              />

              {/* ===================================================================== */}
              {/* HỘP CHẨN ĐOÁN NHANH 3 TẦNG: LÀM SAO BIẾT BÁT TỰ KHUYẾT GÌ & BỒI GÌ?   */}
              {/* ===================================================================== */}
              <section className="p-4 sm:p-5 bg-[#F8F1E1] border-2 border-[#C7B28E] rounded-sm space-y-3.5 relative overflow-hidden">
                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-[#DFD2BC] pb-2.5">
                  <div>
                    <div className="text-[11px] font-ui font-bold uppercase tracking-[0.16em] text-[#8C6226]">
                      ✦ Giải Thích Ngắn Gọn — Nhìn Rõ Trong 3 Bước
                    </div>
                    <h3 className="text-base sm:text-lg font-bold text-[#9E241E]">
                      Làm Sao Biết Bát Tự Khuyết Hành Gì &amp; Dụng Thần Là Gì?
                    </h3>
                    <p className="text-xs font-ui text-[#57452F] mt-0.5">
                      Hiểu đơn giản: <strong>Dụng Thần</strong> là ngũ hành giúp lá số cân bằng lại (quá nóng thì làm mát, quá yếu thì tiếp sức), chứ không phải hễ đếm thấy thiếu chữ nào là đắp chữ đó.
                    </p>
                  </div>
                  <span className="text-xs font-ui text-[#6E5638]">
                    Đương số: <strong className="text-[#9E241E]">{horoscope.info.solarText} · {horoscope.info.birthHour}</strong>
                  </span>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-3.5 text-xs">
                  {/* Bước 1: Đếm 8 chữ Bát Tự */}
                  <div className="p-3.5 bg-[#FAF6ED] border border-[#D4C4A8] border-t-4 border-t-[#8C6226] rounded-sm space-y-1.5">
                    <div className="font-ui font-bold text-[11px] uppercase tracking-wider text-[#7A5219]">
                      Bước 1 · Đếm 8 Chữ Năm – Tháng – Ngày – Giờ
                    </div>
                    <div className="font-bold text-sm text-[#1C1610]">
                      {surfaceMissingHeadline}
                    </div>
                    <p className="text-[#4A3822] leading-relaxed">
                      Mỗi trụ gồm 1 Thiên Can + 1 Địa Chi (tổng cộng <strong>8 chữ</strong>). Khi xem "khuyết Ngũ hành", người ta thường đếm 8 chữ nổi này trước: hiện lá số có{' '}
                      <strong>
                        {elementOrder.map(k => `${bazi.rawCounts[k]} ${FIVE_ELEMENTS_META[k].name}`).join(' · ')}
                      </strong>.
                    </p>
                  </div>

                  {/* Bước 2: Soi Mùa Sinh Hàn - Nhiệt */}
                  <div className="p-3.5 bg-[#FAF6ED] border border-[#D4C4A8] border-t-4 border-t-[#196B50] rounded-sm space-y-1.5">
                    <div className="font-ui font-bold text-[11px] uppercase tracking-wider text-[#156839]">
                      Bước 2 · Soi Mùa Sinh Hàn – Nhiệt (Điều Hầu)
                    </div>
                    <div className="font-bold text-sm text-[#156839]">
                      {bazi.climateNeed
                        ? `Khí hậu tháng ${bazi.pillars[1].branch} ưu tiên hành ${bazi.climateNeed.name} điều hòa`
                        : `Sinh tiết ${bazi.currentTerm.name} khí hậu ôn hòa`}
                    </div>
                    <p className="text-[#4A3822] leading-relaxed">
                      {bazi.climateNote} Người sinh mùa Hè khô nóng hay được khuyên <em>bổ Thủy làm mát</em>; người sinh mùa Đông giá lạnh lại cần <em>bổ Hỏa sưởi ấm</em>.
                    </p>
                  </div>

                  {/* Bước 3: Chốt Dụng Thần */}
                  <div className="p-3.5 bg-[#FEF6DF] border-2 border-[#9E241E] rounded-sm space-y-1.5">
                    <div className="font-ui font-bold text-[11px] uppercase tracking-wider text-[#9E241E]">
                      Bước 3 · Gợi Ý Hành Cần Bồi Theo Mô Hình Ứng Dụng
                    </div>
                    <div className="font-bold text-sm text-[#9E241E]">
                      Gợi ý bồi: Hành {bazi.yongShen.name} (Dụng Thần) &amp; {bazi.xiShen.name} (Hỷ Thần)
                    </div>
                    <p className="text-[#3D3022] leading-relaxed">
                      Thay vì bồi máy móc theo chữ bị khuyết, mô hình này chọn hành giúp Nhật Chủ <strong>{bazi.dayMaster.stem}</strong> cân bằng làm gốc cho các gợi ý ăn mặc, hướng đầu giường và nước uống bên dưới.
                    </p>
                  </div>
                </div>

                {bazi.specialStructure && (
                  <div className="p-3 bg-[#FBECEB] border-2 border-[#9E241E] rounded-sm text-xs space-y-1 leading-relaxed">
                    <div className="font-bold text-[#9E241E] flex items-center gap-1.5">
                      <span className="seal-red px-1.5 py-0.5 rounded-sm text-[10px]">特別格局</span>
                      <span>Phát Hiện Cách Cục Đặc Biệt: {bazi.specialStructure.title}</span>
                    </div>
                    <p className="text-[#3D3022]">{bazi.specialStructure.desc}</p>
                  </div>
                )}

                {/* Minh bạch hóa mô hình quy tắc định lượng của ứng dụng */}
                <div className="p-2.5 bg-[#EFE6D4]/80 border border-[#C7B28E] rounded-sm text-[11.5px] font-ui text-[#4A3822] leading-relaxed">
                  <strong className="text-[#7A5219]">Lưu ý về phương pháp định Dụng Thần:</strong> Kết quả trên được tính bằng <strong>mô hình quy tắc định lượng riêng của ứng dụng</strong> (trọng số Nguyệt Lệnh 2.5, Nhật Chi 1.35, Tàng Can, ngưỡng 43%–53% kết hợp Điều Hầu mùa sinh và nhánh <strong>Tòng Cách cực đoan</strong> ≤15% vô căn / ≥86% độc vượng) để diễn giải nhất quán, <strong>không thay thế hoàn toàn phép luận Hóa Khí hay Thông Quan chuyên biệt của từng lưu phái Tử Bình</strong>. Bạn có thể bấm chọn bất kỳ hành nào ở mục 4 bên dưới để xem cẩm nang sinh hoạt tương ứng.
                </div>
              </section>

    // Chu kỳ 28 sao bất biến theo Ngày Julius (JD), đồng bộ Thất Diệu theo Thứ trong tuần:
    // VD: Chủ Nhật 15/11/2026 (JD 2461360) -> (2461360 + 11) % 28 = 3 (Phòng Nhật Thố);
    //     Thứ Năm 01/01/2026 (JD 2461042) -> (2461042 + 11) % 28 = 21 (Tỉnh Mộc Hạn).
    function getMansion28ByJd(jd) {
      const idx = ((jd + 11) % 28 + 28) % 28;
      return MANSIONS_28_DB[idx];
    }

    function isSameTamHop(b1, b2) {
      if (b1 === b2) return false;
      return TAM_HOP_GROUPS.some(g => g.includes(b1) && g.includes(b2));
    }

    function evaluateSingleAlmanacDay(sDay, sMonth, sYear, purpose, horoscope, bazi) {
      const jd = jdFromDate(sDay, sMonth, sYear);
      const weekday = WEEKDAY_NAMES_VN[jd % 7]; // jd=2451545 (Thứ Bảy) -> 2451545 % 7 = 5 -> Thứ Bảy!
      const lunar = convertSolar2LunarVN(sDay, sMonth, sYear, 7, 0);
      const sunDeg = getSunLongitudeDeg(jd + 0.5, 7);
      const termObj = SOLAR_TERMS_24[Math.floor(sunDeg / 15) % 24];
      const mOrderFromDan = Math.floor(((sunDeg - 315 + 360) % 360) / 30);
      const mBranchIdx = (2 + mOrderFromDan) % 12;

      const dStemIdx = ((jd + 9) % 10 + 10) % 10;
      const dBranchIdx = ((jd + 1) % 12 + 12) % 12;
      const dStem = CAN[dStemIdx];
      const dBranch = CHI[dBranchIdx];
      const dayCanChi = `${dStem} ${dBranch}`;
      const dayStemEl = BAZI_STEM_INFO[dStem].el;
      const dayBranchEl = BAZI_BRANCH_INFO[dBranch].el;

      // 1. Nhị Thập Bát Tú trực ngày
      const mansion = getMansion28ByJd(jd);

      // 2. Thập Nhị Kiến Trừ (12 Trực)
      const trucIdx = (dBranchIdx - mBranchIdx + 12) % 12;
      const truc = TRUC_12_DB[trucIdx];

      // 3. Thần Hoàng Đạo / Hắc Đạo của Ngày
      const hdStart = HOANG_DAO_START_BY_BRANCH[mBranchIdx] ?? 0;
      const deityIdx = (dBranchIdx - hdStart + 12) % 12;
      const deity = HOANG_DAO_12_DEITIES[deityIdx];

      // 4. Ngày kỵ dân gian Việt Nam (Tam Nương & Nguyệt Kỵ)
      const isTamNuong = [3, 7, 13, 18, 22, 27].includes(lunar.lunarDay);
      const isNguyetKy = [5, 14, 23].includes(lunar.lunarDay);

      // 5. Đối chiếu Tuổi & Nhật Chủ + Dụng Thần Bát Tự của đương số
      const userYearBranchIdx = horoscope.info.yearBranchIdx;
      const userYearStem = horoscope.info.yearStem;
      const dmBranchIdx = CHI.indexOf(bazi.dayMaster.branch);
      const isXungTuoi = ((dBranchIdx + 6) % 12 === userYearBranchIdx);
      const isXungNhatChu = ((dBranchIdx + 6) % 12 === dmBranchIdx);
      const isTamHopTuoi = isSameTamHop(dBranchIdx, userYearBranchIdx);
      const isLucHopTuoi = LUC_HOP_PAIRS[userYearBranchIdx] === dBranchIdx;
      const quyNhanPair = QUY_NHAN_BY_CAN[userYearStem] || QUY_NHAN_BY_CAN[bazi.dayMaster.stem] || [];
      const isQuyNhan = quyNhanPair.includes(dBranchIdx);

      const yongKey = bazi.yongShen.key;
      const xiKey = bazi.xiShen.key;
      const jiKey = bazi.jiShen.key;
      const matchesYong = (dayStemEl === yongKey || dayBranchEl === yongKey);
      const matchesXi = (dayStemEl === xiKey || dayBranchEl === xiKey);
      const matchesJiBoth = (dayStemEl === jiKey && dayBranchEl === jiKey);

      // Chấm điểm tổng hợp thang 100
      let score = 56;
      const reasons = [];
      const warnings = [];

      // Điểm 28 Tú
      if (mansion.good.includes(purpose)) {
        score += 16;
        reasons.push(`Sao ${mansion.name} (${mansion.full}) đại lợi cho ${ALMANAC_PURPOSES[purpose].short.toLowerCase()}`);
      } else if (mansion.rank === 'cat' && !mansion.avoid.includes(purpose)) {
        score += 9;
        reasons.push(`Sao ${mansion.name} thuộc nhóm Cát tú phương Đông`);
      } else if (mansion.avoid.includes(purpose) || mansion.rank === 'hung') {
        score -= 16;
        warnings.push(`Trực sao ${mansion.name} (${mansion.han}) kỵ khởi sự này`);
      }

      // Điểm 12 Trực
      if (truc.good.includes(purpose)) {
        score += 14;
        reasons.push(`Trực ${truc.name} đúng việc cát lợi`);
      } else if (truc.avoid.includes(purpose) || truc.rank === 'hung') {
        score -= 18;
        warnings.push(`Trực ${truc.name} không thuận cho việc đã chọn`);
      } else if (truc.rank === 'cat') {
        score += 6;
      }

      // Điểm Hoàng Đạo
      if (deity.hoang) {
        score += 10;
        reasons.push(`${deity.name} Hoàng Đạo`);
      } else {
        score -= 6;
      }

      // Phạt ngày kỵ & xung tuổi
      if (isXungTuoi) {
        score -= 32;
        warnings.push(`Ngày ${dBranch} lục xung trực diện với tuổi ${horoscope.info.yearBranch} của bạn`);
      } else if (isXungNhatChu) {
        score -= 14;
        warnings.push(`Chi ngày ${dBranch} xung trụ ngày ${bazi.dayMaster.canChi}`);
      }
      if (isTamNuong && purpose !== 'medical') {
        score -= 15;
        warnings.push(`Vướng ngày Tam Nương (mùng/ngày ${lunar.lunarDay} ÂL)`);
      }
      if (isNguyetKy && purpose !== 'medical') {
        score -= 14;
        warnings.push(`Vướng ngày Nguyệt Kỵ (${lunar.lunarDay} ÂL)`);
      }

      // Điểm thưởng Cá nhân hóa (Hợp tuổi + Quý nhân + Dụng thần Bát tự)
      if (isLucHopTuoi) {
        score += 10;
        reasons.push(`Lục hợp với tuổi ${horoscope.info.yearBranch}`);
      } else if (isTamHopTuoi) {
        score += 9;
        reasons.push(`Tam hợp với tuổi ${horoscope.info.yearBranch}`);
      }
      if (isQuyNhan) {
        score += 8;
        reasons.push(`Đắc Thiên Ất Quý Nhân theo mệnh`);
      }
      if (matchesYong) {
        score += 11;
        reasons.push(`Vượng khí Dụng Thần (${bazi.yongShen.name})`);
      } else if (matchesXi) {
        score += 6;
        reasons.push(`Trợ khí Hỷ Thần (${bazi.xiShen.name})`);
      } else if (matchesJiBoth) {
        score -= 6;
      }

      score = Math.max(12, Math.min(99, Math.round(score)));

      // 6 Khung Giờ Hoàng Đạo trong ngày đó + đánh dấu Giờ hợp Dụng Thần / Quý Nhân
      const hourHdStart = HOANG_DAO_START_BY_BRANCH[dBranchIdx] ?? 0;
      const ratHourStemStart = ((dStemIdx % 5) * 2) % 10;
      const auspiciousHours = [];
      for (let hIdx = 0; hIdx < 12; hIdx++) {
        const hDeity = HOANG_DAO_12_DEITIES[(hIdx - hourHdStart + 12) % 12];
        if (!hDeity.hoang) continue;
        if ((hIdx + 6) % 12 === userYearBranchIdx) continue; // Bỏ giờ xung tuổi
        const hStem = CAN[(ratHourStemStart + hIdx) % 10];
        const hBranch = CHI[hIdx];
        const hEl = BAZI_BRANCH_INFO[hBranch].el;
        const hStemEl = BAZI_STEM_INFO[hStem].el;
        const isBestForUser = (hEl === yongKey || hStemEl === yongKey || quyNhanPair.includes(hIdx));
        auspiciousHours.push({
          branch: hBranch,
          canChi: `${hStem} ${hBranch}`,
          range: HOUR_RANGES_12[hIdx],
          deity: hDeity.name,
          isBestForUser
        });
      }

      const tier = (score >= 80 && !isXungTuoi && warnings.length === 0)
        ? 'daicat'
        : (score >= 68 && !isXungTuoi)
        ? 'kha'
        : score >= 52
        ? 'binh'
        : 'ky';

      return {
        jd,
        sDay,
        sMonth,
        sYear,
        weekday,
        solarStr: `${String(sDay).padStart(2, '0')}/${String(sMonth).padStart(2, '0')}/${sYear}`,
        lunar,
        lunarStr: `${String(lunar.lunarDay).padStart(2, '0')}/${String(lunar.lunarMonth).padStart(2, '0')}${lunar.isLeap ? 'N' : ''}`,
        termName: termObj.name,
        dayCanChi,
        dStem,
        dBranch,
        dayNapAm: NAP_AM[dayCanChi] || '',
        mansion,
        truc,
        deity,
        isTamNuong,
        isNguyetKy,
        isXungTuoi,
        isLucHopTuoi,
        isTamHopTuoi,
        isQuyNhan,
        matchesYong,
        matchesXi,
        score,
        tier,
        reasons,
        warnings,
        auspiciousHours
      };
    }

    function Almanac28MansionsSubsystem({ horoscope, initialPurpose, onOpenFormModal, onJumpToBazi }) {

        setSelectedDayNum(1);

      return (

            <div className="p-4 sm:p-5 bg-[#EFE6D4] border-b-2 border-[#8C6226] flex flex-col lg:flex-row lg:items-center justify-between gap-3">
              <div className="space-y-1">
                <div className="flex items-center gap-2 flex-wrap">
                  <span className="px-2 py-0.5 rounded-sm seal-red text-xs font-bold">二十八宿 · 擇日</span>
                  <h2 className="text-lg sm:text-xl font-bold text-[#9E241E]">
                    Nhị Thập Bát Tú (28 Chòm Sao) &amp; Chọn Ngày Giờ Tốt — {horoscope.info.name}
                  </h2>
                </div>
                <p className="text-xs text-[#4A3822]">
                  Sao bản mệnh ngày sinh: <strong className="text-[#9E241E]">{natalMansion.full} ({natalMansion.han} · {natalMansion.group})</strong> · Lọc riêng cho tuổi <strong>{horoscope.info.yearCanChi}</strong> &amp; Dụng Thần <strong>{bazi.yongShen.name}</strong>.
                </p>
              </div>

              <div className="flex flex-wrap items-center gap-2 font-ui shrink-0">
                <div className="inline-flex rounded-sm border border-[#8C6226] overflow-hidden">
                  <button
                    type="button"
                    onClick={() => setSubView('picker')}
                    className={`px-3 py-1.5 text-xs font-bold cursor-pointer ${subView === 'picker' ? 'seal-red' : 'bg-[#FAF6ED] text-[#57452F]'}`}
                  >
                    📅 Chọn Ngày Giờ Tốt Theo Tuổi
                  </button>
                  <button
                    type="button"
                    onClick={() => setSubView('constellations28')}
                    className={`px-3 py-1.5 text-xs font-bold cursor-pointer ${subView === 'constellations28' ? 'seal-red' : 'bg-[#FAF6ED] text-[#57452F]'}`}
                  >
                    ✦ Tinh Đồ 28 Chòm Sao Tứ Tượng
                  </button>
                </div>
                <button
                  type="button"
                  onClick={onJumpToBazi}
                  className="px-2.5 py-1.5 rounded-sm seal-amber text-xs font-bold cursor-pointer"
                >
                  八 Xem Dụng Thần ({bazi.yongShen.name})
                </button>
              </div>
            </div>

            {subView === 'picker' ? (
              <div className="p-4 sm:p-6 space-y-5 text-[#1C1610]">
                {/* THANH ĐIỀU KHIỂN CHỌN VIỆC & CHỌN THÁNG */}
                <div className="p-3.5 bg-[#FAF6ED] border border-[#C7B28E] rounded-sm grid grid-cols-1 lg:grid-cols-12 gap-3 items-end font-ui text-xs">

                  </div>
                </div>

                {/* KHỐI CHÍNH: LỊCH THÁNG BÊN TRÁI (7/12) + CHI TIẾT NGÀY & TOP NGÀY ĐẸP BÊN PHẢI (5/12) */}
                <div className="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
                  {/* Cột Trái (7/12): Bàn Lịch 28 Tú & Top Ngày Đại Cát */}

                        <div className="flex items-center gap-2">

                      <div className="grid grid-cols-7 gap-1 text-center text-[10.5px] font-ui font-bold text-[#6E5638] py-1">

                                </span>

              // Tự động đồng bộ lại các hồ sơ mẫu famous-* chuẩn xác mới nhất mà vẫn giữ nguyên mọi hồ sơ do người dùng lập
              const builtinMap = Object.fromEntries(DEFAULT_SAVED_PROFILES.map(p => [p.id, p]));
              const merged = parsed.map(p => (p && builtinMap[p.id] && String(p.id).startsWith('famous-')) ? builtinMap[p.id] : sanitizeProfile(p));
              DEFAULT_SAVED_PROFILES.forEach(defP => {
                if (String(defP.id).startsWith('famous-') && !merged.some(m => m.id === defP.id)) {
                  merged.push(defP);
                }
              });
              return merged;
            }
          }
        } catch (e) {}
        return DEFAULT_SAVED_PROFILES;
      });

      const [appliedData, setAppliedData] = useState(() => {

        return DEFAULT_SAVED_PROFILES[0];

          if (existsIdx >= 0) {

                          <option value="trungchau">Trung Châu Phái (Vương Đình Chi)</option>
                        </select>
                      </div>
                      <div>
                        <label className="block font-bold text-[#57452F] mb-0.5">Cách An Sao Thiên Mã</label>
                        <select
                          value={formDraft.thienMaBy || 'year'}
                          onChange={e => setFormDraft({ ...formDraft, thienMaBy: e.target.value })}
                          className="w-full bg-[#FAF6ED] border border-[#B8A27C] rounded-sm px-1.5 py-1 text-[11px] font-bold"
                        >
                          <option value="year">An theo Chi Năm Sinh (Phổ thông)</option>
                          <option value="month">An theo Chi Tháng Sinh (Cổ pháp)</option>
                        </select>
                      </div>
                    </div>
                  </div>

                  <div className="pt-1 space-y-2">
                    <button
                      type="submit"
                      className="w-full py-2.5 rounded-sm seal-red hover:brightness-110 font-bold text-sm flex items-center justify-center gap-2 cursor-pointer transition"
                    >
                      <span>【印】 LƯU VÀO SỔ HỒ SƠ & KHỞI LẬP TINH BÀN</span>
                    </button>
                    <div className="flex items-center justify-between text-[11px] font-ui text-[#6E5638] pt-1">
                      <span>🔒 100% lưu cục bộ trên trình duyệt của bạn, không gửi đi đâu.</span>
                      <button
                        type="button"
                        onClick={handleWipeAllLocalData}
                        className="text-[#9E241E] hover:underline font-bold cursor-pointer"
                      >
                        🗑 Xóa sạch dữ liệu đã lưu
                      </button>
                    </div>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* THANH TÌM KIẾM NHANH TOÀN CỤC (CTRL+K / ⌘K) */}
          <GlobalCommandPalette
            isOpen={showCmdPalette}
            onClose={() => setShowCmdPalette(false)}
            horoscope={horoscope}
            onSelectResult={handleCommandSelect}
          />

          {/* NÚT NỔI HỎI NHANH QUYẾT ĐỊNH KHI ĐANG ĐỌC BÀN CỜ / KHO HỌC THUẬT */}
          {mainSystem !== 'advisor' && mainSystem !== 'home' && (
            <button
              type="button"
              onClick={() => setMainSystem('advisor')}
              className="fixed bottom-3 right-3 z-40 px-3.5 py-2 rounded-full seal-jade shadow-2xl font-ui font-bold text-xs flex items-center gap-1.5 cursor-pointer hover:brightness-110 transition no-print"
              title="Hỏi thẳng một quyết định sát hoàn cảnh sống của bạn"
            >
              <span>✦ Hỏi Quyết Định</span>
            </button>
          )}

          </div>
        </>
      );
    }

    class AppErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, errorMsg: '' };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, errorMsg: error && error.message ? error.message : String(error) };
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-[100dvh] w-full flex items-center justify-center p-4 font-serif">
              <div className="max-w-lg w-full xuan-paper border-2 border-[#8C6226] rounded-sm p-6 shadow-2xl space-y-3 text-[#1C1610]">
                <h2 className="text-lg font-bold text-[#9E241E]">【欽天監】 Đã phát hiện xung đột dữ liệu lưu cũ</h2>
                <p className="text-xs leading-relaxed">
                  Trình duyệt đang lưu một bản ghi hồ sơ từ phiên bản cũ gây lệch cấu trúc: <code className="px-1.5 py-0.5 bg-[#EFE6D4] rounded font-mono">{this.state.errorMsg}</code>
                </p>
                <button
                  type="button"
                  onClick={() => window.__resetTuviAndReload && window.__resetTuviAndReload()}
                  className="px-4 py-2.5 rounded-sm seal-red font-bold text-xs cursor-pointer"
                >
                  Khôi phục hồ sơ mặc định &amp; Tải lại ngay
                </button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      <AppErrorBoundary>
        <App />
      </AppErrorBoundary>
    );
  </script>
</body>
</html>
