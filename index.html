        'PHỤ MẪU': ['Cha mẹ hiền từ, giàu tình thương, gia đình gốc có không khí đầm ấm bao dung.', 'Cha mẹ tính tình mềm mỏng, không tạo áp lực nặng nề lên con cái.'],
        'HUYNH ĐỆ': ['Anh chị em hòa thuận, ít tranh chấp quyền lợi, hay tụ họp ăn uống chia sẻ niềm vui.', 'Anh em tình cảm tốt nhưng sức gánh vác tài chính lớn cho nhau chỉ ở mức vừa phải.'],
        'NÔ BỘC': ['Bạn bè hiền lành, chân thành, nhân viên quý mến người quản lý vì sự tâm lý công bằng.', 'Không nên cả nể cho bạn bè vay mượn không giấy hẹn vì rất ngại đòi lại.']
      },
      'Liêm Trinh': {
        'MỆNH CUNG': ['Thẳng thắn, trọng kỷ cương, liêm khiết nhưng bên trong giàu đam mê và sức hút cá tính đặc biệt.', 'Tính nóng và rạch ròi yêu – ghét; khi hãm gặp sát tinh cần kiềm chế cảm xúc để tránh thị phi pháp lý.'],
        'QUAN LỘC': ['Quan lộc chủ — cực hợp hành chính công quyền, thanh tra, pháp chế, công nghệ điện tử, y mỹ thuật tinh xảo.', 'Làm việc theo chuẩn mực khắt khe nên dễ va chạm đồng sự xuề xòa; giữ đúng luật là tấm khiên tốt nhất.'],
        'TÀI BẠCH': ['Kiếm tiền trong môi trường cạnh tranh cao hoặc gắn với quy chuẩn pháp lý, hợp đồng thương mại rõ ràng.', 'Tránh xa các khoản thu nhập mập mờ lách luật vì Liêm Trinh gặp Kỵ Hình rất nhạy rắc rối giấy tờ.'],
        'PHU THÊ': ['Bạn đời sắc sảo, có gu thẩm mỹ và lòng tự trọng lớn; tình yêu sâu đậm và đòi hỏi sự chung thủy tuyệt đối.', 'Dễ ghen ngầm hoặc khắt khe câu chữ với nhau; giữ khoảng thở riêng giúp hôn nhân bền chặt.'],
        'TỬ TỨC': ['Con cái cá tính rõ nét, thông minh nhạy cảm, có năng khiếu thẩm mỹ hoặc kỹ thuật chính xác.', 'Không nên giáo dục bằng đòn roi hay lời lẽ gay gắt vì con rất nhớ lâu và tự ái cao.'],
        'ĐIỀN TRẠCH': ['Nhà cửa gọn gàng có quy củ; hợp khu dân cư an ninh nghiêm ngặt hoặc gần cơ quan hành chính.', 'Lưu ý an toàn hệ thống điện, phòng cháy chữa cháy và ranh giới sổ đỏ rõ ràng với hàng xóm.'],
        'PHÚC ĐỨC': ['Sống có liêm sỉ và nguyên tắc đạo đức riêng, trong họ có người làm quan chức hoặc lực lượng kỷ luật.', 'Nội tâm hay tự dằn vặt giữa lý trí khắt khe và tình cảm nồng nhiệt, nên tập thiền tĩnh tâm.'],
        'THIÊN DI': ['Ra ngoài năng động, giao thiệp khéo léo với cả giới quy quyền lẫn giới nghệ thuật kinh doanh.', 'Đi lại bên ngoài cần tuân thủ tuyệt đối luật giao thông và giữ chừng mực trong các mối quan hệ khác giới.'],
        'TẬT ÁCH': ['Thuộc Âm Hỏa đới Kim — cần chú ý tim mạch, huyết áp, nóng trong phát ban da liễu và mất ngủ.', 'Đề phòng viêm nhiễm đường máu/dị ứng, nhiệt miệng hoặc căng thẳng thần kinh khi gặp Hóa Kỵ.'],
        'PHỤ MẪU': ['Cha mẹ quản giáo nghiêm khắc, rèn nề nếp lễ nghĩa và tính tự trọng từ tấm bé.', 'Thuở nhỏ dễ chịu kỷ luật khắt khe từ gia đình hoặc cấp trên trực tiếp khó tính.'],
        'HUYNH ĐỆ': ['Anh em thẳng tính, rõ ràng đúng sai, ai làm sai nguyên tắc là góp ý thẳng ngay.', 'Ít anh em hoặc dễ bất đồng quan điểm sống nếu ở chung một mái nhà quá lâu.'],
        'NÔ BỘC': ['Có cộng sự sắc sảo, tháo vát việc khó nhưng đòi hỏi người lãnh đạo phải công minh.', 'Đề phòng nhân viên hoặc bạn xã giao trở mặt gây chuyện thị phi nếu nảy sinh mâu thuẫn lợi ích.']
      },
      'Thiên Phủ': {
        'MỆNH CUNG': ['Kho trời Nam Đẩu — bao dung, điềm đạm, thận trọng chắc chắn, cực giỏi giữ gìn cơ nghiệp và quản lý nguồn lực.', 'Nếu gặp Tuần Triệt Không Kiếp (Kho Trống) thì bề ngoài đủ đầy mà bên trong hay lo hụt hẫng dòng vốn.'],
        'QUAN LỘC': ['Rất vượng làm quản trị tài sản, ngân hàng, kho vận, bất động sản, hậu cần lớn hoặc điều hành doanh nghiệp ổn định.', 'Thiên về giữ vững và mở rộng chắc chắn hơn là mạo hiểm đập đi xây lại từ số không.'],
        'TÀI BẠCH': ['Thiên Khố thủ Tài — bậc thầy tích lũy của cải, luôn có quỹ dự phòng dày dặn, càng về trung hậu vận càng giàu bền.', 'Cần hội Lộc Tồn hoặc Hóa Lộc để kho đầy ắp; nếu bị Không Kiếp chiếu thì tuyệt đối không cho vay lãi.'],
        'PHU THÊ': ['Bạn đời chín chắn, biết vun vén giữ của, có nền tảng gia giáo tốt và là hậu phương kinh tế vững chãi.', 'Người phối ngẫu hơi thiên về truyền thống an toàn, ít thích những thay đổi liều lĩnh đột ngột.'],
        'TỬ TỨC': ['Đường con cái đầy đặn, các con đĩnh đạc, hiếu thuận và biết giữ gìn nề nếp sản nghiệp gia đình.', 'Cha mẹ dễ bao bọc con quá kỹ về vật chất, nên cho con va chạm thực tế để rèn sức bật.'],
        'ĐIỀN TRẠCH': ['Đại cát tinh của cung Điền — rất có duyên nắm giữ nhiều đất đai, nhà cửa khang trang vững chãi.', 'Ưu tiên giữ đất sạch sổ hồng dài hạn thay vì lướt sóng ngắn ngày.'],
        'PHÚC ĐỨC': ['Phúc lộc tổ tiên để lại dày dặn, tâm hồn khoan hòa độ lượng nên hậu vận an nhàn sung túc.', 'Đôi khi lo xa cho con cháu nhiều đời mà quên tận hưởng thành quả hiện tại.'],
        'THIÊN DI': ['Bước ra ngoài xã hội phong thái đàng hoàng nên dễ kết giao với người thành đạt, có thực lực tài chính.', 'Ra ngoài thích sự chuẩn bị chu đáo an toàn, đi đâu cũng được quý nhân tiếp đãi trọng hậu.'],
        'TẬT ÁCH': ['Giải bệnh tật tốt; thuộc Dương Thổ nên cần chú ý dạ dày, tiêu hóa và chứng tích trệ thừa cân do ít vận động.', 'Đề phòng đau dạ dày, trào ngược hoặc phù nề nhẹ chân tay khi ăn uống thất thường.'],
        'PHỤ MẪU': ['Cha mẹ nhân hậu, có tích lũy kinh tế hoặc nền tảng uy tín che chở cho con cái buổi đầu.', 'Gia đình gốc trọng truyền thống, luôn là điểm tựa an toàn mỗi khi bạn cần lùi về nghỉ ngơi.'],
        'HUYNH ĐỆ': ['Anh chị em đàng hoàng, có kinh tế ổn định và biết tương trợ nhau lúc hữu sự.', 'Giữ ranh giới tài sản chung – riêng minh bạch thì tình anh em bền vững trọn đời.'],
        'NÔ BỘC': ['Tuyển dụng được đội ngũ nhân sự trung thành, làm việc bền bỉ và khách hàng lâu năm.', 'Quản lý kho quỹ vẫn cần cơ chế kiểm đếm định kỳ thay vì giao phó hoàn toàn bằng niềm tin.']
      },
      'Thái Âm': {
        'MỆNH CUNG': ['Tinh tế, sâu sắc, giàu mỹ cảm, hướng nội thanh tao và có trực giác đầu tư tích sản cực kỳ nhạy bén.', 'Khi lạc hãm dễ đa sầu đa cảm, suy nghĩ thiệt thòi về phần mình; nên hướng tới ánh sáng tích cực và tài chính tự chủ.'],
        'QUAN LỘC': ['Hợp tài chính đầu tư, bất động sản, thiết kế nội thất, thẩm mỹ, văn hóa nghệ thuật, giáo dục và y dược.', 'Không thích phô trương ồn ào, làm việc âm thầm chắc chắn nhưng hiệu quả tích lũy rất cao.'],
        'TÀI BẠCH': ['Phú tinh chủ sự giàu có bền vững — tiền sinh sôi êm ái từ tích sản dài hạn, cho thuê và đầu tư giá trị.', 'Thái Âm hãm kỵ hùn vốn cảm tính hoặc đứng tên vay hộ người thân kẻo hao hụt âm thầm.'],
        'PHU THÊ': ['Bạn đời dịu dàng, thanh tú, giàu tình cảm, biết chăm chút tổ ấm và tinh tế thấu hiểu lòng người.', 'Cần sự sẻ chia tâm sự nhẹ nhàng mỗi ngày; lời nói thô ráp rất dễ làm tổn thương ngầm.'],
        'TỬ TỨC': ['Con cái thanh tú, ngoan ngoãn, giàu tình cảm nghệ thuật (thường sinh con gái đầu lòng rất hợp mệnh).', 'Con nhạy cảm nội tâm, cần khích lệ nhẹ nhàng để con thêm mạnh dạn trước đám đông.'],
        'ĐIỀN TRẠCH': ['Chủ tinh của Điền Trạch — đại vượng về nhà cửa, biệt thự vườn, đất nghỉ dưỡng hoặc căn hộ cho thuê.', 'Nếu Âm hãm thì nhà ở thiếu ánh nắng tự nhiên, nên mở rộng cửa sổ và tăng đèn ấm trong nhà.'],
        'PHÚC ĐỨC': ['Đời sống tâm hồn phong phú, hưởng phúc ấm từ bà – mẹ và phái nữ trong dòng tộc, hậu vận thanh nhàn.', 'Tránh suy diễn chuyện cũ đã qua; giữ giấc ngủ ngon là liều thuốc dưỡng phúc tốt nhất.'],
        'THIÊN DI': ['Ra ngoài nho nhã lịch thiệp, rất được quý nhân khác giới và khách hàng tinh tế quý trọng.', 'Hợp phát triển ở các đô thị trù phú ven sông biển hoặc làm việc theo khung giờ linh hoạt.'],
        'TẬT ÁCH': ['Thuộc Âm Thủy — cần chăm sóc thận thủy, nội tiết tố, kinh nguyệt/sinh lý, mắt trái và giấc ngủ.', 'Thái Âm hãm dễ bị lạnh tay chân, suy nhược thần kinh nhẹ hoặc mờ mỏi mắt về chiều tối.'],
        'PHỤ MẪU': ['Người mẹ hiền tảo tần, tinh tế và có ảnh hưởng tình cảm sâu đậm nhất tới cuộc đời bạn.', 'Nếu Âm hãm cần quan tâm chăm sóc sức khỏe của mẹ nhiều hơn hoặc sớm sống xa mẹ để tự lập.'],
        'HUYNH ĐỆ': ['Anh chị em (nhất là chị em gái) sống tình cảm, biết quan tâm chăm sóc nhau từng việc nhỏ.', 'Tránh để những hiểu lầm nhỏ giữ kín trong lòng không nói ra gây xa cách vô tình.'],
        'NÔ BỘC': ['Có duyên với cộng sự nữ đắc lực, khách hàng thân thiết gắn bó lâu dài nhờ chữ tín nhẹ nhàng.', 'Khi tuyển người trợ lý thân cận cần xem trọng sự kín đáo, trung thực hơn là khéo miệng.']
      },
      'Tham Lang': {
        'MỆNH CUNG': ['Đa tài đa nghệ, giao tế bậc thầy, nhạy bén nắm bắt cơ hội thời cuộc và giàu khát vọng vươn lên.', 'Dễ phân tâm vì quá nhiều đam mê cùng lúc; biết chuyển hóa ham muốn thành chí lớn hoặc tu dưỡng thì bứt phá rực rỡ.'],
        'QUAN LỘC': ['Cực hợp thương mại, giải trí, truyền thông marketing, ngoại giao, nhà hàng khách sạn và ngành làm đẹp – xu hướng mới.', 'Môi trường càng năng động cạnh tranh càng phát huy sở trường; ngồi bàn giấy đơn điệu dễ chán.'],
        'TÀI BẠCH': ['Nhạy với các làn sóng thị trường mới (nhất là khi gặp Hỏa/Linh thành cách Hoạnh Phát trung niên).', 'Tiền kiếm bạo nhưng chi cho giao tế, thưởng thức cũng mạnh; trúng đậm phải khóa ngay vào đất đai.'],
        'PHU THÊ': ['Bạn đời cuốn hút, sành điệu, khéo giao tiếp xã hội; kết hôn muộn hoặc sau khi sự nghiệp vững thì rất bền.', 'Cần giữ ranh giới rõ ràng với các mối quan hệ xã giao bên ngoài để bảo vệ niềm tin hôn nhân.'],
        'TỬ TỨC': ['Con cái lanh lợi, có khiếu nghệ thuật, ngoại ngữ và giao tiếp trước đám đông rất tự tin.', 'Con thích khám phá cái mới, cần định hướng kỷ luật mềm dẻo để con không cả thèm chóng chán.'],
        'ĐIỀN TRẠCH': ['Thích nhà cửa bài trí sang trọng, thẩm mỹ độc đáo, gần khu phố sầm uất tiện kinh doanh.', 'Trung vận và hậu vận (sau 35–40 tuổi) mới thực sự nắm giữ khối điền sản lớn ổn định.'],
        'PHÚC ĐỨC': ['Về trung hậu vận rất có duyên với triết học, tâm linh, thiền định và biết hưởng thụ cuộc sống tinh tế.', 'Thời trẻ tâm còn nhiều mong cầu sôi nổi, càng trưởng thành càng thấu suốt chữ Buông đúng lúc.'],
        'THIÊN DI': ['Bước chân ra xã hội như cá gặp nước, quảng giao bốn phương, đi tới đâu cũng tạo được mạng lưới quan hệ.', 'Đi xa nhiều tiệc tùng xã giao, cần tỉnh táo giữ mình trước cám dỗ ăn chơi hoặc đầu cơ nóng.'],
        'TẬT ÁCH': ['Thuộc Dương Thủy đới Mộc — cần chú ý gan mật (do tiệc tùng bia rượu), thận tiết niệu và phong thấp.', 'Chế độ ăn uống thanh đạm, hạn chế thức khuya rượu bia sẽ giúp hóa giải 80% bệnh lý của Tham Lang.'],
        'PHỤ MẪU': ['Cha mẹ hoạt bát, cởi mở, có tư duy hiện đại và giao thiệp xã hội rộng rãi.', 'Gia đình không gò bó khuôn sáo, khuyến khích con tự do phát triển năng khiếu riêng.'],
        'HUYNH ĐỆ': ['Anh em năng động, biết làm ăn buôn bán, mỗi người một cá tính màu sắc riêng.', 'Khi hùn vốn làm ăn với anh em vẫn cần quy ước phân chia lợi nhuận rõ ngay từ đầu.'],
        'NÔ BỘC': ['Quen biết đủ mọi tầng lớp trong xã hội, khách hàng đông đảo giúp mở rộng thị trường rất nhanh.', 'Bạn nhậu xã giao thì nhiều mà tri kỷ thực sự ít; đừng tiết lộ bí mật kinh doanh quá sớm.']
      },
      'Cự Môn': {
        'MỆNH CUNG': ['Tư duy phản biện sắc bén, óc nghiên cứu đào sâu tới tận gốc vấn đề và khẩu tài thuyết phục xuất chúng.', 'Ám tinh chủ lời nói: thẳng quá dễ mất lòng hoặc tự chuốc thị phi; lấy chuyên môn sâu làm gốc thì biến Ám thành Minh.'],
        'QUAN LỘC': ['Đắc dụng bậc nhất trong nghề luật sư, giảng viên, bác sĩ chẩn đoán, ngoại giao, tư vấn, kiểm định và truyền thông.', 'Nên kiếm sống bằng "cái miệng có học thuật" và chuyên môn độc quyền; tránh tranh cãi vô bổ nơi công sở.'],
        'TÀI BẠCH': ['Khẩu thiệt sinh tài — tiền bạc đến từ lời tư vấn sắc sảo, đàm phán thương vụ, giảng dạy và trí tuệ chuyên sâu.', 'Nếu Cự hãm gặp Kỵ cần tuyệt đối tránh kiện tụng tranh chấp hợp đồng, mọi thỏa thuận phải có chữ ký.'],
        'PHU THÊ': ['Bạn đời có chiều sâu tri thức, lý lẽ chặt chẽ; hai người hợp nhau khi cùng chia sẻ học thuật công việc.', 'Rất dễ khắc khẩu vì những câu nói vô tình chạm tự ái; nguyên tắc vàng là "bớt một câu tranh đúng sai".'],
        'TỬ TỨC': ['Con cái có tư duy độc lập cao, hay đặt câu hỏi "vì sao", học giỏi các môn lập luận và ngôn ngữ.', 'Cha mẹ cần lắng nghe lý lẽ của con thay vì áp đặt để tránh khoảng cách im lặng trong nhà.'],
        'ĐIỀN TRẠCH': ['Khi miếu vượng giữ đất chắc; hợp không gian yên tĩnh kín đáo để làm việc nghiên cứu.', 'Mua nhà đất cần kiểm tra cực kỹ mốc giới và pháp lý để tránh lời qua tiếng lại với láng giềng.'],
        'PHÚC ĐỨC': ['Suy tư sâu sắc, trực giác tâm linh nhạy bén, thấu hiểu nhân tình thế thái từ rất sớm.', 'Hay tự đặt câu hỏi hoài nghi và lo nghĩ chuyện xa xôi; thực hành biết ơn mỗi ngày giúp tâm sáng nhẹ.'],
        'THIÊN DI': ['Ra ngoài xã hội nổi bật nhờ tài hùng biện, đàm phán sắc bén (nhất là khi hội Thái Dương sáng).', 'Nơi đất khách buổi đầu dễ gặp lời đồn đoán ghen tị, cứ dùng kết quả thực tế để chứng minh thay vì đôi co.'],
        'TẬT ÁCH': ['Cần chăm sóc đường tiêu hóa (dạ dày – đại tràng), vòm họng – thanh quản và chứng dị ứng thực phẩm.', 'Giữ ấm cổ họng, ăn đúng bữa và giải tỏa căng thẳng giúp tránh viêm loét dạ dày do lo âu.'],
        'PHỤ MẪU': ['Cha mẹ thẳng tính, kỹ lưỡng nhưng thương con bằng hành động thực tế hơn là lời khen ngợi.', 'Thuở nhỏ dễ bị cha mẹ hoặc cấp trên phê bình nghiêm khắc nên sớm rèn được bản lĩnh chịu áp lực.'],
        'HUYNH ĐỆ': ['Anh em thẳng thắn góp ý cho nhau không giấu giếm, có người theo ngành chuyên môn sâu.', 'Tránh to tiếng lúc nóng giận vì lời nói sắc quá dễ để lại vết gợn lâu phai giữa anh em.'],
        'NÔ BỘC': ['Thu hút người giỏi chuyên môn nhưng hay phản biện; biết lắng nghe sẽ lọc được nhiều ý kiến quý.', 'Cẩn trọng lời ăn tiếng nói trước mặt người chưa thật thân để tránh tam sao thất bản.']
      },
      'Thiên Tướng': {
        'MỆNH CUNG': ['Hóa khí là Ấn — chính trực, trọng chữ Tín, nghĩa hiệp hay giúp người gặp khó và ăn mặc phong thái chỉn chu.', 'Dễ vì trọng tình nể mặt mà gánh trách nhiệm thay người khác; rất kỵ Hình Kỵ giáp cung nếu đứng tên bảo lãnh.'],
        'QUAN LỘC': ['Bậc thầy quản trị nhân sự, chánh văn phòng, hành chính pháp chế, ngoại giao, kiểm định chất lượng và cố vấn cấp cao.', 'Phát huy rực rỡ nhất khi nắm "con dấu quy trình" hoặc đứng vị trí phó tướng điều phối toàn cục.'],
        'TÀI BẠCH': ['Nguồn thu ổn định, minh bạch và danh giá từ chức danh uy tín, thù lao chuyên gia và khách hàng lâu năm.', 'Không hợp làm ăn chộp giật; tuyệt đối không ký khống hoặc đứng tên vay giùm bất kỳ ai.'],
        'PHU THÊ': ['Bạn đời đàng hoàng, trọng lễ nghĩa, ngoại hình ưa nhìn và luôn giữ thể diện cho gia đình hai bên.', 'Hôn nhân bền vững trên nền tảng tôn trọng lẫn nhau; đôi khi cần hâm nóng sự lãng mạn đời thường.'],
        'TỬ TỨC': ['Con cái lễ phép, chững chạc, biết vâng lời phải trái và có uy tín trong tập thể trường lớp.', 'Cha mẹ làm gương chuẩn mực về lời hứa sẽ nuôi dưỡng con thành người rất đáng tin cậy.'],
        'ĐIỀN TRẠCH': ['Nhà cửa khang trang, mặt tiền cân đối hài hòa, an ninh trật tự tốt và hàng xóm văn minh.', 'Mua bán sang tên sổ sách luôn ưu tiên tính chính quy minh bạch 100% dù giá cao hơn đôi chút.'],
        'PHÚC ĐỨC': ['Sống công tâm ngay thẳng nên tích được âm đức bền lâu, gặp cơn sóng gió đều có quý nhân đỡ lời.', 'Bớt lo thay phần trách nhiệm của người khác để tâm hồn luôn thảnh thơi nhẹ nhõm.'],
        'THIÊN DI': ['Bước ra ngoài xã hội được tin cậy giao phó việc trọng đại nhờ tác phong đĩnh đạc giữ lời.', 'Đi xa lập nghiệp rất thuận khi đại diện cho tổ chức lớn hoặc thương hiệu uy tín.'],
        'TẬT ÁCH': ['Thuộc Dương Thủy — lưu ý thận, bàng quang, đường tiết niệu, da mặt và cân bằng axit uric/đường huyết.', 'Uống đủ nước ấm mỗi ngày và hạn chế đồ ăn quá mặn/đậm vị do tiếp khách tiệc tùng.'],
        'PHỤ MẪU': ['Cha mẹ hoặc thủ trưởng trực tiếp là người trọng danh dự, công bằng và dìu dắt bạn đúng quy chuẩn.', 'Được hưởng uy tín tốt đẹp từ gia phong cha mẹ để lại trong mắt họ hàng làng xóm.'],
        'HUYNH ĐỆ': ['Anh chị em trọng nghĩa tình, có chuyện lớn trong nhà đều đứng ra chung tay gánh vác.', 'Nếu có bất đồng chỉ cần ngồi lại phân xử công tâm là êm đẹp ngay.'],
        'NÔ BỘC': ['Cộng sự dưới quyền nể phục sự công minh của bạn, bạn bè nhiều người làm trong khối cơ quan tổ chức.', 'Giúp bạn trong lúc ngặt nghèo là quý, nhưng cần giới hạn rõ phạm vi pháp lý và tài chính.']
      },
      'Thiên Lương': {
        'MỆNH CUNG': ['Ấm tinh che chở — thanh cao, nhân hậu, trọng đạo lý, sống có chiều sâu trí tuệ và năng lực giải tai ách mạnh nhất.', 'Đôi khi hơi nguyên tắc cổ điển hoặc hay dạy bảo người thân bằng kinh nghiệm của mình; mềm mỏng hơn sẽ rất thu phục lòng người.'],
        'QUAN LỘC': ['Thiên bẩm với ngành y dược, giáo dục đào tạo, thanh tra giám sát, công tác xã hội, bảo hiểm và cố vấn độc lập.', 'Hợp làm chuyên gia uy tín hoặc người thầy dẫn dắt hơn là dấn thân vào thương trường đầu cơ khốc liệt.'],
        'TÀI BẠCH': ['Thanh quý chi tài — tiền lộc đến từ uy tín đạo đức, học hàm chuyên môn và danh tiếng lâu năm, không màng tiền bẩn.', 'Khi Lương hãm gặp Lộc Mã phiêu đãng thì tiền vào ra thất thường, nên gửi tiết kiệm hoặc giữ đất an toàn.'],
        'PHU THÊ': ['Bạn đời chín chắn, bao dung như người anh/chị lớn luôn che chở, nhường nhịn và lo lắng cho bạn.', 'Vợ chồng hơn kém nhau vài tuổi hoặc trải qua thử thách rồi mới cưới thì bách niên giai lão.'],
        'TỬ TỨC': ['Con cái hiếu thảo, điềm đạm, có duyên với học thuật y văn và biết chăm lo cho cha mẹ lúc tuổi già.', 'Buổi đầu nuôi con có thể lo lắng chăm kỹ từng chút nhưng lớn lên con rất ngoan hiền.'],
        'ĐIỀN TRẠCH': ['Có duyên thừa kế hoặc giữ gìn nhà đất lâu năm của gia đình; hợp nơi ở thanh tịnh, gần trường học, bệnh viện hoặc đền chùa.', 'Nhà cửa bền vững ít phô trương hào nhoáng, càng ở lâu càng tụ khí bình an.'],
        'PHÚC ĐỨC': ['Thọ tinh nhập Phúc — trường thọ, phúc ấm tổ tiên cực dày, nhiều lần nguy cấp đều tai qua nạn khỏi kỳ lạ.', 'Có căn duyên lành với tu học dưỡng sinh và làm việc thiện nguyện âm thầm.'],
        'THIÊN DI': ['Ra ngoài xã hội được bậc trưởng bối, thầy cô và người lớn tuổi quý mến nâng đỡ hết lòng.', 'Đi xa gặp chuyện khó đều có người chỉ đường mách lối kịp thời.'],
        'TẬT ÁCH': ['Bách bệnh tiêu tán nhờ Ấm tinh — ốm đau gặp đúng thầy đúng thuốc; chỉ cần chú ý tỳ vị dạ dày và gan mật.', 'Trải qua một vài trận ốm nhẹ để cảnh báo cơ thể nghỉ ngơi rồi hồi phục rất nhanh.'],
        'PHỤ MẪU': ['Cha mẹ nhân đức, sống thọ, gia đình có truyền thống hiếu học hoặc làm nghề thầy giáo – thầy thuốc.', 'Được hưởng sự che chở tinh thần lớn lao từ cha mẹ và các bậc tiền bối.'],
        'HUYNH ĐỆ': ['Anh chị em biết nhường nhịn đùm bọc nhau, người lớn lo cho người nhỏ chu đáo.', 'Tình thân gắn kết bền bỉ bằng đạo nghĩa gia đình hơn là tính toán thiệt hơn.'],
        'NÔ BỘC': ['Kết giao được những người bạn trung hậu lâu năm, ít mà chất lượng.', 'Không hợp giao du với nhóm bạn ăn xổi ở thì; chọn người hiền lương đồng hành thì vạn sự yên.']
      },
      'Thất Sát': {
        'MỆNH CUNG': ['Tướng tinh cầm quân — dũng mãnh, độc lập tự cường, quyết đoán chớp nhoáng và càng nghịch cảnh càng lì đòn bứt phá.', 'Hành trình lập thân nhiều phen tự gánh gió sương một mình; cần rèn chữ Nhẫn và lòng bao dung để giữ thành quả lâu bền.'],
        'QUAN LỘC': ['Sinh ra để làm người mở đường: điều hành thực chiến, kỹ thuật công nghiệp nặng, lực lượng vũ trang, ngoại khoa hoặc tái cấu trúc dự án khó.', 'Sự nghiệp thường có 1–2 khúc ngoặt thay đổi lớn để lột xác lên tầm cao mới.'],
        'TÀI BẠCH': ['Kiếm tiền bằng bản lĩnh quyết đoán ở những thị trường khó mà người khác ngại bước vào.', 'Khi hãm gặp Không Kiếp Kình Đà tuyệt đối tránh đòn bẩy vay nóng kẻo thăng trầm gắt; có lời phải chốt giữ gốc.'],
        'PHU THÊ': ['Bạn đời bản lĩnh, cá tính độc lập mạnh, tháo vát gánh vác việc lớn không kém ai; hợp kết hôn muộn sau khi lập nghiệp.', 'Hai cá tính mạnh ở cạnh nhau cần tôn trọng quyền tự chủ của đối phương, tránh áp đặt mệnh lệnh trong nhà.'],
        'TỬ TỨC': ['Con cái ít nhưng cứng cỏi, tự lập rất sớm, có khí phách mạnh mẽ không ỷ lại cha mẹ.', 'Nên rèn kỷ luật thể thao cho con và lắng nghe tâm tư để cha mẹ – con cái thêm gắn bó.'],
        'ĐIỀN TRẠCH': ['Tự tay tạo dựng cơ ngơi từ mồ hôi bản lĩnh; hợp nhà kết cấu bê tông kim khí vững chắc hoặc gần trục giao thông lớn.', 'Buổi đầu mua nhà đất thường quyết nhanh dứt khoát, nhớ kiểm tra kỹ quy hoạch trước khi xuống cọc.'],
        'PHÚC ĐỨC': ['Tâm tính cương trực không chịu luồn cúi, tự mình làm nên phúc phận bằng lao động quyết liệt.', 'Bớt tự ép bản thân vào thế luôn phải chiến đấu; cho phép mình nghỉ ngơi thư giãn sẽ tăng phúc thọ.'],
        'THIÊN DI': ['Hổ xuất sơn lâm — càng bước ra thị trường lớn, đi xa lập nghiệp phương xa càng phát huy uy dũng và thành danh.', 'Đi lại xa xôi chú ý an toàn phương tiện tốc độ cao và tránh va chạm nóng nảy ngoài đường.'],
        'TẬT ÁCH': ['Thuộc Kim đới Hỏa — lưu ý phổi hô hấp, đại tràng, răng xương và đề phòng thương tích va chạm kim khí/thể thao.', 'Khám răng hàm, hô hấp định kỳ và khởi động kỹ cơ khớp trước khi vận động mạnh.'],
        'PHỤ MẪU': ['Sớm rời vòng tay bao bọc của cha mẹ để tự bươn chải trưởng thành từ rất trẻ.', 'Cha mẹ tính tình cương nghị thẳng thắn; sống riêng độc lập mà thường xuyên thăm hỏi sẽ rất hòa thuận.'],
        'HUYNH ĐỆ': ['Anh em ít người hoặc sớm tự lập mỗi người một phương trời riêng.', 'Thương nhau bằng hành động lúc ngặt nghèo chứ ít nói lời ủy mị hàng ngày.'],
        'NÔ BỘC': ['Chỉ huy được đội quân thực chiến giỏi việc khó nhưng cần kỷ luật sắt và đãi ngộ sòng phẳng.', 'Không nên giao toàn quyền con dấu tài khoản cho cấp dưới thiếu kiểm soát chéo.']
      },
      'Phá Quân': {
        'MỆNH CUNG': ['Tiên phong phá cũ lập mới — táo bạo, sáng tạo đột phá, không chấp nhận lối mòn và luôn tự tay xoay chuyển cục diện.', 'Khi thiếu Lộc Quyền hoặc Tuần Triệt chế hóa thì dễ hao tán công sức buổi đầu vì nóng lòng đập bỏ cái cũ quá sớm.'],
        'QUAN LỘC': ['Xuất sắc trong khởi nghiệp đổi mới sáng tạo, R&D sản phẩm mới, vận tải logistics, xây dựng giải phóng mặt bằng và xoay chuyển doanh nghiệp.', 'Hợp làm theo dự án đột phá hoặc nắm nhiều mảng việc song hành thay vì công việc lặp lại nhàm chán.'],
        'TÀI BẠCH': ['Trước hao sau thành — phải chi vốn đầu tư mở đường trước rồi mới thu về mẻ lưới lớn đột biến.', 'Rất khó giữ tiền mặt đứng yên trong túi; cách giữ của duy nhất là đổi ngay tiền lời sang tài sản khóa chặt.'],
        'PHU THÊ': ['Tình duyên đến bất ngờ đầy mãnh liệt, bạn đời năng động tháo vát; nên trải qua thời gian tìm hiểu kỹ và cưới muộn để bền duyên.', 'Tránh quyết định nóng vội lúc giận hờn; cùng nhau đặt mục tiêu xây dựng kinh tế chung sẽ hóa giải xung khắc.'],
        'TỬ TỨC': ['Con cái thông minh nghịch ngợm, tư duy sáng tạo vượt khuôn khổ truyền thống, thích tự khám phá.', 'Khuyến khích con phát triển năng khiếu công nghệ – thể thao để giải phóng nguồn năng lượng dồi dào.'],
        'ĐIỀN TRẠCH': ['Có duyên mua nhà cũ sửa lại thành đẹp mới, hoặc đổi từ nhà nhỏ sang cơ ngơi lớn sau một đợt tái cơ cấu vốn.', 'Trong đời thường có ít nhất 1–2 lần đại tu sửa sang hoặc chuyển đổi chỗ ở quy mô lớn.'],
        'PHÚC ĐỨC': ['Dám nghĩ dám chịu, tinh thần luôn hướng về phía trước không luyến tiếc chuyện đã qua.', 'Tập thói quen tĩnh lặng suy xét trước các quyết định lớn giúp giảm hẳn sự hao tâm tổn sức.'],
        'THIÊN DI': ['Càng đi xa mở thị trường mới, càng dấn thân vào môi trường biến động càng tìm thấy cơ hội đổi đời.', 'Đi xa chú ý an toàn sông nước và giữ khoản quỹ dự phòng riêng phòng khi thị trường đảo chiều.'],
        'TẬT ÁCH': ['Thuộc Âm Thủy (Hao tinh) — lưu ý thận thủy, sinh lý tiết niệu, tủy xương răng và tiêu hao thể lực do làm việc cuốn chiếu.', 'Ngủ đủ giấc để phục hồi nguyên khí và chú ý an toàn khi bơi lội hoặc di chuyển mùa mưa bão.'],
        'PHỤ MẪU': ['Cha mẹ vất vả bươn chải qua nhiều biến động thời cuộc, bản thân sớm tự gánh vác cuộc sống riêng.', 'Tính cách hai thế hệ khác biệt mạnh về tư duy mới – cũ, sống độc lập giúp giữ trọn hiếu hòa.'],
        'HUYNH ĐỆ': ['Anh em mỗi người một ngả lập nghiệp độc lập, cá tính ai cũng mạnh mẽ quyết liệt.', 'Hỗ trợ nhau theo từng thương vụ ngắn hạn rõ ràng sẽ tốt hơn góp vốn chung dài hạn.'],
        'NÔ BỘC': ['Đội ngũ cộng sự thay đổi theo từng giai đoạn dự án; hợp cơ chế khoán việc theo kết quả đầu ra.', 'Cẩn trọng chọn đối tác hùn vốn, tránh vì hào hứng nhất thời mà bỏ qua khâu thẩm định năng lực thật.']
      }
    };

    // Giải nghĩa Chính Tinh theo từng Ngữ Cảnh Cung cụ thể (Đặc trưng riêng cho đủ 14 Chính Tinh × 12 Cung)
    function getStarInPalaceContext(starName, palaceName, brightness) {
      const isGood = ['Miếu', 'Vượng', 'Đắc'].includes(brightness);
      const starSpec = STAR_PALACE_ESSENCE[starName] && STAR_PALACE_ESSENCE[starName][palaceName];
      if (starSpec) {
        return isGood ? starSpec[0] : starSpec[1];
      }
      const fallbackMap = {
        'MỆNH CUNG': isGood ? 'Phát huy trọn vẹn cốt cách tự chủ, thông tuệ và uy tín cá nhân.' : 'Cần rèn luyện tính kiên nhẫn để vượt qua thử thách buổi đầu.',
        'QUAN LỘC': isGood ? 'Thuận lợi thăng tiến lên vị trí quản lý, điều hành hoặc chuyên gia đầu ngành.' : 'Nên đi sâu vào kỹ năng thực chất, tránh nhảy việc cảm tính.',
        'TÀI BẠCH': isGood ? 'Dòng tiền dồi dào, nhạy bén nắm bắt cơ hội và tích lũy tài sản bền vững.' : 'Tiền bạc có lúc vào ra nhanh, cần kỷ luật giữ tiền và tránh đầu cơ mạo hiểm.',
        'PHU THÊ': isGood ? 'Người phối ngẫu giỏi giang, có trách nhiệm, vợ chồng tương trợ nhau cùng phát triển.' : 'Vợ chồng có cá tính khác biệt, cần nhường nhịn và lắng nghe để giữ ấm gia đạo.',
        'TỬ TỨC': isGood ? 'Con cái thông minh, hiếu thảo, trưởng thành có chí hướng.' : 'Cần kiên nhẫn đồng hành, thấu hiểu tâm lý con cái theo từng độ tuổi.',
        'ĐIỀN TRẠCH': isGood ? 'Có duyên tích lũy nhà cao cửa rộng, bất động sản tăng giá trị theo thời gian.' : 'Buổi đầu tạo dựng nhà cửa có sự dịch chuyển, trung và hậu vận mới an cư vững chắc.',
        'PHÚC ĐỨC': isGood ? 'Phúc dày, gặp hung hóa cát, đi đâu cũng có quý nhân và tổ tiên phù trợ.' : 'Hay suy nghĩ lo toan nội tâm, nên năng làm việc thiện để bồi đắp phúc phần.',
        'THIÊN DI': isGood ? 'Ra ngoài xã hội được trọng vọng, đi xa dễ gặp thời cơ lớn và quý nhân nâng đỡ.' : 'Khi ra ngoài hoặc đi xa cần cẩn trọng lời nói, giữ chữ tín làm đầu.',
        'TẬT ÁCH': isGood ? 'Sức đề kháng tốt, khi đau ốm dễ gặp thầy giỏi thuốc hay mà mau bình phục.' : 'Cần chú ý sinh hoạt điều độ, khám sức khỏe định kỳ và tránh làm việc quá sức.',
        'PHỤ MẪU': isGood ? 'Cha mẹ có phúc lực, bản thân dễ nhận được sự dìu dắt của người bề trên.' : 'Sớm tự lập hoặc có khoảng cách thế hệ trong suy nghĩ với cha mẹ.',
        'HUYNH ĐỆ': isGood ? 'Anh chị em có năng lực, biết đùm bọc hỗ trợ nhau lúc cần thiết.' : 'Anh em mỗi người một chí hướng, hợp tác làm ăn nên rõ ràng minh bạch.',
        'NÔ BỘC': isGood ? 'Có bạn bè tốt và cấp dưới đắc lực hỗ trợ công việc.' : 'Cần chọn lọc kỹ bạn bè và kiểm soát quy trình khi giao việc cho cấp dưới.'
      };
      return fallbackMap[palaceName] || '';
    }

    // Luận giải thực tế theo từng Ngữ Cảnh Cung (Trả về mảng lời khuyên cụ thể, dễ hiểu cho người thường)
    function getContextualPalaceAdvice(palaceName, majors, minorCats, minorSats, hasTuan, hasTriet) {
      const mNames = majors.map(s => s.name);
      const isGoodBright = majors.some(s => ['Miếu', 'Vượng', 'Đắc'].includes(s.brightness));
      const satNote = minorSats.length > 0
        ? `Lưu ý hóa giải: Cung này có sao thử thách (${minorSats.slice(0, 3).join(', ')}), bạn nên giữ tâm thế điềm tĩnh, kiểm soát cảm xúc và rà soát kỹ giấy tờ/lời nói để biến áp lực thành động lực.`
        : `Điểm cộng lớn: Cung này rất ít sát tinh quấy nhiễu, hội tụ cát khí (${minorCats.slice(0, 4).join(', ') || 'bình hòa'}), giúp mọi việc tiến triển êm thuận.`;

      if (palaceName === 'MỆNH CUNG') {
        const careerStr = mNames.some(n => ['Tử Vi', 'Thiên Phủ', 'Vũ Khúc', 'Thiên Tướng', 'Liêm Trinh'].includes(n))
          ? 'Định hướng nghề nghiệp hợp mệnh: Bạn có cốt cách lãnh đạo và tổ chức rất rõ. Rất hợp làm quản lý, điều hành doanh nghiệp, tài chính - ngân hàng, hành chính công quyền, luật pháp hoặc tự làm chủ kinh doanh.'
          : mNames.some(n => ['Thiên Cơ', 'Thái Âm', 'Thiên Đồng', 'Thiên Lương', 'Cự Môn'].includes(n))
          ? 'Định hướng nghề nghiệp hợp mệnh: Bạn mạnh về tư duy chiến lược và chiều sâu học thuật. Rất hợp làm cố vấn, giáo dục, công nghệ, y dược, truyền thông, nghiên cứu hoặc đầu tư tài sản.'
          : 'Định hướng nghề nghiệp hợp mệnh: Bạn thuộc mẫu người hành động thực chiến, dám nghĩ dám làm. Rất hợp kinh doanh thương mại, mở rộng thị trường, kỹ thuật công nghiệp hoặc lực lượng vũ trang.';
        const lifeStr = isGoodBright
          ? 'Chiến lược cuộc đời: Chính tinh tại Mệnh của bạn sáng sủa, bản lĩnh tự chủ cao. Càng đứng trước việc lớn bạn càng phát huy được uy tín. Hãy tập trung xây dựng sự nghiệp cốt lõi bền vững, hậu vận sau 35 tuổi rất vượng.'
          : 'Chiến lược cuộc đời: Bản mệnh thuộc mẫu "tiền bần hậu phú" — giai đoạn trẻ cần rèn luyện kỹ năng chuyên môn sắc bén và chữ Nhẫn, sau 32 tuổi vận trình sẽ bứt phá vững chắc.';
        return [careerStr, lifeStr, satNote];
      }

      if (palaceName === 'TÀI BẠCH') {
        const mainAdvice = mNames.some(n => ['Vũ Khúc', 'Thiên Phủ', 'Thái Âm', 'Tử Vi', 'Thiên Tướng'].includes(n))
          ? 'Cách thức làm giàu tốt nhất: Cung Tài Bạch của bạn có bộ sao Tài Khố / Đế Ấn cực mạnh! Nguồn thu lớn nhất đến từ vị thế quản lý, điều hành dự án lớn hoặc đầu tư bài bản dài hạn chứ không phải các khoản lướt sóng nhỏ lẻ.'
          : 'Cách thức làm giàu tốt nhất: Dòng tiền của bạn sinh sôi mạnh nhất khi gắn liền với chuyên môn sâu và khả năng nắm bắt xu hướng thị trường nhanh nhạy.';
        const keepMoney = 'Quản trị & Giữ tiền: Mỗi khi có khoản lợi nhuận lớn, hãy ưu tiên chuyển hóa sớm sang bất động sản, đất đai hoặc tài sản tích lũy dài hạn (ứng với cung Điền Trạch) để khóa chặt thành quả tài chính.';
        return [mainAdvice, keepMoney, satNote];
      }

      if (palaceName === 'QUAN LỘC') {
        const careerPath = isGoodBright
          ? 'Con đường thăng tiến: Cung Quan Lộc có chính tinh đắc vị nâng đỡ, bạn làm việc có nguyên tắc, kỷ luật và trách nhiệm cao nên rất được cấp trên/đối tác tín nhiệm, dễ nắm giữ chức vụ chủ chốt hoặc làm chủ thương hiệu riêng.'
          : 'Con đường thăng tiến: Sự nghiệp cần đi lên bằng năng lực chuyên môn thực chất. Hãy kiên trì xây dựng uy tín từng bước, tránh thay đổi định hướng liên tục trước tuổi 30.';
        const workStyle = 'Phong cách làm việc hiệu quả: Kết hợp giữa sự quyết đoán của bản mệnh với việc dùng người hiền tài (Tả Phụ, Hữu Bật, Thiên Khôi, Thiên Việt) để mở rộng quy mô công việc thay vì tự ôm đồm một mình.';
        return [careerPath, workStyle, satNote];
      }

      if (palaceName === 'PHU THÊ') {
        const spousePortrait = mNames.some(n => ['Thất Sát', 'Phá Quân', 'Vũ Khúc', 'Liêm Trinh', 'Tử Vi'].includes(n))
          ? 'Chân dung người bạn đời: Người phối ngẫu của bạn là người có cá tính mạnh mẽ, độc lập, tháo vát và có năng lực gánh vác công việc ngoài xã hội.'
          : 'Chân dung người bạn đời: Người phối ngẫu có tâm tính tinh tế, biết lo toan thu vén cho gia đình và hỗ trợ hậu phương vững chắc.';
        const harmonyTip = 'Bí quyết giữ lửa hôn nhân: Vì cả hai đều có chính kiến riêng, nguyên tắc vàng trong gia đình là tôn trọng không gian cá nhân, mọi việc lớn nhỏ nên bàn bạc mềm mỏng, tránh đem áp lực công việc bên ngoài về nhà.';
        return [spousePortrait, harmonyTip, satNote];
      }

      if (palaceName === 'ĐIỀN TRẠCH') {
        const propAdvice = (hasTuan || hasTriet)
          ? 'Quy luật nhà đất của bạn: Cung Điền Trạch có ấn Tuần/Triệt đóng giữ — buổi đầu mua bán hoặc xây dựng nhà cửa thường có sự thay đổi, chuyển dịch 1–2 lần rồi mới an cư lâu dài. Về trung và hậu vận vẫn nắm giữ cơ ngơi khang trang.'
          : 'Quy luật nhà đất của bạn: Bạn có duyên tốt với bất động sản, càng về trung niên điền sản càng mở rộng và tăng giá trị bền vững.';
        const fengshuiTip = 'Lưu ý thực tế khi giao dịch & ở: Khi mua bán đất đai cần kiểm tra kỹ hồ sơ pháp lý; nơi ở nên bố trí nhiều ánh sáng tự nhiên, thông thoáng để kích hoạt vượng khí cho cả gia đình.';
        return [propAdvice, fengshuiTip, satNote];
      }

      return [
        `Phương hướng hành động tại cung ${palaceName}: ${PALACE_PLAIN_GUIDE[palaceName]?.adviceFocus || 'Phát huy thế mạnh của các sao tốt trong cung.'}`,
        isGoodBright
          ? `Nhờ chính tinh sáng sủa tọa thủ hoặc chiếu về, phương diện ${palaceName} của bạn có nền tảng thuận lợi, càng chủ động vun đắp càng thu được kết quả tốt đẹp.`
          : `Tại phương diện ${palaceName}, bạn nên ưu tiên sự chắc chắn, chuẩn bị kỹ lưỡng và lắng nghe lời khuyên từ những người có kinh nghiệm.`,
        satNote
      ];
    }

    function stripAdviceLabel(str) {
      if (!str) return '';
      return str.replace(/^[^:]{3,45}:\s*/, '');
    }

    // Luận giải đúng chuẩn lý thuyết Đại Vận 10 Năm (Khi Đại hạn đi qua cung nào thì cung đó thành Đại Vận Mệnh Cung của 10 năm ấy)
    function buildDaiVan10YearReading(dv, pal, r) {
      const mNames = pal.majorStars.map(s => s.name);
      const isGoodBright = pal.majorStars.some(s => ['Miếu', 'Vượng', 'Đắc'].includes(s.brightness));
      const isYouth = dv.startAge < 16;
      const isEarlyAdult = dv.startAge >= 16 && dv.startAge < 25;

      const themeByPalace = {
        'MỆNH CUNG': 'Định hình bản lĩnh tự chủ, nếp học hành và nền móng cốt cách đầu đời',
        'PHỤ MẪU': isYouth
          ? 'Sống trong vòng bao bọc của cha mẹ, tập trung đèn sách và rèn nền nếp'
          : 'Làm việc nhiều với cơ quan, giấy tờ lớn, bậc trưởng bối và lo tròn chữ hiếu',
        'PHÚC ĐỨC': 'Bồi đắp nội lực tinh thần, hưởng phúc ấm dòng họ và cân bằng lại nhịp sống',
        'ĐIỀN TRẠCH': 'Dồn lực gây dựng nhà cửa, tích lũy đất đai tài sản và củng cố cơ sở làm ăn',
        'QUAN LỘC': 'Dồn toàn lực cho công danh sự nghiệp, nâng tầm vị thế và quyền điều hành',
        'NÔ BỘC': 'Mở rộng đội ngũ cộng sự, đối tác, khách hàng; thành bại nằm ở khâu chọn người đồng hành',
        'THIÊN DI': 'Bước mạnh ra môi trường bên ngoài, đi xa mở mang thị trường và tạo dựng uy tín xã hội',
        'TẬT ÁCH': 'Chặng vận cần ưu tiên giữ sức khỏe, làm việc điều độ và bảo toàn thành quả đã có',
        'TÀI BẠCH': 'Trọng tâm xoay quanh dòng tiền lớn, mở rộng nguồn thu và gặt hái thành quả tài chính',
        'TỬ TỨC': 'Vừa chăm lo chuyện con cái – gia đạo, vừa ươm mầm dự án mới và đào tạo người kế cận (xung Điền Trạch)',
        'PHU THÊ': 'Giai đoạn thành gia lập thất, ổn định hậu phương song hành cùng bước ngoặt gây dựng sự nghiệp (xung Quan Lộc)',
        'HUYNH ĐỆ': isEarlyAdult
          ? 'Bước ra va chạm thực tế đầu đời, kết giao bằng hữu, rèn tay nghề và chọn hướng lập thân'
          : 'Phối hợp làm ăn cùng anh em, đồng sự sát sườn và củng cố nguồn lực dự phòng'
      };

      const focusTheme = themeByPalace[pal.palaceName] || r.plainGuide.plainTitle;

      let starFlow = '';
      if (mNames.length === 0) {
        const oppStars = r.oppPal.majorStars.map(s => `${s.name} (${s.brightShort})`).join(' · ') || 'Cát tinh';
        starFlow = `Cung Đại vận Vô Chính Diệu mượn lực [${oppStars}] từ cung ${r.oppPal.palaceName} chiếu sang — 10 năm này thắng nhờ sự linh hoạt ứng biến và biết mượn sức tập thể, không nên cứng nhắc một chiều.`;
      } else if (mNames.some(n => ['Thất Sát', 'Phá Quân', 'Tham Lang'].includes(n))) {
        starFlow = isGoodBright
          ? `Nhập hạn Sát – Phá – Tham đắc địa (${mNames.join(' · ')}): 10 năm bứt phá quyết liệt, dám thay cũ đổi mới và tự mở đường riêng để bật lên vị thế mới.`
          : `Nhập hạn biến động (${mNames.join(' · ')}): 10 năm có nhiều dịch chuyển lớn về công việc/môi trường, cần tính kỹ dòng vốn trước mỗi cú rẽ.`;
      } else if (mNames.some(n => ['Tử Vi', 'Thiên Phủ', 'Vũ Khúc', 'Thiên Tướng', 'Liêm Trinh'].includes(n))) {
        starFlow = isGoodBright
          ? `Đắc bộ Đế – Tài – Ấn sáng sủa (${mNames.join(' · ')}): 10 năm rất vượng để nắm quyền quản lý, đứng mũi chịu sào và tích lũy khối tài sản dày dặn.`
          : `Đi qua bộ sao Quản trị (${mNames.join(' · ')}): nên lấy chữ tín và kỷ luật tài chính làm gốc, xây chắc từng bậc thay vì dàn trải.`;
      } else {
        starFlow = isGoodBright
          ? `Gặp bộ Văn đoàn / Phúc tinh sáng (${mNames.join(' · ')}): 10 năm thuận lợi nhờ chiều sâu chuyên môn, mưu lược bài bản và có quý nhân nâng đỡ êm thuận.`
          : `Gặp sao ${mNames.join(' · ')} cần độ lùi: 10 năm này hợp đi đường chắc chắn, lấy kinh nghiệm chuyên môn làm gốc, tránh đầu cơ nóng vội hay đứng ra bảo lãnh tiền bạc.`;
      }

      if (pal.isThan) {
        starFlow += ' Đặc biệt đây là cung Thân Cư — chặng bản lề định hình rõ nhất cơ ngơi hậu vận.';
      } else if (pal.hasTriet && dv.startAge < 35) {
        starFlow += ' Vướng ấn Triệt buổi đầu nên 3–5 năm đầu vận rèn sức vượt cản, nửa sau vận mở lối thông suốt.';
      }

      return { focusTheme, starFlow };
    }

    // Tổng hợp giao thoa / xung đột Cát – Hung – Tuần/Triệt tại một cung (tránh liệt kê sao rời rạc)
    function buildPalaceConflictSynthesis(palace, oppPal, tri1Pal, tri2Pal) {
      const majors = palace.majorStars || [];
      const majorNames = majors.map(s => s.name);
      const oppMajorNames = (oppPal?.majorStars || []).map(s => s.name);
      const stripTag = (n) => n.replace(/\s*\[.*\]$/, '');
      const cleanSats = (palace.minorSats || []).map(stripTag);
      const cleanCats = (palace.minorCats || []).map(stripTag);
      const triPhuongSats = [
        ...cleanSats,
        ...(oppPal?.minorSats || []).map(stripTag),
        ...(tri1Pal?.minorSats || []).map(stripTag),
        ...(tri2Pal?.minorSats || []).map(stripTag)
      ];

      const heavySatSet = new Set(['Địa Không', 'Địa Kiếp', 'Kình Dương', 'Đà La', 'Hỏa Tinh', 'Linh Tinh', 'Thiên Hình']);
      const localHeavySats = cleanSats.filter(n => heavySatSet.has(n));
      const triPhuongHeavyCount = triPhuongSats.filter(n => heavySatSet.has(n)).length;

      const nobleCatSet = new Set(['Lộc Tồn', 'Thiên Khôi', 'Thiên Việt', 'Tả Phụ', 'Hữu Bật', 'Văn Xương', 'Văn Khúc']);
      const localNobleCats = cleanCats.filter(n => nobleCatSet.has(n));
      const hasGoodMutagen = majors.some(s => ['Lộc', 'Quyền', 'Khoa'].includes(s.mutagen)) ||
        (palace.minorCats || []).some(n => /\[(Lộc|Quyền|Khoa)\]/.test(n));
      const hasLocalKy = majors.some(s => s.mutagen === 'Kỵ') ||
        (palace.minorSats || []).some(n => /\[Kỵ\]/.test(n));
      const hasOppKy = (oppPal?.majorStars || []).some(s => s.mutagen === 'Kỵ') ||
        (oppPal?.minorSats || []).some(n => /\[Kỵ\]/.test(n));

      const hasHighBright = majors.some(s => ['Miếu', 'Vượng'].includes(s.brightness));
      const allHam = majors.length > 0 && majors.every(s => s.brightness === 'Hãm');
      const isImperialOrVault = majorNames.some(n => ['Tử Vi', 'Thiên Phủ', 'Thái Dương', 'Thái Âm', 'Vũ Khúc', 'Thiên Tướng'].includes(n));
      const isSatPhaTham = majorNames.some(n => ['Thất Sát', 'Phá Quân', 'Tham Lang'].includes(n)) ||
        oppMajorNames.some(n => ['Thất Sát', 'Phá Quân', 'Tham Lang'].includes(n));

      // 1. Đế / Tài tinh Miếu Vượng ngộ Triệt / Tuần (Mẫu Vua Bảo Đại: Tử Phủ đồng cung ngộ Triệt)
      if (majors.length > 0 && hasHighBright && isImperialOrVault && (palace.hasTriet || palace.hasTuan)) {
        const lockName = [palace.hasTriet ? 'Triệt' : '', palace.hasTuan ? 'Tuần' : ''].filter(Boolean).join(' – ');
        return {
          badge: 'Vàng Ròng Vướng Mây Che',
          tone: 'amber',
          headline: `Chính tinh sáng (${majorNames.join(' · ')}) ngộ ấn ${lockName}: Có tầm vóc & vị thế nhưng tiền vận dễ bị thời thế chế ước`,
          detail: `Các sao tốt đem lại nền tảng, danh phận và năng lực quản trị rõ nét, song ấn ${lockName} đóng ngay tại cung khiến giai đoạn đầu (đặc biệt trước 32–35 tuổi) khó toàn quyền tự quyết hoặc hay gặp rào cản cơ chế khách quan. Càng điềm tĩnh tích lũy chiều sâu chuyên môn, hậu vận lực cản mở dần thì thành quả càng bền.`
        };
      }

      // 2. Cát tinh / Quý nhân đồng cung cùng Không Kiếp – Kình Đà (Mẫu Lý Tiểu Long: Thiên Tướng + Việt đồng cung Không + Đà xung Tử Phá)
      if (localHeavySats.length >= 2 && (localNobleCats.length >= 1 || hasHighBright || hasGoodMutagen || isSatPhaTham)) {
        return {
          badge: 'Bùng Nổ Mạnh · Biến Động Gấp',
          tone: 'red',
          headline: `Cát tinh hội trực diện Đại Sát tinh (${localHeavySats.join(' · ')}): Phát tiết phi thường nhưng cần giữ chặt chốt an toàn`,
          detail: `Sự cộng hưởng giữa sao tốt và bộ sát tinh mạnh tạo ra sức bật đột phá hiếm có — dám phá bỏ lối mòn để lập kỳ tích nhanh tại mảng ${palace.palaceName}. Tuy nhiên, thế "cát hung giao chiến" cảnh báo biên độ thăng trầm rất gắt: khi đang ở đỉnh thuận lợi tuyệt đối không chủ quan với sức khỏe, va chạm bất ngờ hoặc dồn hết vốn vào một canh bạc.`
        };
      }

      // 3. Chính tinh Miếu/Vượng đắc cách nhưng ngộ Hóa Kỵ tại chỗ (Mẫu Bill Gates: Thái Âm Miếu Hóa Kỵ tại Hợi / Nam Phương: Thái Dương Hóa Kỵ)
      if (majors.length > 0 && hasHighBright && hasLocalKy) {
        return {
          badge: 'Ngọc Sáng Chạm Vết Xước',
          tone: 'amber',
          headline: `Sao sáng (${majorNames.join(' · ')}) đi kèm Hóa Kỵ: Thành tựu lớn nhưng luôn kèm một mối bận tâm sâu kín`,
          detail: `Độ sáng Miếu/Vượng bảo đảm năng lực thực chất và thành quả dày dặn ở phương diện ${palace.palaceName}. Dẫu vậy, nốt Hóa Kỵ nhắc rằng đi liền với vinh hiển dễ có lời ra tiếng vào, sự cầu toàn nội tâm hoặc một bước ngoặt chuyển hóa lớn ở trung – hậu vận. Chủ động minh bạch giấy tờ, nhường bớt phần thắng lời nói và biết san sẻ cho đi chính là phép "dụng Kỵ thành công".`
        };
      }

      // 4. Vô Chính Diệu thiếu Tuần/Triệt che chắn lại bị Sát tinh / Hóa Kỵ xung phá (Mẫu Phu Thê Công nương Diana)
      if (majors.length === 0 && !palace.hasTuan && !palace.hasTriet && (localHeavySats.length >= 1 || hasLocalKy || hasOppKy || triPhuongHeavyCount >= 3)) {
        return {
          badge: 'Nhạy Cảm Sóng Gió Ngoại Cảnh',
          tone: 'red',
          headline: `Cung Vô Chính Diệu thiếu Tuần/Triệt lại chịu lực xung Sát – Kỵ: Cần lập nguyên tắc tự bảo vệ từ sớm`,
          detail: `Vì cung không có Chính tinh trấn giữ cũng không có bình phong Tuần/Triệt cản gió, phương diện ${palace.palaceName} rất dễ bị cuốn theo áp lực bên ngoài hoặc chịu thiệt thòi cảm xúc buổi đầu. Thay vì vội vàng quyết định sớm theo kỳ vọng người khác, nên lùi độ chín (kết hôn/chốt đại sự muộn hơn mặt bằng chung) và giữ ranh giới độc lập rõ ràng.`
        };
      }

      // 5. Sát – Phá – Tham đắc địa gặp Quyền / Hỏa – Linh / Kình vừa độ (Chế Sát Vi Quyền)
      if (majors.length > 0 && hasHighBright && isSatPhaTham && (localHeavySats.length === 1 || hasGoodMutagen)) {
        return {
          badge: 'Chế Sát Vi Quyền',
          tone: 'jade',
          headline: `Sát – Phá – Tham đắc địa (${majorNames.join(' · ')}) làm chủ sát khí: Càng vào việc khó càng lộ bản lĩnh cầm trịch`,
          detail: `Trong thế đắc địa, yếu tố gai góc của sát tinh được chuyển hóa thành quyết đoán thực chiến, tốc độ xử lý khủng hoảng và uy lực điều hành. Rất hợp môi trường cạnh tranh sòng phẳng, kỹ thuật mũi nhọn, pháp chế – kỷ luật hoặc mở thị trường mới.`
        };
      }

      // 6. Chính tinh Hãm địa nhưng đắc Tuần/Triệt hoặc Hóa Khoa/Lộc cứu giải (Phản Vi Kỳ Cách)
      if (allHam && (palace.hasTuan || palace.hasTriet || hasGoodMutagen || localNobleCats.length >= 2)) {
        return {
          badge: 'Khổ Trước Sướng Sau',
          tone: 'jade',
          headline: `Sao chính hãm địa nhưng đắc thần cứu giải: Vượt qua 1–2 lần va vấp đầu đời sẽ thành nghề vững chắc`,
          detail: `Đừng lo ngại chữ "Hãm địa" trên mặt chữ — nhờ có Tuần/Triệt hoặc Khoa – Lộc – Quý nhân nâng đỡ, những trắc trở ban đầu tại ${palace.palaceName} đóng vai trò rèn tay nghề thực chất, giúp trung và hậu vận lật ngược thế cờ bền bỉ.`
        };
      }

      return null;
    }

    function generatePalaceReading(palace, allPalaces) {
      const bIdx = palace.branchIndex;
      const oppPal = allPalaces[CHI[(bIdx + 6) % 12]];
      const tri1Pal = allPalaces[CHI[(bIdx + 4) % 12]];
      const tri2Pal = allPalaces[CHI[(bIdx + 8) % 12]];

      const majors = palace.majorStars;
      const dualKey = majors.map(s => s.name).join(' · ');
      const dualInfo = DUAL_STARS[dualKey];
      const plainGuide = PALACE_PLAIN_GUIDE[palace.palaceName] || {
        plainTitle: PALACE_DESCRIPTIONS[palace.palaceName],
        question: 'Phương diện này trong cuộc đời tôi diễn biến thế nào?',
        adviceFocus: 'Giữ sự cân bằng và phát huy các sao tốt trong cung.'
      };

      // Chấm điểm độ cát lợi của cung (thang 10): phân tầng rõ Đại Sát Tinh (Không Kiếp, Kình Đà, Hỏa Linh, Hình, Kỵ) với bại tinh nhẹ
      let score = 7.0;
      if (majors.length === 0) {
        oppPal.majorStars.forEach(s => {
          if (s.brightness === 'Miếu') score += 0.78;
          else if (s.brightness === 'Vượng') score += 0.58;
          else if (s.brightness === 'Đắc') score += 0.4;
          else if (s.brightness === 'Hãm') score -= 0.45;
          if (['Lộc', 'Quyền', 'Khoa'].includes(s.mutagen)) score += 0.45;
          if (s.mutagen === 'Kỵ') score -= 0.4;
        });
        if (palace.hasTuan || palace.hasTriet) {
          score += 0.5;
          if (palace.hasTuan && palace.hasTriet) score += 0.25;
        }
      } else {
        majors.forEach(s => {
          if (s.brightness === 'Miếu') score += 1.2;
          else if (s.brightness === 'Vượng') score += 0.9;
          else if (s.brightness === 'Đắc') score += 0.6;
          else if (s.brightness === 'Hãm') score -= 0.8;
          if (['Lộc', 'Quyền', 'Khoa'].includes(s.mutagen)) score += 0.7;
          if (s.mutagen === 'Kỵ') score -= 0.65;
        });
        const allHam = majors.every(s => s.brightness === 'Hãm');
        const hasHighBright = majors.some(s => ['Miếu', 'Vượng'].includes(s.brightness));
        if (allHam && (palace.hasTuan || palace.hasTriet)) {
          score += 0.45;
        } else if (hasHighBright && palace.hasTriet) {
          score -= 0.3;
        }
      }
      const heavySatNames = new Set(['Địa Không', 'Địa Kiếp', 'Kình Dương', 'Đà La', 'Hỏa Tinh', 'Linh Tinh', 'Thiên Hình']);
      let satPenalty = 0;
      palace.minorSats.forEach(raw => {
        const clean = raw.replace(/\s*\[.*\]$/, '');
        if (heavySatNames.has(clean) || /\[Kỵ\]/.test(raw)) satPenalty += 0.28;
        else satPenalty += 0.12;
      });
      score += Math.min(palace.minorCats.length * 0.2, 1.2);
      score -= Math.min(satPenalty, 1.45);
      score = Math.max(5.2, Math.min(9.8, Number(score.toFixed(1))));

      const conflictSynthesis = buildPalaceConflictSynthesis(palace, oppPal, tri1Pal, tri2Pal);

      const ratingLabel = score >= 8.5 ? 'Thượng Cát (Rất Tốt)' : score >= 7.5 ? 'Khá Tốt & Vững Vàng' : 'Trung Bình - Cần Rèn Luyện';

      let coreAnalysis = '';
      let majorDetailedList = [];
      if (majors.length === 0) {
        const oppMajors = oppPal.majorStars.map(s => `${s.name} (${s.brightness})`).join(', ') || 'Không có';
        const tuanTrietVcdNote = (palace.hasTuan || palace.hasTriet)
          ? `\n• Đắc Không Vong (${[palace.hasTriet ? 'Triệt' : '', palace.hasTuan ? 'Tuần' : ''].filter(Boolean).join(' + ')}): Cổ thư có câu "Vô Chính Diệu đắc Tam Không phú quý khả kỳ" — ấn Tuần/Triệt đóng tại đây giống như bức bình phong cản bớt sát khí bên ngoài và giữ chặt cát khí chiếu về, giúp hậu vận rất vững.`
          : '';
        coreAnalysis = `Cung ${palace.palaceName} tại ${palace.branchName} không có Chính tinh đóng trực tiếp (trong Tử Vi gọi là "Vô Chính Diệu").\n\n• Hiểu đơn giản: Cung Vô Chính Diệu không phải là cung xấu hay trống rỗng, mà giống như căn phòng mở rộng cửa để đón ánh sáng của bộ sao [${oppMajors}] từ cung đối diện (${oppPal.palaceName} - ${oppPal.branchName}) chiếu sang (mượn khoảng 7 phần lực), đồng thời hội nguồn lực từ 2 cung Tam Hợp là ${tri1Pal.palaceName} và ${tri2Pal.palaceName}.\n• Ý nghĩa thực tế: Tại phương diện ${palace.palaceName}, bạn cực kỳ linh hoạt, nhạy bén thích nghi với thời cuộc và biết mượn sức tập thể để làm nên việc.${tuanTrietVcdNote}`;
      } else {
        majorDetailedList = majors.map(s => {
          const base = STAR_INTERPRETATIONS[s.name] || '';
          const brightInfo = BRIGHTNESS_EXPLAIN[s.brightness] || BRIGHTNESS_EXPLAIN['Bình'];
          const contextMeaning = getStarInPalaceContext(s.name, palace.palaceName, s.brightness);
          let mutExplain = '';
          if (s.mutagen === 'Lộc') mutExplain = 'Đắc ấn [Hóa Lộc]: Mang lại tài lộc dồi dào, cơ hội kiếm tiền thuận lợi và nhân duyên tốt đẹp tự tìm đến.';
          else if (s.mutagen === 'Quyền') mutExplain = 'Đắc ấn [Hóa Quyền]: Tăng cường uy quyền, năng lực lãnh đạo quyết đoán, nói có người nghe và làm chủ tình thế.';
          else if (s.mutagen === 'Khoa') mutExplain = 'Đắc ấn [Hóa Khoa]: Đệ nhất phúc thần cứu giải — mang lại trí tuệ, bằng cấp, uy tín danh tiếng và hóa giải tai ương.';
          else if (s.mutagen === 'Kỵ') mutExplain = 'Gặp ấn [Hóa Kỵ]: Nhắc nhở cần cẩn trọng lời ăn tiếng nói, tránh hiểu lầm thị phi hoặc suy nghĩ bận tâm quá mức.';
          return {
            name: s.name,
            element: s.element,
            brightness: `${s.brightness} (${brightInfo.label})`,
            brightLabel: brightInfo.label,
            brightExplain: `${brightInfo.desc} ${contextMeaning}`,
            coreDesc: base,
            mutagen: s.mutagen ? `Hóa ${s.mutagen}` : null,
            mutagenExplain: mutExplain
          };
        });
        coreAnalysis = majorDetailedList.map(m => `★ Sao ${m.name} [${m.brightLabel}]: ${m.coreDesc}\n→ Ứng dụng tại ${palace.palaceName}: ${m.brightExplain}${m.mutagenExplain ? `\n→ ${m.mutagenExplain}` : ''}`).join('\n\n');
      }

      // Giải nghĩa từng sao phụ trong cung để người xem hiểu rõ từng sao làm gì
      const explainedCats = palace.minorCats.map(rawName => {
        const cleanName = rawName.replace(/\s*\[.*\]$/, '');
        const hasMut = rawName.match(/\[(.*)\]/);
        const mutSuffix = hasMut ? ` (Đắc Hóa ${hasMut[1]}: Tăng mạnh may mắn, tài lộc và danh tiếng)` : '';
        return {
          name: rawName,
          meaning: (MINOR_STAR_MEANINGS[cleanName] || 'Sao cát tinh mang lại sự thuận lợi, may mắn và quý nhân trợ giúp.') + mutSuffix
        };
      });

      const explainedSats = palace.minorSats.map(rawName => {
        const cleanName = rawName.replace(/\s*\[.*\]$/, '');
        const hasMut = rawName.match(/\[(.*)\]/);
        const mutSuffix = hasMut ? ` (Gặp Hóa ${hasMut[1]}: Cần chú ý giữ gìn lời nói, giấy tờ và tránh nóng vội)` : '';
        return {
          name: rawName,
          meaning: (MINOR_STAR_MEANINGS[cleanName] || 'Sao thử thách đòi hỏi sự cẩn trọng, kiên nhẫn và rèn luyện bản lĩnh.') + mutSuffix
        };
      });

      const oppStarStr = oppPal.majorStars.map(s => `${s.name} (${s.brightness})`).join(' · ') || 'Vô Chính Diệu';
      const tri1StarStr = tri1Pal.majorStars.map(s => `${s.name} (${s.brightness})`).join(' · ') || 'Vô Chính Diệu';
      const tri2StarStr = tri2Pal.majorStars.map(s => `${s.name} (${s.brightness})`).join(' · ') || 'Vô Chính Diệu';

      const synthesisText = `Trong Tử Vi, một cung không đứng riêng lẻ mà luôn nhận nguồn lực từ 3 cung chiếu về (gọi là Tam Phương Tứ Chính). Cung ${palace.palaceName} của bạn được 2 cung đồng minh Tam Hợp là ${tri1Pal.palaceName} (${tri1Pal.branchName}: ${tri1StarStr}) và ${tri2Pal.palaceName} (${tri2Pal.branchName}: ${tri2StarStr}) hiệp lực nâng đỡ, kết hợp cùng cung đối diện Xung Chiếu là ${oppPal.palaceName} (${oppPal.branchName}: ${oppStarStr}). Sự giao hội này tạo nên thế liên kết chặt chẽ giữa bản lĩnh cá nhân, sự nghiệp và tài chính.`;

      const trangSinhExplain = TRANG_SINH_MEANINGS[palace.vongTrangSinh] || '';
      const contextAdvice = getContextualPalaceAdvice(palace.palaceName, majors, palace.minorCats, palace.minorSats, palace.hasTuan, palace.hasTriet);

      return {
        oppPal,
        tri1Pal,
        tri2Pal,
        dualInfo,
        plainGuide,
        score,
        ratingLabel,
        conflictSynthesis,
        majorDetailedList,
        coreAnalysis,
        explainedCats,
        explainedSats,
        synthesisText,
        trangSinhExplain,
        contextAdvice
      };
    }

    // =========================================================================
    // 3B. PHÂN HỆ KINH DỊCH ĐỘC LẬP: MAI HOA DỊCH SỐ & BỐC PHỆ LỤC HÀO (64 QUẺ)
    // =========================================================================
    // 8 Quẻ Tiên Thiên Bát Quái (Số thứ tự 1..8 theo Thiệu Khang Tiết)
    // lines: [hào 1 (dưới), hào 2 (giữa), hào 3 (trên)] (1 = Dương, 0 = Âm)
    const TRIGRAMS = {
      1: { idx: 1, name: 'Càn', symbol: '☰', nature: 'Thiên (Trời)', element: 'Kim', lines: [1, 1, 1], family: 'Cha / Người đứng đầu', attr: 'Cương kiện, mạnh mẽ, quyết đoán, sáng tạo', najiaInner: ['Tý', 'Dần', 'Thìn'], najiaOuter: ['Ngọ', 'Thân', 'Tuất'] },
      2: { idx: 2, name: 'Đoài', symbol: '☱', nature: 'Trạch (Đầm)', element: 'Kim', lines: [1, 1, 0], family: 'Thiếu nữ / Út nữ', attr: 'Vui vẻ, ăn nói thuyết phục, thương thuyết, giao tế', najiaInner: ['Tỵ', 'Mão', 'Sửu'], najiaOuter: ['Hợi', 'Dậu', 'Mùi'] },
      3: { idx: 3, name: 'Ly', symbol: '☲', nature: 'Hỏa (Lửa)', element: 'Hỏa', lines: [1, 0, 1], family: 'Trung nữ / Thứ nữ', attr: 'Sáng suốt, văn chương, giấy tờ, danh tiếng rực rỡ', najiaInner: ['Mão', 'Sửu', 'Hợi'], najiaOuter: ['Dậu', 'Mùi', 'Tỵ'] },
      4: { idx: 4, name: 'Chấn', symbol: '☳', nature: 'Lôi (Sấm)', element: 'Mộc', lines: [1, 0, 0], family: 'Trưởng nam', attr: 'Khởi động nhanh, xông xáo, biến chuyển mạnh mẽ', najiaInner: ['Tý', 'Dần', 'Thìn'], najiaOuter: ['Ngọ', 'Thân', 'Tuất'] },

    // Xét quan hệ Ngũ Hành Sinh Khắc giữa 2 hành
    function evaluateElementRelation(theElem, dungElem) {
      const sinh = { Kim: 'Thủy', Thủy: 'Mộc', Mộc: 'Hỏa', Hỏa: 'Thổ', Thổ: 'Kim' };

    // 1. Engine Tính Quẻ Mai Hoa Dịch Số (Thời Khắc + Thanh Âm Câu Hỏi)
    function computeMeiHua({ mode, year, month, day, hour, minute, questionText, horoscope }) {
      const conv = convertSolar2LunarVN(day, month, year, 7);
      const { lunarDay: lDay, lunarMonth: lMonth, lunarYear: lYear } = conv;
      const yearBranchIdx = ((lYear - 4) % 12 + 12) % 12; // 0=Tý .. 11=Hợi
      const yearNum = yearBranchIdx + 1; // 1..12
      const hourBranchIdx = Math.floor(((hour + 1) % 24) / 2); // 0=Tý .. 11=Hợi
      const hourNum = hourBranchIdx + 1; // 1..12
      const hourBranchName = CHI[hourBranchIdx];

      const cleanWords = (questionText || '').trim().split(/\s+/).filter(Boolean);
      const wordCount = cleanWords.length;

      let upperIdx, lowerIdx, movingLine, methodExplain;
      if (mode === 'thought' && wordCount >= 2) {
        const half = Math.ceil(wordCount / 2);
        const w1 = half;
        const w2 = wordCount - half;
        const sumU = w1 + lMonth + lDay;
        const sumL = w1 + w2 + hourNum;
        upperIdx = sumU % 8 || 8;
        lowerIdx = sumL % 8 || 8;
        movingLine = (sumU + sumL) % 6 || 6;
        methodExplain = `Khởi quẻ kết hợp Câu Suy Nghĩ (${wordCount} chữ: Thượng bán ${w1} chữ, Hạ bán ${w2} chữ) + Thời khắc Động tâm (Ngày ${lDay}/${lMonth} Âm lịch, Giờ ${hourBranchName}).`;
      } else {
        const sumUpper = yearNum + lMonth + lDay;
        const sumTotal = sumUpper + hourNum;
        upperIdx = sumUpper % 8 || 8;
        lowerIdx = sumTotal % 8 || 8;
        movingLine = sumTotal % 6 || 6;
        methodExplain = `Khởi quẻ chuẩn Thời Khắc Mai Hoa: Năm ${CHI[yearBranchIdx]} (số ${yearNum}) + Tháng ${lMonth} + Ngày ${lDay} Âm lịch + Giờ ${hourBranchName} (số ${hourNum}).`;
      }

      const upperTri = TRIGRAMS[upperIdx];
      const lowerTri = TRIGRAMS[lowerIdx];

      // 6 hào của Quẻ Chủ (từ hào 1 đến hào 6)
      const mainLines = [...lowerTri.lines, ...upperTri.lines];

      // Quẻ Hỗ (Hạ quái = hào 2,3,4; Thượng quái = hào 3,4,5)
      const huLower = findTrigramByLines(mainLines[1], mainLines[2], mainLines[3]);
      const huUpper = findTrigramByLines(mainLines[2], mainLines[3], mainLines[4]);

      // Quẻ Biến (Đảo hào tại vị trí movingLine)
      const changedLines = mainLines.map((bit, idx) => (idx === movingLine - 1 ? 1 - bit : bit));
      const bianLower = findTrigramByLines(changedLines[0], changedLines[1], changedLines[2]);
      const bianUpper = findTrigramByLines(changedLines[3], changedLines[4], changedLines[5]);

      // Xác định Quẻ Thể (tĩnh) và Quẻ Dụng (động)
      const isLowerMoving = movingLine <= 3;
      const theTri = isLowerMoving ? upperTri : lowerTri;
      const dungTri = isLowerMoving ? lowerTri : upperTri;
      const bianDungTri = isLowerMoving ? bianLower : bianUpper;

      const initialRelation = evaluateElementRelation(theTri.element, dungTri.element);
      const finalRelation = evaluateElementRelation(theTri.element, bianDungTri.element);

      // Chiếu Giờ Động Tâm vào Cung tương ứng trên Lá Số Tử Vi của đương số
      const tuviPalaceAtHour = horoscope.palaces[hourBranchName];
      const tuviReadingAtHour = generatePalaceReading(tuviPalaceAtHour, horoscope.palaces);

      return {
        lunarDateStr: `Ngày ${lDay} tháng ${lMonth} năm ${CAN[((lYear - 4) % 10 + 10) % 10]} ${CHI[yearBranchIdx]} · Giờ ${hourBranchName} (${hour.toString().padStart(2, '0')}:${minute.toString().padStart(2, '0')})`,
        hourBranchName,
        methodExplain,
        movingLine,
        isLowerMoving,
        theTri,
        dungTri,
        bianDungTri,
        mainHex: {
          ...getHexagramInfo(upperIdx, lowerIdx),
          upper: upperTri,
          lower: lowerTri,
          lines: mainLines
        },
        huHex: {
          ...getHexagramInfo(huUpper.idx, huLower.idx),
          upper: huUpper,
          lower: huLower,
          lines: [...huLower.lines, ...huUpper.lines]
        },
        bianHex: {
          ...getHexagramInfo(bianUpper.idx, bianLower.idx),
          upper: bianUpper,
          lower: bianLower,
          lines: changedLines
        },
        initialRelation,
        finalRelation,
        tuviPalaceAtHour,
        tuviReadingAtHour
      };
    }

    // 2. Engine Bốc Phệ Lục Hào Nạp Giáp Văn Vương (Kinh Phòng Dịch)
    const BRANCH_ELEMENTS = {
      'Tý': 'Thủy', 'Sửu': 'Thổ', 'Dần': 'Mộc', 'Mão': 'Mộc',
      'Thìn': 'Thổ', 'Tỵ': 'Hỏa', 'Ngọ': 'Hỏa', 'Mùi': 'Thổ',
      'Thân': 'Kim', 'Dậu': 'Kim', 'Tuất': 'Thổ', 'Hợi': 'Thủy'

    // Tìm Cung Bát Thuần và vị trí Hào Thế - Hào Ứng theo thuật toán Kinh Phòng
    function findPalaceAndShiYing(mainLines) {
      const flip = (arr, idxs) => arr.map((v, i) => (idxs.includes(i) ? 1 - v : v));
      const isPure = (arr) => arr[0] === arr[3] && arr[1] === arr[4] && arr[2] === arr[5];

      // Kiểm tra Bát Thuần (Thế tại hào 6)
      if (isPure(mainLines)) {
        const palaceTri = findTrigramByLines(mainLines[0], mainLines[1], mainLines[2]);
        return { palaceTri, shiLine: 6, yingLine: 3, genType: 'Bát Thuần Quái' };
      }
      // Biến lần lượt từ hào 1..5 để quy về Bát Thuần gốc
      const steps = [
        { change: [0], shi: 1, ying: 4, gen: 'Nhất Thế Quái' },
        { change: [0, 1], shi: 2, ying: 5, gen: 'Nhị Thế Quái' },
        { change: [0, 1, 2], shi: 3, ying: 6, gen: 'Tam Thế Quái' },
        { change: [0, 1, 2, 3], shi: 4, ying: 1, gen: 'Tứ Thế Quái' },
        { change: [0, 1, 2, 3, 4], shi: 5, ying: 2, gen: 'Ngũ Thế Quái' },
        { change: [0, 1, 2, 4], shi: 4, ying: 1, gen: 'Du Hồn Quái' },
        { change: [3], shi: 3, ying: 6, gen: 'Quy Hồn Quái' }
      ];
      for (const st of steps) {
        const test = flip(mainLines, st.change);
        if (isPure(test)) {
          const palaceTri = findTrigramByLines(test[3], test[4], test[5]);
          return { palaceTri, shiLine: st.shi, yingLine: st.ying, genType: st.gen };
        }
      }
      return { palaceTri: TRIGRAMS[1], shiLine: 6, yingLine: 3, genType: 'Bản Cung Quái' };
    }

    function getLucThan(palaceElement, lineElement) {
      const sinh = { Kim: 'Thủy', Thủy: 'Mộc', Mộc: 'Hỏa', Hỏa: 'Thổ', Thổ: 'Kim' };
      const khac = { Kim: 'Mộc', Mộc: 'Thổ', Thổ: 'Thủy', Thủy: 'Hỏa', Hỏa: 'Kim' };
      if (palaceElement === lineElement) return { name: 'Huynh Đệ', role: 'Bạn bè, đồng nghiệp, người cạnh tranh / chia sẻ tài lộc' };
      if (sinh[lineElement] === palaceElement) return { name: 'Phụ Mẫu', role: 'Giấy tờ, hợp đồng, bằng cấp, nhà cửa, xe cộ, người che chở' };
      if (sinh[palaceElement] === lineElement) return { name: 'Tử Tôn', role: 'Phúc thần giải họa, nguồn sinh tài lộc, con cái, sự an vui' };
      if (khac[palaceElement] === lineElement) return { name: 'Thê Tài', role: 'Tiền bạc, lợi nhuận, tài sản, lương thưởng, người vợ' };
      return { name: 'Quan Quỷ', role: 'Công danh, chức vụ, cấp trên (nếu vượng) hoặc áp lực, rắc rối (nếu suy)' };

    function computeLiuYao({ throws, topic, year, month, day }) {
      // throws: mảng 6 giá trị [6 | 7 | 8 | 9] từ hào 1 đến hào 6
      // 6 = Lão Âm (0, động -> 1), 7 = Thiếu Dương (1, tĩnh), 8 = Thiếu Âm (0, tĩnh), 9 = Lão Dương (1, động -> 0)
      const jd = jdFromDate(day, month, year);
      const dayStemIdx = (jd + 9) % 10;
      const dayBranchIdx = (jd + 1) % 12;
      const dayCan = CAN[dayStemIdx];
      const dayChi = CHI[dayBranchIdx];
      const conv = convertSolar2LunarVN(day, month, year, 7);
      const { lunarDay: lDay, lunarMonth: lMonth } = conv;
      const monthBranchIdx = (lMonth + 1) % 12;
      const monthChi = CHI[monthBranchIdx];

      // Tính Tuần Không (Không Vong - 2 Địa Chi vắng mặt trong tuần Giáp của Ngày gieo quẻ)
      const emptyIdx1 = (dayBranchIdx - dayStemIdx + 10 + 12) % 12;
      const emptyIdx2 = (dayBranchIdx - dayStemIdx + 11 + 12) % 12;
      const tuanKhongBranches = [CHI[emptyIdx1], CHI[emptyIdx2]];

      const mainLines = throws.map(v => (v === 7 || v === 9 ? 1 : 0));
      const changedLines = throws.map(v => (v === 9 ? 0 : v === 6 ? 1 : v === 7 ? 1 : 0));

      const lowerTri = findTrigramByLines(mainLines[0], mainLines[1], mainLines[2]);
      const upperTri = findTrigramByLines(mainLines[3], mainLines[4], mainLines[5]);
      const bianLower = findTrigramByLines(changedLines[0], changedLines[1], changedLines[2]);
      const bianUpper = findTrigramByLines(changedLines[3], changedLines[4], changedLines[5]);

      const { palaceTri, shiLine, yingLine, genType } = findPalaceAndShiYing(mainLines);
      const mainBranches = [...lowerTri.najiaInner, ...upperTri.najiaOuter];
      const bianBranches = [...bianLower.najiaInner, ...bianUpper.najiaOuter];
      // 6 Địa Chi của Quẻ Bát Thuần gốc thuộc Họ Quẻ (dùng để tìm Phục Thần khi Dụng Thần ẩn)
      const purePalaceBranches = [...palaceTri.najiaInner, ...palaceTri.najiaOuter];

      // Khởi Lục Thú theo Can Ngày
      const startBeastIdx = ['Giáp', 'Ất'].includes(dayCan) ? 0
        : ['Bính', 'Đinh'].includes(dayCan) ? 1
        : dayCan === 'Mậu' ? 2
        : dayCan === 'Kỷ' ? 3
        : ['Canh', 'Tân'].includes(dayCan) ? 4 : 5;

      const detailedLines = throws.map((val, idx) => {
        const lineNum = idx + 1;
        const isYang = val === 7 || val === 9;
        const isMoving = val === 6 || val === 9;
        const branch = mainBranches[idx];
        const branchIdx = CHI.indexOf(branch);
        const elem = BRANCH_ELEMENTS[branch];
        const lucThan = getLucThan(palaceTri.element, elem);
        const beast = LUC_THU_ORDER[(startBeastIdx + idx) % 6];

        const bianBranch = bianBranches[idx];
        const bianElem = BRANCH_ELEMENTS[bianBranch];
        const bianLucThan = getLucThan(palaceTri.element, bianElem);

        // Phục Thần tại hào này (nếu cần tra cứu từ quẻ Bát Thuần gốc)
        const phucBranch = purePalaceBranches[idx];
        const phucElem = BRANCH_ELEMENTS[phucBranch];
        const phucLucThan = getLucThan(palaceTri.element, phucElem);
        const phiPhucRel = evaluateElementRelation(phucElem, elem); // Tương quan giữa Phục Thần (Thể) và Phi Thần (Dụng)

        // Kiểm tra Tuần Không, Nguyệt Phá, Nhật Xung & Ám Động
        const isTuanKhong = tuanKhongBranches.includes(branch);
        const isNguyetPha = (branchIdx + 6) % 12 === monthBranchIdx;
        const isNhatXung = (branchIdx + 6) % 12 === dayBranchIdx;
        const isAmDong = !isMoving && isNhatXung && !isNguyetPha;

        // Hồi đầu sinh / Hồi đầu khắc khi hào động
        const moveBackRel = isMoving ? evaluateElementRelation(elem, bianElem) : null;

        // 3 mặt đồng xu cổ: 1 = Ngửa (Dương = 3), 0 = Sấp (Âm = 2)
        const coins = val === 9 ? [1, 1, 1] : val === 6 ? [0, 0, 0] : val === 7 ? [1, 0, 0] : [1, 1, 0];

        return {
          lineNum,
          val,
          coins,
          isYang,
          isMoving,
          moveSymbol: val === 9 ? 'O (Dương Động)' : val === 6 ? 'X (Âm Động)' : 'Tĩnh',
          branch,
          elem,
          lucThan,
          beast,
          isShi: lineNum === shiLine,
          isYing: lineNum === yingLine,
          bianBranch,
          bianElem,
          bianLucThan,
          phucBranch,
          phucElem,
          phucLucThan,
          phiPhucRel,
          isTuanKhong,
          isNguyetPha,
          isNhatXung,
          isAmDong,
          moveBackRel
        };
      });

      const topicInfo = TOPIC_DUNG_THAN[topic] || TOPIC_DUNG_THAN.wealth;
      const shiObj = detailedLines.find(l => l.isShi);
      const yingObj = detailedLines.find(l => l.isYing);
      const dungThanLines = topicInfo.target === 'Ứng'
        ? [yingObj]
        : detailedLines.filter(l => l.lucThan.name === topicInfo.target);
      const phucDungThanLines = dungThanLines.length === 0
        ? detailedLines.filter(l => l.phucLucThan.name === topicInfo.target)
        : [];
      const movingLinesList = detailedLines.filter(l => l.isMoving);

      // Xét quan hệ giữa Hào Thế (Bạn) và Hào Ứng / Dụng Thần (hoặc Phục Thần nếu Dụng Thần ẩn)
      const mainDungElem = dungThanLines[0]
        ? dungThanLines[0].elem
        : phucDungThanLines[0]
        ? phucDungThanLines[0].phucElem
        : shiObj.elem;
      const shiDungRel = evaluateElementRelation(shiObj.elem, mainDungElem);

      return {
        dayCanChi: `${dayCan} ${dayChi}`,
        monthChi,
        tuanKhongBranches,
        tuanKhongStr: tuanKhongBranches.join(' – '),
        lDay,
        lMonth,
        palaceTri,
        genType,
        shiLine,
        yingLine,
        mainHex: getHexagramInfo(upperTri.idx, lowerTri.idx),
        bianHex: getHexagramInfo(bianUpper.idx, bianLower.idx),
        detailedLines,
        topicInfo,
        shiObj,
        yingObj,
        dungThanLines,
        phucDungThanLines,
        movingLinesList,
        shiDungRel
      };
    }

                        <div className={`w-[44%] h-full rounded-[1px] ${isMoving ? 'bg-[#9E241E]' : 'bg-[#1C1610]'}`} />

            <span>Hạ: <strong>{hexData.lower.name} ({hexData.lower.element})</strong></span>
          </div>
        </div>
      );
    }

    // =========================================================================
    // 3C. PHÂN HỆ HỢP BÀN ĐÔI LỨA (/heming) & ĐỐI TÁC KINH DOANH (/doi-tac)
    // =========================================================================
    const ELEMENT_VI = { Kim: 'Kim', Moc: 'Mộc', Thuy: 'Thủy', Hoa: 'Hỏa', Tho: 'Thổ' };

    function getNapAmElement(napAmStr) {
      if (napAmStr.endsWith('Kim')) return 'Kim';
      if (napAmStr.endsWith('Mộc')) return 'Mộc';
      if (napAmStr.endsWith('Thủy')) return 'Thủy';
      if (napAmStr.endsWith('Hỏa')) return 'Hỏa';
      return 'Thổ';
    }

    const CAN_HOP_PAIRS = {
      'Giáp-Kỷ': 'Trung Chính Chi Hợp (Hóa Thổ) — Tương kính trọng chữ tín, giữ lời hứa sắt đá',
      'Kỷ-Giáp': 'Trung Chính Chi Hợp (Hóa Thổ) — Tương kính trọng chữ tín, giữ lời hứa sắt đá',
      'Ất-Canh': 'Nhân Nghĩa Chi Hợp (Hóa Kim) — Trọng nghĩa khí, cương nhu bổ khuyết hoàn hảo',
      'Canh-Ất': 'Nhân Nghĩa Chi Hợp (Hóa Kim) — Trọng nghĩa khí, cương nhu bổ khuyết hoàn hảo',
      'Bính-Tân': 'Uy Chế Chi Hợp (Hóa Thủy) — Quyết đoán, sắc sảo, hỗ trợ nhau làm việc lớn',
      'Tân-Bính': 'Uy Chế Chi Hợp (Hóa Thủy) — Quyết đoán, sắc sảo, hỗ trợ nhau làm việc lớn',
      'Đinh-Nhâm': 'Nhân Từ Chi Hợp (Hóa Mộc) — Thấu cảm sâu sắc, giàu tình cảm và trí tuệ',
      'Nhâm-Đinh': 'Nhân Từ Chi Hợp (Hóa Mộc) — Thấu cảm sâu sắc, giàu tình cảm và trí tuệ',
      'Mậu-Quý': 'Vô Tình Chi Hợp (Hóa Hỏa) — Bề ngoài lý trí thực tế nhưng bên trong gắn kết chặt chẽ',
      'Quý-Mậu': 'Vô Tình Chi Hợp (Hóa Hỏa) — Bề ngoài lý trí thực tế nhưng bên trong gắn kết chặt chẽ'
    };

    function evaluateBranchRelation(b1, b2) {
      const i1 = CHI.indexOf(b1);
      const i2 = CHI.indexOf(b2);
      const lucHop = [[0,1],[2,11],[3,10],[4,9],[5,8],[6,7]];
      const tamHop = [[8,0,4],[2,6,10],[11,3,7],[5,9,1]];
      const lucXung = [[0,6],[1,7],[2,8],[3,9],[4,10],[5,11]];
      const lucHai = [[0,7],[1,6],[2,5],[3,4],[8,11],[9,10]];

      if (lucHop.some(([a, b]) => (a === i1 && b === i2) || (a === i2 && b === i1))) {
        return { type: 'Lục Hợp Đại Cát', delta: +10, badge: 'seal-jade', desc: `Địa chi tuổi ${b1} và ${b2} thuộc bộ Lục Hợp — gắn kết khăng khít như hình với bóng, dễ tìm được tiếng nói chung.` };
      }
      if (tamHop.some(grp => grp.includes(i1) && grp.includes(i2) && i1 !== i2)) {
        return { type: 'Tam Hợp Minh Cục', delta: +9, badge: 'seal-jade', desc: `Địa chi tuổi ${b1} và ${b2} nằm trong vòng Tam Hợp — cùng chung chí hướng, càng đồng hành lâu dài càng vượng tài lộc.` };
      }
      if (lucXung.some(([a, b]) => (a === i1 && b === i2) || (a === i2 && b === i1))) {
        return { type: 'Lục Xung (Đối Đỉnh)', delta: -7, badge: 'seal-red', desc: `Địa chi tuổi ${b1} và ${b2} đối xung — cá tính mạnh, góc nhìn đôi lúc trái chiều; cần phân định rõ vai trò hoặc giữ khoảng cách tôn trọng để tránh tranh luận.` };
      }
      if (lucHai.some(([a, b]) => (a === i1 && b === i2) || (a === i2 && b === i1))) {
        return { type: 'Tương Hại Nhẹ', delta: -4, badge: 'seal-amber', desc: `Địa chi tuổi ${b1} và ${b2} có nét tương hại nhẹ về tâm lý — cần thẳng thắn chia sẻ, không giữ chuyện ấm ức trong lòng.` };
      }
      return { type: 'Bình Hòa Tự Chủ', delta: +3, badge: 'seal-amber', desc: `Địa chi tuổi ${b1} và ${b2} bình hòa độc lập — không xung không khắc, tôn trọng không gian riêng của nhau.` };
    }

    function getStarArchetype(majorStars) {
      const names = majorStars.map(s => s.name);
      if (names.some(n => ['Tử Vi', 'Thiên Phủ', 'Vũ Khúc', 'Thiên Tướng', 'Liêm Trinh'].includes(n))) {
        return { group: 'Tử Phủ Vũ Tướng Liêm', role: 'Nhà Quản Trị & Kiến Tạo Tài Chính', style: 'Điềm đạm, trọng chữ tín, giỏi nắm giữ nguồn lực, điều hành tổ chức và quản trị ngân khố.' };
      }
      if (names.some(n => ['Thất Sát', 'Phá Quân', 'Tham Lang'].includes(n))) {
        return { group: 'Sát Phá Tham', role: 'Người Tiên Phong Mở Đường', style: 'Quyết đoán, tốc độ cao, dám đột phá thị trường mới và xoay chuyển cục diện khó.' };
      }
      if (names.some(n => ['Thiên Cơ', 'Thái Âm', 'Thiên Đồng', 'Thiên Lương'].includes(n))) {
        return { group: 'Cơ Nguyệt Đồng Lương', role: 'Quân Sư Hoạch Định & Hậu Phương', style: 'Tinh tế, mưu lược sâu sắc, giỏi lập kế hoạch, kiểm soát rủi ro và chăm sóc nội bộ.' };
      }
      if (names.some(n => ['Thái Dương', 'Cự Môn'].includes(n))) {
        return { group: 'Cự Nhật Quang Minh', role: 'Đại Sứ Đối Ngoại & Truyền Thông', style: 'Khẩu tài thuyết phục, danh tiếng rộng mở, giỏi đàm phán pháp lý và phát triển thương hiệu.' };
      }
      return { group: 'Vô Chính Diệu Linh Hoạt', role: 'Người Phối Hợp Đa Năng', style: 'Mềm dẻo, uyển chuyển, biết lắng nghe và điều tiết hài hòa với đối phương.' };
    }

    function computeSynastry(personA, personB, mode) {
      const chartA = computeHoroscope(personA);
      const chartB = computeHoroscope(personB);

      const napElemA = getNapAmElement(chartA.info.napAm);
      const napElemB = getNapAmElement(chartB.info.napAm);
      const napRel = evaluateElementRelation(napElemA, napElemB);

      const cucElemA = ELEMENT_VI[chartA.info.cucElement] || 'Thổ';
      const cucElemB = ELEMENT_VI[chartB.info.cucElement] || 'Thổ';
      const cucRel = evaluateElementRelation(cucElemA, cucElemB);

      const canPairKey = `${chartA.info.yearStem}-${chartB.info.yearStem}`;
      const canHopDesc = CAN_HOP_PAIRS[canPairKey] || null;
      const chiRel = evaluateBranchRelation(chartA.info.yearBranch, chartB.info.yearBranch);

      // Lấy các cung trọng tâm của 2 bên
      const getPalByName = (chart, pName) => Object.values(chart.palaces).find(p => p.palaceName === pName);
      const aMenh = getPalByName(chartA, 'MỆNH CUNG');
      const bMenh = getPalByName(chartB, 'MỆNH CUNG');
      const aPhuThe = getPalByName(chartA, 'PHU THÊ');
      const bPhuThe = getPalByName(chartB, 'PHU THÊ');
      const aPhuc = getPalByName(chartA, 'PHÚC ĐỨC');
      const bPhuc = getPalByName(chartB, 'PHÚC ĐỨC');
      const aQuan = getPalByName(chartA, 'QUAN LỘC');
      const bQuan = getPalByName(chartB, 'QUAN LỘC');
      const aTai = getPalByName(chartA, 'TÀI BẠCH');
      const bTai = getPalByName(chartB, 'TÀI BẠCH');
      const aNo = getPalByName(chartA, 'NÔ BỘC');
      const bNo = getPalByName(chartB, 'NÔ BỘC');
      const aDi = getPalByName(chartA, 'THIÊN DI');
      const bDi = getPalByName(chartB, 'THIÊN DI');

      const archA = getStarArchetype(aMenh.majorStars);
      const archB = getStarArchetype(bMenh.majorStars);

      // Phi Tứ Hóa tương tác giữa Can tuổi Bên Giáp -> Lá số Bên Ất và ngược lại
      const sihuaFromA = SIHUA_MAP[chartA.info.yearStem] || {};
      const sihuaFromB = SIHUA_MAP[chartB.info.yearStem] || {};

      const findPalaceWhereStarLands = (chart, starName) => {
        for (const p of Object.values(chart.palaces)) {
          if (p.majorStars.some(s => s.name === starName) || p.minorCats.some(c => c.startsWith(starName)) || p.minorSats.some(c => c.startsWith(starName))) {
            return p;
          }
        }
        return aMenh;
      };

      const aLocStar = Object.keys(sihuaFromA).find(k => sihuaFromA[k] === 'Lộc');
      const bLocStar = Object.keys(sihuaFromB).find(k => sihuaFromB[k] === 'Lộc');
      const aLocInB = findPalaceWhereStarLands(chartB, aLocStar);
      const bLocInA = findPalaceWhereStarLands(chartA, bLocStar);

      // Tính điểm tổng hợp (thang 100)
      let totalScore = Math.round(((napRel.score + cucRel.score) / 2) * 10) + chiRel.delta + (canHopDesc ? 6 : 0);
      totalScore = Math.max(62, Math.min(98, totalScore));
      const rankLabel = totalScore >= 86 ? 'Thượng Thượng Hợp — Lương Duyên / Đối Tác Vàng'
        : totalScore >= 75 ? 'Khá Hòa Hợp — Bổ Khuyết Tương Trợ Bền Vững'
        : 'Cần Điều Tiết & Phân Vai Rõ Ràng Để Hóa Giải Xung Khắc';

      return {
        chartA,
        chartB,
        napElemA,
        napElemB,
        napRel,
        cucElemA,
        cucElemB,
        cucRel,
        canHopDesc,
        chiRel,
        archA,
        archB,
        palacesCompare: {
          aMenh, bMenh, aPhuThe, bPhuThe, aPhuc, bPhuc,
          aQuan, bQuan, aTai, bTai, aNo, bNo, aDi, bDi
        },
        phiHoa: {
          aLocStar, bLocStar, aLocInB, bLocInA
        },
        totalScore,
        rankLabel
      };
    }
