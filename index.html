    // Công cụ tính Tuổi Xông Đất & Mở Hàng Khai Trương Đầu Năm (Động vạn niên theo bất kỳ năm tra cứu nào)
    function computeXongDat(hostLunarYear, targetYear = NEXT_LUNAR_YEAR) {
      const hostChiIdx = ((hostLunarYear - 4) % 12 + 12) % 12;
      const { branchIdx: yearChiIdx } = getYearCanChiInfo(targetYear);
      const minBirthYear = targetYear - 72;
      const maxBirthYear = targetYear - 18;
      const candidates = [];
      for (let y = minBirthYear; y <= maxBirthYear; y++) {
        const cIdx = ((y - 4) % 12 + 12) % 12;
        const sIdx = ((y - 4) % 10 + 10) % 10;
        const canChi = `${CAN[sIdx]} ${CHI[cIdx]}`;
        const napStr = NAP_AM[canChi] || 'Thiên Hà Thủy';
        const nap = { name: napStr, element: getNapAmElement(napStr) };
        const relHost = evaluateBranchRelation(CHI[hostChiIdx], CHI[cIdx]);
        const relYear = evaluateBranchRelation(CHI[yearChiIdx], CHI[cIdx]);
        const total = relHost.delta + relYear.delta;
        if (total >= 12) {
          candidates.push({ year: y, canChi, nap, reason: `${relHost.type} với Gia chủ & ${relYear.type} với Năm ${targetYear}`, score: total });
        }
      }
      return candidates.sort((a, b) => b.score - a.score).slice(0, 6);
    }

    // =========================================================================
    // 3E. CÔNG CỤ CHUYÊN GIA: PHI TINH TỨ HÓA 12 CUNG (BẮC PHÁI) & SAO LƯU NIÊN
    // =========================================================================
    function computePalacePhiTinh(sourcePalace, allPalaces, sihuaSchool = 'namphai') {
      if (!sourcePalace || !allPalaces) return [];
      const stem = sourcePalace.stemName;
      const schoolTable = (SI_HUA_BY_SCHOOL[sihuaSchool] || SI_HUA_BY_SCHOOL.namphai)[stem] || SI_HUA_TABLE[stem];
      if (!schoolTable) return [];

      const types = [
        { idx: 0, key: 'Lộc', short: 'Phi Lộc', color: '#196B50', badgeCls: 'seal-jade', roleDesc: 'mang nguồn sinh khí, tài lộc, cơ hội thuận lợi và nhân duyên tốt lành' },
        { idx: 1, key: 'Quyền', short: 'Phi Quyền', color: '#B45309', badgeCls: 'seal-amber', roleDesc: 'truyền sức mạnh chủ động, quyền kiểm soát, sự quyết đoán và năng lực quản lý' },
        { idx: 2, key: 'Khoa', short: 'Phi Khoa', color: '#1D4ED8', badgeCls: 'seal-jade', roleDesc: 'đem lại quý nhân che chở, uy tín học thuật, danh tiếng và sự hóa giải êm đẹp' },
        { idx: 3, key: 'Kỵ', short: 'Phi Kỵ', color: '#9E241E', badgeCls: 'seal-red', roleDesc: 'dồn sự bận tâm, áp lực, duyên nợ ràng buộc hoặc điểm cần thận trọng giữ gìn' }
      ];

      return types.map(t => {
        const starName = schoolTable[t.idx];
        const targetPal = Object.values(allPalaces).find(p =>
          p.majorStars.some(s => s.name === starName) ||
          p.minorCats.some(c => c.startsWith(starName)) ||
          p.minorSats.some(s => s.startsWith(starName))
        ) || sourcePalace;
        const isSelf = targetPal.branchName === sourcePalace.branchName;
        const oppBranch = CHI[(CHI.indexOf(targetPal.branchName) + 6) % 12];
        const oppPal = allPalaces[oppBranch];

        return {
          ...t,
          stem,
          starName,
          sourceBranch: sourcePalace.branchName,
          sourcePalaceName: sourcePalace.palaceName,
          targetBranch: targetPal.branchName,
          targetPalaceName: targetPal.palaceName,
          oppBranch,
          oppPalaceName: oppPal ? oppPal.palaceName : '',
          isSelf,
          explain: isSelf
            ? `Cung ${sourcePalace.palaceName} (${stem} ${sourcePalace.branchName}) kích hoạt sao ${starName} [Tự Hóa ${t.key}] ngay tại bản cung — ${t.roleDesc} tự vận động nội tại trong phương diện ${sourcePalace.palaceName}.`
            : `Can ${stem} của cung ${sourcePalace.palaceName} phi [${starName} Hóa ${t.key}] bay thẳng vào cung ${targetPal.palaceName} (${targetPal.branchName}) — ${t.roleDesc} từ ${sourcePalace.palaceName} rót sang ${targetPal.palaceName}${t.key === 'Kỵ' && oppPal ? ` (đồng thời xung động cung đối diện là ${oppPal.palaceName} tại ${oppBranch})` : ''}.`
        };
      });
    }

    function computeLuuTinhMap(targetYear = CURRENT_LUNAR_YEAR, sihuaSchool = 'namphai') {
      const { stemIdx, branchIdx, stem } = getYearCanChiInfo(targetYear);
      const byBranch = {};
      const fullByBranch = {};
      CHI.forEach(c => { byBranch[c] = []; fullByBranch[c] = []; });

      const addCore = (br, name, type) => {
        if (byBranch[br]) byBranch[br].push({ name, type });
        if (fullByBranch[br]) fullByBranch[br].push({ name, type });
      };
      const addExtra = (br, name, type) => {
        if (fullByBranch[br]) fullByBranch[br].push({ name, type });
      };

      // 1. Trọn Vòng 12 Sao Lưu Thái Tuế + Sao Lưu Trọng Tâm trên bàn 12 cung (Vạn niên 60 Hoa Giáp)
      const luuThaiTue12 = [
        ['L.Thái Tuế', 'cat', true],
        ['L.Thiếu Dương', 'cat', false],
        ['L.Tang Môn', 'sat', true],
        ['L.Thiếu Âm', 'cat', false],
        ['L.Quan Phù', 'sat', false],
        ['L.Tử Phù', 'sat', false],
        ['L.Tuế Phá', 'sat', false],
        ['L.Long Đức', 'cat', false],
        ['L.Bạch Hổ', 'sat', true],
        ['L.Phúc Đức', 'cat', false],
        ['L.Điếu Khách', 'sat', false],
        ['L.Trực Phù', 'sat', false]
      ];
      luuThaiTue12.forEach(([nm, tp, isCore], idx) => {
        const br = CHI[(branchIdx + idx) % 12];
        if (isCore) addCore(br, nm, tp);
        else addExtra(br, nm, tp);
      });

      addCore(CHI[(6 - branchIdx + 12) % 12], 'L.Thiên Khốc', 'sat');
      addCore(CHI[(6 + branchIdx) % 12], 'L.Thiên Hư', 'sat');

      // 2. Sao Lưu theo Thiên Can & Địa Chi năm xem (Công thức tổng quát 60 Hoa Giáp)
      const locBranch = LOC_TON_POS[stem] || 'Tỵ';
      const locIdx = CHI.indexOf(locBranch);
      addCore(locBranch, 'L.Lộc Tồn', 'cat');
      addCore(CHI[(locIdx + 1) % 12], 'L.Kình Dương', 'sat');
      addCore(CHI[(locIdx + 11) % 12], 'L.Đà La', 'sat');
      addCore(['Dần', 'Hợi', 'Thân', 'Tỵ'][branchIdx % 4], 'L.Thiên Mã', 'cat');

      const khoiVietMap = {
        'Giáp': ['Sửu', 'Mùi'], 'Mậu': ['Sửu', 'Mùi'], 'Canh': ['Sửu', 'Mùi'],
        'Ất': ['Tý', 'Thân'], 'Kỷ': ['Tý', 'Thân'],
        'Bính': ['Hợi', 'Dậu'], 'Đinh': ['Hợi', 'Dậu'],
        'Tân': ['Ngọ', 'Dần'],
        'Nhâm': ['Mão', 'Tỵ'], 'Quý': ['Mão', 'Tỵ']
      };
      const [khoiBr, vietBr] = khoiVietMap[stem] || ['Hợi', 'Dậu'];
      addExtra(khoiBr, 'L.Thiên Khôi', 'cat');
      addExtra(vietBr, 'L.Thiên Việt', 'cat');
      addExtra(['Tỵ', 'Ngọ', 'Thân', 'Dậu', 'Thân', 'Dậu', 'Hợi', 'Tý', 'Dần', 'Mão'][stemIdx], 'L.Văn Xương', 'cat');
      addExtra(['Dậu', 'Thân', 'Ngọ', 'Tỵ', 'Ngọ', 'Tỵ', 'Mão', 'Dần', 'Tý', 'Hợi'][stemIdx], 'L.Văn Khúc', 'cat');

      // Hồng Loan (Mão nghịch theo Chi năm), Thiên Hỷ (đối Hồng Loan), Đào Hoa, Cô Thần, Quả Tú theo Tam Hợp / Tam Hội
      const hongIdx = (3 - branchIdx + 12) % 12;
      const [coThanBr, quaTuBr] = [['Dần', 'Tuất'], ['Tỵ', 'Sửu'], ['Thân', 'Thìn'], ['Hợi', 'Mùi']][Math.floor(((branchIdx + 1) % 12) / 3)];
      addExtra(CHI[hongIdx], 'L.Hồng Loan', 'cat');
      addExtra(CHI[(hongIdx + 6) % 12], 'L.Thiên Hỷ', 'cat');
      addExtra(['Dậu', 'Ngọ', 'Mão', 'Tý'][branchIdx % 4], 'L.Đào Hoa', 'cat');
      addExtra(coThanBr, 'L.Cô Thần', 'sat');
      addExtra(quaTuBr, 'L.Quả Tú', 'sat');

      const schoolTable = (SI_HUA_BY_SCHOOL[sihuaSchool] || SI_HUA_BY_SCHOOL.namphai)[stem] || SI_HUA_TABLE[stem];
      const luuSihua = {
        [schoolTable[0]]: 'L.Lộc',
        [schoolTable[1]]: 'L.Quyền',
        [schoolTable[2]]: 'L.Khoa',
        [schoolTable[3]]: 'L.Kỵ'
      };

      return { byBranch, fullByBranch, luuSihua, schoolTable, stem, branch: CHI[branchIdx] };
    }

    // =========================================================================
    // 3F. ĐỘNG CƠ CHỒNG 4 TẦNG VẬN HẠN NAM PHÁI + BẮC PHÁI (CHUẨN THÁI THỨ LANG)
    // =========================================================================
    function computeFourLayerFortune(horoscope, targetYear = CURRENT_LUNAR_YEAR, sihuaSchool = 'namphai') {
      const lunarAge = targetYear - horoscope.info.lYear + 1;
      const activeDaiVan = horoscope.daiVanList.find(dv => lunarAge >= dv.startAge && lunarAge <= dv.endAge) || horoscope.daiVanList[2] || horoscope.daiVanList[0];
      const daiVanPalace = horoscope.palaces[activeDaiVan.branch];

      const luuTinh = computeLuuTinhMap(targetYear, sihuaSchool);
      const luuNienBranch = luuTinh.branch;
      const luuNienPalace = horoscope.palaces[luuNienBranch];

      // Tầng 4A: Tiểu Hạn theo Tuổi (Nam thuận, Nữ nghịch từ thStart của Tam hợp tuổi)
      const ageOffset = Math.max(0, lunarAge - 1);
      const thStart = horoscope.info.thStart ?? 4;
      const tieuHanIdx = horoscope.info.gender === 'male'
        ? (thStart + ageOffset) % 12
        : ((thStart - ageOffset) % 12 + 12) % 12;
      const tieuHanBranch = CHI[tieuHanIdx];
      const tieuHanPalace = horoscope.palaces[tieuHanBranch];

      // Tầng 4B: Lưu Niên Đại Hạn (Tiểu Vận chuẩn Nam Phái: năm 1 bản cung ĐV, năm 2 xung, năm 3 lùi/tiến 1 cung, năm 4 về xung, năm 5..9 đi tiếp, năm 10 về bản cung ĐV)
      const dvIdx = CHI.indexOf(activeDaiVan.branch);
      const oppDvIdx = (dvIdx + 6) % 12;
      const stepSign = horoscope.info.isForward ? 1 : -1;
      const yearInDecade = Math.max(0, Math.min(9, lunarAge - activeDaiVan.startAge));
      let tieuVanIdx = dvIdx;
      if (yearInDecade === 0) tieuVanIdx = dvIdx;
      else if (yearInDecade === 1) tieuVanIdx = oppDvIdx;
      else if (yearInDecade === 2) tieuVanIdx = (oppDvIdx - stepSign + 12) % 12;
      else if (yearInDecade === 3) tieuVanIdx = oppDvIdx;
      else if (yearInDecade >= 4 && yearInDecade <= 8) tieuVanIdx = (oppDvIdx + (yearInDecade - 3) * stepSign + 12) % 12;
      else tieuVanIdx = dvIdx;
      const tieuVanBranch = CHI[tieuVanIdx];
      const tieuVanPalace = horoscope.palaces[tieuVanBranch];

      // Định vị 4 sao Lưu Tứ Hóa năm xem rơi vào cung nào trên lá số
      const findStarPalace = (sName) =>
        Object.values(horoscope.palaces).find(p =>
          p.majorStars.some(s => s.name === sName) ||
          p.minorCats.some(c => c.startsWith(sName)) ||
          p.minorSats.some(s => s.startsWith(sName))
        ) || luuNienPalace;

      const luuSihuaHits = [
        { type: 'L.Hóa Lộc', star: luuTinh.schoolTable[0], pal: findStarPalace(luuTinh.schoolTable[0]), meaning: 'nơi dòng tiền mới, cơ hội hanh thông và quý nhân mang mối tới trong năm' },
        { type: 'L.Hóa Quyền', star: luuTinh.schoolTable[1], pal: findStarPalace(luuTinh.schoolTable[1]), meaning: 'nơi bạn nắm quyền tự quyết, tăng gánh vác và bứt phá vị thế' },
        { type: 'L.Hóa Khoa', star: luuTinh.schoolTable[2], pal: findStarPalace(luuTinh.schoolTable[2]), meaning: 'nơi có giấy tờ thuận, uy tín chuyên môn và sức che chở giải hạn' },
        { type: 'L.Hóa Kỵ', star: luuTinh.schoolTable[3], pal: findStarPalace(luuTinh.schoolTable[3]), meaning: 'điểm nghẽn dễ hao tâm, chậm tiến độ, vướng lời nói hoặc giấy tờ cần khóa chặt' }
      ];

      return {
        targetYear,
        lunarAge,
        yearInDecade: yearInDecade + 1,
        activeDaiVan,
        daiVanPalace,
        luuNienBranch,
        luuNienPalace,
        tieuHanBranch,
        tieuHanPalace,
        tieuVanBranch,
        tieuVanPalace,
        luuTinh,
        luuSihuaHits
      };
    }

      'Thiên Phủ': 'căn kho lớn có mái che — giỏi gom, giỏi giữ và điều phối nguồn lực bền bỉ; đặt trong tổ chức vững thì tiền đọng lại thành của lớn',
      'Thái Âm': 'mảnh ruộng tốt bồi đắp qua từng mùa — tiền và nhà cửa không đến kiểu ăn xổi một đêm mà dày lên chắc chắn nhờ tích lũy ngầm',
      'Tham Lang': 'người mở hội giao thương — nhạy thời cuộc, giỏi kết nối khách khứa và xoay mối mới, nhưng phải có kỷ luật khóa lãi kẻo vui tay chi quá đà',
      'Cự Môn': 'lưỡi dao mổ phân tích đến tận gốc — thắng lớn nhờ chuyên môn sâu, tư vấn, luật lệ, kỹ thuật; chỉ cần uốn mềm câu nói lúc bất đồng',
      'Thiên Tướng': 'con dấu đỏ trên bàn giấy — trọng chữ tín, gánh trách nhiệm đẹp lòng trên dưới, hợp vai điều phối hoặc giữ chuẩn chất lượng hơn là liều mạng lướt sóng',
      'Thiên Lương': 'mái hiên cổ thụ che nắng mưa — có duyên với nghề cố vấn, giáo dục, y dược, kiểm soát rủi ro; đi đường chính đạo thì gặp nguy tự có người đỡ',
      'Thất Sát': 'mũi giáo mở đường — giao cho dự án khó, thị trường mới và trao quyền tự quyết thì làm ra việc lớn; nhốt vào việc bàn giấy lặp lại thì bí bách',
      'Phá Quân': 'con tàu phá băng — sinh ra để đập bỏ cách làm cũ kỹ và dựng mô hình mới; tiền thường đi qua một nhịp dồn vốn vất vả rồi mới bật thành quả lớn'
    };

    function detectQuestionTopic(qText, fallbackCat = 'career') {
      const s = (qText || '').toLowerCase();
      if (/cưới|lấy vợ|lấy chồng|người yêu|tình cảm|duyên|chia tay|vợ chồng|hôn nhân/.test(s)) return 'love';
      if (/nhà|đất|mua đất|chung cư|xây|sửa nhà|chỗ ở|mặt bằng|bất động sản/.test(s)) return 'property';
      if (/hùn vốn|làm chung|góp vốn|cổ đông|đối tác|bạn bè|nhân sự/.test(s)) return 'partnership';
      if (/sức khỏe|sức khoẻ|bệnh|mệt|khám|con cái|sinh con/.test(s)) return 'health';
      if (/tiền|giàu|nợ|vay|đầu tư|tiết kiệm|tài chính|lỗ|lãi/.test(s)) return 'wealth';
      if (/việc|công ty|tự do|nhảy việc|chuyển việc|nghề|sự nghiệp|lương|đi làm/.test(s)) return 'career';
      return fallbackCat;
    }

    function computeDecisionAdvisor({
      horoscope,
      targetYear = DEFAULT_ADVISOR_YEAR,
      mode = 'one', // 'one' | 'year' | 'life'
      questionText = '',
      category = 'career',
      workStatus = 'company',
      maritalStatus = 'single',
      useIChing = true
    }) {
      const f4 = computeFourLayerFortune(horoscope, targetYear, horoscope.info.sihuaSchool || 'namphai');
      const getPal = (pName) => Object.values(horoscope.palaces).find(p => p.palaceName === pName) || horoscope.palaces[horoscope.info.menhBranch];

      const menhP = getPal('MỆNH CUNG');
      const quanP = getPal('QUAN LỘC');
      const taiP = getPal('TÀI BẠCH');
      const noP = getPal('NÔ BỘC');
      const diP = getPal('THIÊN DI');
      const dienP = getPal('ĐIỀN TRẠCH');
      const phuP = getPal('PHU THÊ');
      const phucP = getPal('PHÚC ĐỨC');
      const phuMauP = getPal('PHỤ MẪU');
      const huynhP = getPal('HUYNH ĐỆ');
      const tuTucP = getPal('TỬ TỨC');
      const tatP = getPal('TẬT ÁCH');

      const menhStar = menhP.majorStars[0]?.name || f4.daiVanPalace.majorStars[0]?.name || 'Thiên Cơ';
      const metaphor = STAR_EVERYDAY_METAPHOR[menhStar] || 'người giữ tay lái vững — biết nương theo thời thế để giữ chắc thành quả';

      const topic = detectQuestionTopic(questionText, category);
      const focusPalMap = {
        career: quanP,
        wealth: taiP,
        partnership: noP,
        love: phuP,
        property: dienP,
        health: tatP
      };
      const focusPal = focusPalMap[topic] || quanP;
      const focusReading = generatePalaceReading(focusPal, horoscope.palaces);
      const focusPhi = computePalacePhiTinh(focusPal, horoscope.palaces, horoscope.info.sihuaSchool || 'namphai');
      const phiLoc = focusPhi.find(x => x.key === 'Lộc');
      const phiKy = focusPhi.find(x => x.key === 'Kỵ');

      const luuLocHit = f4.luuSihuaHits[0];
      const luuQuyenHit = f4.luuSihuaHits[1];
      const luuKhoaHit = f4.luuSihuaHits[2];
      const luuKyHit = f4.luuSihuaHits[3];

      // Ghép Quẻ Dịch Mai Hoa theo Câu Hỏi + Thời Khắc Hiện Tại (Mệnh - Bốc Hợp Tham)
      const now = new Date();
      const meiHua = useIChing
        ? computeMeiHua({
            mode: (questionText || '').trim().length >= 6 ? 'thought' : 'time',
            year: now.getFullYear(),
            month: now.getMonth() + 1,
            day: now.getDate(),
            hour: now.getHours(),
            minute: now.getMinutes(),
            questionText: questionText || `Vận trình ${focusPal.palaceName} năm ${targetYear}`,
            horoscope
          })
        : null;

      // Tính điểm thuận lợi tổng hợp (Mệnh gốc + Đại vận + Lưu niên/Tiểu hạn + Quẻ Dịch)
      const dvReading = generatePalaceReading(f4.daiVanPalace, horoscope.palaces);
      const lnReading = generatePalaceReading(f4.luuNienPalace, horoscope.palaces);
      const thReading = generatePalaceReading(f4.tieuHanPalace, horoscope.palaces);
      let compositeScore = (focusReading.score * 0.35) + (dvReading.score * 0.25) + (lnReading.score * 0.2) + (thReading.score * 0.2);
      if (meiHua) {
        compositeScore = compositeScore * 0.78 + meiHua.finalRelation.score * 0.22;
      }
      if (luuKyHit.pal.branchName === focusPal.branchName) compositeScore -= 0.5;
      if (luuLocHit.pal.branchName === focusPal.branchName || luuQuyenHit.pal.branchName === focusPal.branchName) compositeScore += 0.5;
      compositeScore = Number(Math.max(5.2, Math.min(9.6, compositeScore)).toFixed(1));

      const confidence = horoscope.info.unknownHour
        ? { label: 'Tạm định (Chưa rõ giờ sinh)', badge: 'seal-amber', note: 'Do bạn đang bật chế độ chưa rõ giờ sinh, hệ thống tạm neo theo Giờ Tý; khuyến nghị đối chiếu thêm tính cách thực tế.' }
        : mode === 'life'
        ? { label: 'Cao (Khung Tiên Thiên & Đại Vận cố định)', badge: 'seal-jade', note: 'Đọc từ cấu trúc 12 cung gốc đã hiệu chỉnh Chân Thái Dương Thời và Đại vận 10 năm đang đi.' }
        : useIChing
        ? { label: 'Khá rõ (Kết hợp Lá số & Quẻ Dịch)', badge: 'seal-jade', note: 'Đã đối chiếu 4 tầng vận hạn Tử Vi cùng Quẻ Dịch Mai Hoa gieo theo giờ hỏi cho việc cụ thể này.' }
        : { label: 'Vừa – Khá (Đủ 4 tầng hạn năm)', badge: 'seal-amber', note: 'Tổng hợp từ Đại vận, Lưu Thái Tuế, Tiểu hạn và Lưu niên Đại hạn; kết quả ngoài đời còn tùy thuộc vào cách bạn thu xếp và hành động.' };

      const fmtMajors = (p) => p.majorStars.map(s => `${s.name} (${s.brightShort}${s.mutagen ? `·${s.mutagen}` : ''})`).join(', ') || 'Vô Chính Diệu';
      const workCtxLabel = WORK_STATUS_LABELS[workStatus] || WORK_STATUS_LABELS.company;
      const maritalCtxLabel = MARITAL_STATUS_LABELS[maritalStatus] || MARITAL_STATUS_LABELS.single;

      // Xây dựng Nội dung cho GÓI 1: HỎI MỘT QUYẾT ĐỊNH (4 bước thực chiến)
      const isFavorable = compositeScore >= 7.4;
      const isStructuredStar = [...menhP.majorStars, ...quanP.majorStars].some(s => ['Tử Vi', 'Thiên Phủ', 'Vũ Khúc', 'Thiên Tướng', 'Thái Âm', 'Thiên Lương'].includes(s.name));
      const noHasFriction = noP.minorSats.length >= 2 || luuKyHit.pal.palaceName === 'NÔ BỘC';

      let directAnswer = '';
      if (topic === 'career') {
        if (workStatus === 'freelance') {
          directAnswer = isStructuredStar
            ? `Nói thẳng cho dễ quyết: Năm ${targetYear} (${f4.luuTinh.stem} ${f4.luuTinh.branch}) bạn NÊN bước vào một tổ chức/công ty có quy trình rõ ràng (hoặc ký hợp đồng cố vấn dài hạn theo tháng) thay vì tiếp tục bơi tự do lẻ tẻ một mình. Đứng trong bộ máy có khuôn phép, bạn vừa có người giao việc lớn đúng tầm, vừa giữ được đồng tiền đều đặn mỗi tháng.`
            : `Nói thẳng cho dễ quyết: Năm ${targetYear} bạn vẫn giữ được hướng làm độc lập chuyên môn, NHƯNG phải đổi từ kiểu "ai gọi gì làm nấy" sang chốt gói dịch vụ chuẩn với 2–3 khách hàng lớn cố định. Đừng ôm việc vụn không hợp đồng kẻo làm nhiều mà tiền về lắt nhắt.`;
        } else if (workStatus === 'company') {
          directAnswer = isFavorable
            ? `Nói thẳng cho dễ quyết: Năm ${targetYear} cửa chuyển dịch và nâng bậc công việc của bạn SÁNG (${compositeScore}/10). Bạn hoàn toàn có thể nhận vai mới hoặc sang môi trường tốt hơn, miễn là chỉ nộp đơn nghỉ sau khi đã cầm chắc thư mời nhận việc (Offer) bằng văn bản.`
            : `Nói thẳng cho dễ quyết: Giai đoạn này (${compositeScore}/10) bạn NÊN giữ chân trụ ở nơi có dòng lương ổn định trước, rèn sâu một kỹ năng mũi nhọn thêm 6 tháng rồi hẵng bước đi. Nhảy việc vội lúc tâm lý đang bực bội dễ tránh vỏ dưa gặp vỏ dừa.`;
        } else {
          directAnswer = isFavorable
            ? `Nói thẳng cho dễ quyết: Năm ${targetYear} trục công việc của bạn mở ra mối mới đáng làm (${compositeScore}/10). Hãy tập trung dồn lực vào mảng tạo ra dòng tiền thật nhanh nhất, cắt bớt các nhánh thử nghiệm dàn trải.`
            : `Nói thẳng cho dễ quyết: Năm ${targetYear} về công việc nên lấy chữ CHẮC làm đầu (${compositeScore}/10) — ưu tiên giữ khách quen, siết chi phí vận hành và chưa vội vay mượn mở rộng quy mô ồ ạt.`;
        }
      } else if (topic === 'partnership') {
        directAnswer = noHasFriction
          ? `Nói thẳng cho dễ quyết: KHÔNG nên góp vốn chung một túi tiền mập mờ với bạn bè hay người quen trong năm ${targetYear}. Làm cùng theo từng thương vụ độc lập (ai làm phần nào hưởng phần nấy trên giấy trắng mực đen) thì được; gộp chung két sắt rất dễ lời qua tiếng lại rồi sứt mẻ tình cảm.`
          : `Nói thẳng cho dễ quyết: Bạn CÓ THỂ hợp tác trong năm ${targetYear}, đặc biệt với người bổ khuyết ngược tính cách với mình (một người mở thị trường, một người giữ sổ sách), nhưng bắt buộc lập thỏa thuận phân quyền rút vốn ngay từ ngày đầu.`;
      } else if (topic === 'wealth') {
        directAnswer = `Nói thẳng cho dễ quyết: Lá số của bạn làm ra tiền bằng thực lực chứ không nghèo, chỗ rò rỉ nằm ở khâu giữ tiền và nể nang người quen. Năm ${targetYear}, dòng lộc sáng nhất nằm ở mảng [${luuLocHit.pal.palaceName}] (${luuLocHit.star} L.Hóa Lộc), còn chỗ dễ hao hụt nhất nằm ở [${luuKyHit.pal.palaceName}] (${luuKyHit.star} L.Hóa Kỵ) — khóa được lỗ rò này là cuối năm dư của rõ rệt.`;
      } else if (topic === 'love') {
        directAnswer = maritalStatus === 'married'
          ? `Nói thẳng cho dễ quyết: Giữa hai vợ chồng năm ${targetYear} nền tảng vẫn đi cùng nhau vững, chỗ va chạm chủ yếu là chuyện "ai quyết việc nhà, việc tiền" và lời nói lúc mệt. Chỉ cần nhường một nhịp khi tranh luận và minh bạch quỹ chung là êm ấm.`
          : `Nói thẳng cho dễ quyết: Nhân duyên năm ${targetYear} mở qua môi trường công việc hoặc người quen giới thiệu (${f4.luuTinh.stem} ${f4.luuTinh.branch}). Đừng tìm người hào nhoáng bề ngoài; người hợp mệnh bạn nhất là người có nghề nghiệp độc lập, tính tình chín chắn và nói ít làm nhiều.`;
      } else if (topic === 'property') {
        directAnswer = (dienP.hasTuan || dienP.hasTriet || luuKyHit.pal.palaceName === 'ĐIỀN TRẠCH')
          ? `Nói thẳng cho dễ quyết: Chuyện nhà đất/sửa sang trong năm ${targetYear} LÀM ĐƯỢC nhưng tiến độ giấy tờ và thợ thuyền sẽ kéo dài chậm hơn dự kiến 1–2 nhịp. Tuyệt đối kiểm tra kỹ sổ đỏ/quy hoạch và khóa trần chi phí bằng hợp đồng trọn gói trước khi xuống tiền.`
          : `Nói thẳng cho dễ quyết: Năm ${targetYear} rất thuận để bạn gom tiền chuyển hóa sang nhà đất hoặc nâng cấp không gian sống (${compositeScore}/10). Tài sản vào tay cung Điền Trạch (${fmtMajors(dienP)}) là chiếc neo giữ của bền nhất cho lá số này.`;
      } else {
        directAnswer = `Nói thẳng cho dễ quyết: Xét trên hoàn cảnh [${workCtxLabel} · ${maritalCtxLabel}], bước đi năm ${targetYear} của bạn nghiêng về hướng ${isFavorable ? 'CHỦ ĐỘNG TIẾN LÊN CÓ KỶ LUẬT' : 'GIỮ CHẮC GỐC & CHUẨN BỊ KỸ LƯỠNG'} (Điểm hội tụ Mệnh – Vận: ${compositeScore}/10).`;
      }

      const whyMechanism = `Cốt cách gốc của bạn mang hình ảnh của ${metaphor} (Mệnh tại ${menhP.branchName}: ${fmtMajors(menhP)}; ${horoscope.info.thanCu}). Bạn đang đi trong Đại vận 10 năm (${f4.activeDaiVan.startAge}–${f4.activeDaiVan.endAge} tuổi) qua cung ${f4.daiVanPalace.palaceName} (${f4.activeDaiVan.branch}: ${fmtMajors(f4.daiVanPalace)}) — đây là chặng đời buộc bạn phải tự cầm lái và định hình lại nguyên tắc làm việc – giữ tiền. Bước vào năm ${targetYear}, Can cung ${focusPal.palaceName} bắn [${phiLoc.starName} Phi Lộc] sang ${phiLoc.targetPalaceName} (mở ra nguồn sinh khí từ đó), đồng thời bắn [${phiKy.starName} Phi Kỵ] vào ${phiKy.targetPalaceName} (chỉ đúng nơi làm bạn bận tâm nhiều nhất).`;

      const howItUnfolds = `Trong năm ${targetYear}, Tiểu hạn tuổi của bạn rơi vào cung ${f4.tieuHanPalace.palaceName} (${f4.tieuHanBranch}) và Tiểu vận (Lưu niên Đại hạn) điểm vào ${f4.tieuVanPalace.palaceName} (${f4.tieuVanBranch}). Cơ hội thực tế sẽ gõ cửa qua ngả [${luuLocHit.pal.palaceName}] và sự nâng đỡ giấy tờ/danh tiếng tại [${luuKhoaHit.pal.palaceName}]. Tuy nhiên, vài tháng đầu dễ có nhịp chững hoặc lời qua tiếng lại ở mảng [${luuKyHit.pal.palaceName}] (${luuKyHit.star} Hóa Kỵ năm ${targetYear}).${meiHua ? ` Đối chiếu thêm Quẻ Dịch động tâm vừa khởi được quẻ 【${meiHua.mainHex.name}】 biến 【${meiHua.bianHex.name}】 (${meiHua.finalRelation.label}): ${meiHua.bianHex.brief}` : ''}`;

      const actionChecklist = [
        `Khóa chặt giấy tờ & thỏa thuận ở mảng ${luuKyHit.pal.palaceName}: Mọi cam kết về phạm vi việc, tiến độ và chia tiền trong năm ${targetYear} đều chốt lại bằng văn bản/tin nhắn rõ ràng, không làm dựa trên lời hứa miệng.`,
        `Đón đúng mạch Lộc tại ${luuLocHit.pal.palaceName} & ${phiLoc.targetPalaceName}: Chủ động dành 70% thời gian đẹp nhất trong tuần cho hướng tạo ra giá trị thật này thay vì ôm đồm việc phụ.`,
        `Kỷ luật hai ngăn ví tiền: Ngay ngày tiền công/doanh thu về tài khoản, trích cứng tối thiểu 20–30% sang tài khoản tích lũy tài sản (${dienP.palaceName}) trước khi chi tiêu, tuyệt đối không cho vay mượn cả nể trong năm ${targetYear}.`,
        `Giữ nhịp thân – tâm (${horoscope.info.healthOrgan.organ}): Đặt lịch nghỉ cố định mỗi tuần 1 ngày không màn hình căng thẳng, khi bất đồng với đồng sự hoặc người nhà thì chậm lại một nhịp rồi mới phản hồi.`
      ];

      // Xây dựng 12 MẢNG ĐỜI TRONG NĂM cho GÓI 2 (Zoom 3x · Vận hạn 1 năm)
      const domain12Order = [
        { key: 'MỆNH CUNG', title: '1. Con người & Tâm thế trong năm' },
        { key: 'QUAN LỘC', title: '2. Công việc & Sự nghiệp' },
        { key: 'TÀI BẠCH', title: '3. Tiền bạc & Dòng tiền' },
        { key: 'PHU THÊ', title: '4. Vợ chồng & Chuyện tình cảm' },
        { key: 'TỬ TỨC', title: '5. Con cái & Dự định kế thừa' },
        { key: 'ĐIỀN TRẠCH', title: '6. Nhà cửa, Đất đai & Chỗ ở' },
        { key: 'TẬT ÁCH', title: '7. Sức khỏe & Nhịp sinh hoạt' },
        { key: 'PHỤ MẪU', title: '8. Cha mẹ & Bậc bề trên' },
        { key: 'HUYNH ĐỆ', title: '9. Anh chị em & Người làm chung sát sườn' },
        { key: 'NÔ BỘC', title: '10. Bạn bè, Khách hàng & Cấp dưới' },
        { key: 'THIÊN DI', title: '11. Ra ngoài, Đi xa & Mở mối mới' },
        { key: 'PHÚC ĐỨC', title: '12. Phúc phần & Đời sống tinh thần' }
      ];

      const yearlyDomains = domain12Order.map(item => {
        const p = getPal(item.key);
        const r = generatePalaceReading(p, horoscope.palaces);
        const luuHere = (f4.luuTinh.fullByBranch[p.branchName] || []).map(x => x.name);
        const hitSihua = f4.luuSihuaHits.filter(h => h.pal.branchName === p.branchName);
        const isHotSpot = [f4.luuNienBranch, f4.tieuHanBranch, f4.tieuVanBranch].includes(p.branchName);

        let highlightNote = isHotSpot
          ? `Trọng điểm kích hoạt mạnh của năm ${targetYear} (trùng cung vận hạn tại ${p.branchName}). `
          : '';
        if (hitSihua.length > 0) {
          highlightNote += `Năm nay đón ${hitSihua.map(h => `${h.star} [${h.type}] — ${h.meaning}`).join('; ')}. `;
        }

        return {
          ...item,
          branch: p.branchName,
          starsText: fmtMajors(p),
          luuStarsText: luuHere.slice(0, 5).join(' · ') || 'Bình hòa',
          score: r.score,
          isHotSpot,
          body: `${highlightNote}Mảng ${r.plainGuide.plainTitle.toLowerCase()} có nền sao [${fmtMajors(p)}]${luuHere.length ? ` hội sao lưu (${luuHere.slice(0, 4).join(', ')})` : ''}. ${stripAdviceLabel(r.contextAdvice[0])} ${stripAdviceLabel(r.contextAdvice[2] || '')}`
        };
      });

      // Xây dựng GÓI 3: TOÀN BỘ LÁ SỐ & 10 NĂM ĐANG ĐI
      const dv10Info = buildDaiVan10YearReading(f4.activeDaiVan, f4.daiVanPalace, dvReading);
      const lifePortrait = {
        opening: `Bạn là mẫu người như ${metaphor}. Chủ đề xuyên suốt lá số của bạn nằm ở sự phối hợp giữa Mệnh (${menhP.branchName}: ${fmtMajors(menhP)}), Quan Lộc (${quanP.branchName}: ${fmtMajors(quanP)}) và Tài Bạch (${taiP.branchName}: ${fmtMajors(taiP)}), kết hợp ${horoscope.info.thanCu} — càng về sau tuổi 30, trọng tâm cuộc đời càng nghiêng mạnh về cung Thân này.`,
        decadeNarrative: `Chặng 10 năm hiện tại (${f4.activeDaiVan.startAge}–${f4.activeDaiVan.endAge} tuổi) đi qua cung ${f4.daiVanPalace.palaceName} (${f4.activeDaiVan.branch}: ${fmtMajors(f4.daiVanPalace)}). Bối cảnh chính của 10 năm này: ${dv10Info.focusTheme.toLowerCase()}. ${dv10Info.starFlow}`,
        healthNote: `Theo Đông Y 《Thiên Kỷ》, cung tập trung nhiều sát khí nhất nằm tại ${horoscope.info.worstSatBranch} (${horoscope.info.worstSatPalace}), ứng với hệ tạng phủ: ${horoscope.info.healthOrgan.organ}. ${horoscope.info.healthOrgan.advice}`
      };

      return {
        topic,
        targetYear,
        compositeScore,
        confidence,
        focusPal,
        f4,
        meiHua,
        directAnswer,
        whyMechanism,
        howItUnfolds,
        actionChecklist,
        yearlyDomains,
        lifePortrait,
        evidenceLine: `Mệnh ${menhP.stemName} ${menhP.branchName} (${fmtMajors(menhP)}) · Đại vận ${f4.activeDaiVan.startAge}–${f4.activeDaiVan.endAge}t tại ${f4.daiVanPalace.palaceName} (${f4.activeDaiVan.branch}) · Lưu Thái Tuế ${targetYear} tại ${f4.luuNienBranch} · Tiểu hạn tại ${f4.tieuHanPalace.palaceName} (${f4.tieuHanBranch}) · Tiểu vận tại ${f4.tieuVanPalace.palaceName} (${f4.tieuVanBranch}) · Phi Hóa cung ${focusPal.palaceName}: ${phiLoc.starName} Lộc → ${phiLoc.targetPalaceName}, ${phiKy.starName} Kỵ → ${phiKy.targetPalaceName}${meiHua ? ` · Quẻ Dịch: ${meiHua.mainHex.name} → ${meiHua.bianHex.name}` : ''}.`
      };
    }

      const map = {

        ],
        career: [
          `Trong năm ${targetYear}, tháng mấy âm lịch mở việc mới hoặc chuyển chỗ làm thuận lợi nhất?`,

        ],
        wealth: [
          `Tháng mấy âm lịch năm ${targetYear} tiền về khá nhất, và tháng nào dễ hao hụt cần khóa ví?`,
          `Tiền tích lũy giai đoạn này nên giữ ở dạng nhà đất, vàng hay gửi tiết kiệm an toàn hơn?`,
          `Năm ${targetYear} cho người quen vay mượn hoặc đứng ra bảo lãnh tiền bạc có dễ đòi lại không?`
        ],
        partnership: [
          `Nếu vẫn làm chung thì nên phân chia việc và giữ tay hòm chìa khóa thế nào để không mất lòng?`,
          `Người đồng hành có tính cách thế nào thì bù đắp tốt nhất cho điểm khuyết của lá số này?`,
          `Tháng mấy âm lịch năm ${targetYear} dễ nảy sinh hiểu lầm tiền nong với đối tác nhất?`
        ],
        love: [
          `Trong năm ${targetYear}, tháng mấy âm lịch chuyện tình cảm dễ gắn kết hoặc hóa giải khúc mắc nhất?`,
          `Người bạn đời hợp mệnh và đi đường dài bền vững với lá số này có nét tính cách gì?`,
          `Năm ${targetYear} chuyện tiền nong hay công việc bận rộn có dễ làm ảnh hưởng không khí gia đình không?`
        ],
        health: [
          `Trong năm ${targetYear}, tháng mấy âm lịch sức khỏe dễ xuống sức cần nghỉ ngơi và khám kỹ hơn?`,
          `Cơ địa lá số này cần lưu ý giấc ngủ và ăn uống hàng ngày thế nào để đỡ hao sức?`,
          `Sức khỏe của cha mẹ và con cái trong nhà năm ${targetYear} có điểm gì cần quan tâm thêm?`

      return map[topic] || map.career;
    }

    function computeFollowUpAnswer({
      followUpText = '',
      baseReport,
      horoscope,
      targetYear = DEFAULT_ADVISOR_YEAR,
      workStatus = 'company',
      maritalStatus = 'single',
      useIChing = true
    }) {
      const q = (followUpText || '').trim();
      const s = q.toLowerCase();
      const f4 = baseReport.f4;
      const getPal = (pName) => Object.values(horoscope.palaces).find(p => p.palaceName === pName) || baseReport.focusPal;
      const fmtMajors = (p) => p.majorStars.map(st => `${st.name} (${st.brightShort}${st.mutagen ? `·${st.mutagen}` : ''})`).join(', ') || 'Vô Chính Diệu';

      const menhP = getPal('MỆNH CUNG');
      const taiP = getPal('TÀI BẠCH');
      const quanP = getPal('QUAN LỘC');
      const dienP = getPal('ĐIỀN TRẠCH');
      const phuP = getPal('PHU THÊ');
      const noP = getPal('NÔ BỘC');
      const phuMauP = getPal('PHỤ MẪU');
      const tuTucP = getPal('TỬ TỨC');
      const tatP = getPal('TẬT ÁCH');

      // Kiểm tra xem câu hỏi tiếp có chuyển sang cung cụ thể khác không (cha mẹ, con cái, sức khỏe...)
      let subPal = baseReport.focusPal;
      if (/cha mẹ|bố mẹ|ông bà|bề trên/.test(s)) subPal = phuMauP;
      else if (/con cái|sinh con|đường con|nuôi con/.test(s)) subPal = tuTucP;
      else if (/sức khỏe|sức khoẻ|bệnh|ngủ|ăn uống|khám/.test(s)) subPal = tatP;
      else if (/vợ chồng|người yêu|bạn đời|lập gia đình|tình cảm/.test(s)) subPal = phuP;
      else if (/nhà|đất|sổ đỏ|đặt cọc|xây|sửa/.test(s)) subPal = dienP;
      else if (/hùn|làm chung|đối tác|bạn bè|vay mượn|cho vay/.test(s)) subPal = noP;
      else if (/tiền|vàng|tiết kiệm|ngân hàng|trả góp|nợ/.test(s)) subPal = taiP;
      else if (/việc|nghỉ|chuyển|làm thêm|cấp trên|sếp|đồng sự/.test(s)) subPal = quanP;

      const luuLocHit = f4.luuSihuaHits[0];
      const luuKhoaHit = f4.luuSihuaHits[2];
      const luuKyHit = f4.luuSihuaHits[3];

      const goodMonths = Array.from(new Set([
        subPal.lunarMonthNum,
        luuLocHit.pal.lunarMonthNum,
        luuKhoaHit.pal.lunarMonthNum
      ])).filter(Boolean).sort((a, b) => a - b);

      const oppBranch = CHI[(CHI.indexOf(subPal.branchName) + 6) % 12];
      const oppPal = horoscope.palaces[oppBranch];
      const cautionMonths = Array.from(new Set([
        luuKyHit.pal.lunarMonthNum,
        oppPal?.lunarMonthNum
      ])).filter(m => m && !goodMonths.includes(m)).sort((a, b) => a - b);
      if (cautionMonths.length === 0 && luuKyHit.pal.lunarMonthNum) {
        cautionMonths.push(luuKyHit.pal.lunarMonthNum);
      }

      const now = new Date();
      const subMeiHua = useIChing
        ? computeMeiHua({
            mode: 'thought',
            year: now.getFullYear(),
            month: now.getMonth() + 1,
            day: now.getDate(),
            hour: now.getHours(),
            minute: now.getMinutes(),
            questionText: q,
            horoscope
          })
        : null;

      let headline = '';
      let detail = '';

      if (/tháng mấy|tháng nào|khi nào|bao giờ|thời điểm|đầu năm|cuối năm/.test(s)) {
        headline = `Về thời điểm trong năm ${targetYear}: Nên nhằm vào các tháng ${goodMonths.map(m => `Tháng ${m}`).join(', ')} Âm lịch; tránh vội vàng chốt gắt vào ${cautionMonths.map(m => `Tháng ${m}`).join(', ')} Âm lịch.`;
        detail = `Trên lá số của bạn, cung ${subPal.palaceName} (${subPal.branchName} · ứng Tháng ${subPal.lunarMonthNum} ÂL) kết hợp mạch Lưu Hóa Lộc tại ${luuLocHit.pal.palaceName} (Tháng ${luuLocHit.pal.lunarMonthNum} ÂL) và Lưu Hóa Khoa tại ${luuKhoaHit.pal.palaceName} (Tháng ${luuKhoaHit.pal.lunarMonthNum} ÂL) tạo thành nhịp hanh thông nhất về cả tiền lẫn người hỗ trợ giấy tờ. Ngược lại, vào ${cautionMonths.map(m => `Tháng ${m} ÂL`).join(', ')} (khi Lưu Hóa Kỵ tại ${luuKyHit.pal.palaceName} hoặc xung cung phát động), bạn chỉ nên khảo sát, trả giá và rà kỹ điều khoản chứ đừng ép tiến độ trong tâm trạng sốt ruột.`;
      } else if (/vay|ngân hàng|trả góp|đòn bẩy|nợ|bảo lãnh|cho vay/.test(s)) {
        const hasWealthPressure = taiP.hasTuan || taiP.hasTriet || taiP.minorSats.length >= 2 || luuKyHit.pal.palaceName === 'TÀI BẠCH';
        if (/cho vay|bảo lãnh|mượn tiền/.test(s)) {
          headline = `Về chuyện cho vay hoặc đứng ra bảo lãnh năm ${targetYear}: Dứt khoát KHÔNG nên đứng tên vay hộ hay cho mượn khoản tiền lớn chỉ vì nể tình.`;
          detail = `Cung Nô Bộc (${noP.branchName}: ${fmtMajors(noP)}) và Lưu Hóa Kỵ năm ${targetYear} tại ${luuKyHit.pal.palaceName} cho thấy tiền rời khỏi tay qua lời hứa miệng rất khó thu về đúng hẹn, dễ vừa thiệt của vừa mất tình anh em bạn bè. Nếu thực tâm muốn giúp, chỉ hỗ trợ một khoản nhỏ trong tầm cho đi được mà không ảnh hưởng sinh hoạt gia đình.`;
        } else {
          headline = hasWealthPressure
            ? `Về mức vay vốn năm ${targetYear}: Vay ĐƯỢC nhưng phải giữ mức trả gốc + lãi hàng tháng dưới 30% thu nhập chắc chắn trong tay, và giữ sẵn quỹ dự phòng 6 tháng.`
            : `Về mức vay vốn năm ${targetYear}: Nền cung Tài Bạch (${fmtMajors(taiP)}) và Điền Trạch (${fmtMajors(dienP)}) đủ sức gánh khoản vay vừa tầm (tổng trả hàng tháng tối đa 35–40% thu nhập).`;
          detail = `Khoản vay gắn với tài sản thật (nhà cửa, công cụ làm nghề) trên lá số của bạn đóng vai trò như "két giữ tiền bắt buộc", giúp tiền không bị tiêu tán lặt vặt. Chỉ lưu ý chọn gói lãi suất biên độ rõ ràng, tuyệt đối không vay ngắn hạn lãi cao để đắp vào tài sản dài hạn.`;
        }
      } else if (/giấy tờ|sổ đỏ|đặt cọc|hợp đồng|pháp lý|quy hoạch|rủi ro/.test(s)) {
        const subPhi = computePalacePhiTinh(subPal, horoscope.palaces, horoscope.info.sihuaSchool || 'namphai');
        const subKy = subPhi.find(x => x.key === 'Kỵ');
        headline = `Về giấy tờ & thủ tục năm ${targetYear}: Cần rà kỹ nhất tính pháp lý gốc và ghi rõ điều khoản phạt/hoàn cọc trước khi chuyển tiền.`;
        detail = `Cung ${subPal.palaceName} (${subPal.branchName}) có sao ${fmtMajors(subPal)}, Can ${subPal.stemName} phi Hóa Kỵ sang ${subKy.targetPalaceName} (${subKy.starName}) kết hợp Lưu Hóa Kỵ năm ${targetYear} tại ${luuKyHit.pal.palaceName}. Điều này báo hiệu dễ có chi tiết nói miệng một đằng nhưng lúc làm thủ tục lại phát sinh giấy tờ bổ sung hoặc chậm hẹn 1–2 nhịp. Bạn cứ kiểm tra tận mắt bản gốc (quy hoạch, công chứng, biên nhận) rồi mới xuống cọc là yên tâm trọn vẹn.`;
      } else if (/làm thêm|chân trong chân ngoài|song song|nghỉ hẳn/.test(s)) {
        headline = `Về cách chuyển bước công việc: Đi theo lối "chân trong giữ lương cứng, chân ngoài thử thị trường" 3–6 tháng hợp với lá số của bạn hơn là nghỉ ngang đột ngột.`;
        detail = `Cung Quan Lộc (${quanP.branchName}: ${fmtMajors(quanP)}) đi cùng cung Tài Bạch (${taiP.branchName}: ${fmtMajors(taiP)}) cho thấy khi đầu óc không bị áp lực tiền nhà tiền chợ mỗi tháng, bạn ra quyết định sáng suốt và đàm phán giá trị công sức cao hơn hẳn. Khi nguồn thu bên ngoài đạt tối thiểu 70% thu nhập cũ đều đặn 3 tháng liền thì mới là lúc dứt bước nhẹ nhàng.`;
      } else if (/cha mẹ|bố mẹ|con cái|vợ chồng|người nhà|bạn đời|đồng sự|cấp trên|sếp|chia việc|tính cách/.test(s)) {
        const subR = generatePalaceReading(subPal, horoscope.palaces);
        headline = `Xét riêng trên cung ${subPal.palaceName} (${subPal.branchName} · ${fmtMajors(subPal)}) trong năm ${targetYear}: Mức hòa hợp đạt ${subR.score}/10.`;
        detail = `${stripAdviceLabel(subR.contextAdvice[0])} ${stripAdviceLabel(subR.contextAdvice[1] || subR.contextAdvice[2] || '')} Trong năm ${targetYear}, nguyên tắc giữ êm ấm nhất ở mảng này là phân định rõ việc ai người nấy quyết, minh bạch chuyện tiền nong và bớt tranh đúng sai lúc đôi bên đang mệt.`;
      } else {
        const subR = generatePalaceReading(subPal, horoscope.palaces);
        headline = `Luận trực tiếp vào ý bạn vừa hỏi thêm (chiếu trên cung ${subPal.palaceName} · ${subPal.branchName}, mức thuận lợi ${subR.score}/10):`;
        detail = `Nền sao tại ${subPal.palaceName} có ${fmtMajors(subPal)}${subPal.minorSats.length ? ` đi cùng sát tinh (${subPal.minorSats.slice(0, 3).join(', ')})` : ''}. ${stripAdviceLabel(subR.contextAdvice[0])} Trong năm ${targetYear}, mạch thuận nằm ở ${luuLocHit.pal.palaceName} (${luuLocHit.star} Hóa Lộc — ứng Tháng ${luuLocHit.pal.lunarMonthNum} ÂL), còn điểm cần chậm lại kiểm chứng kỹ nằm ở ${luuKyHit.pal.palaceName} (${luuKyHit.star} Hóa Kỵ).`;
      }

      if (subMeiHua) {
        detail += ` Gieo thêm Quẻ Dịch ngay lúc bạn hỏi tiếp được quẻ 【${subMeiHua.mainHex.name}】 biến 【${subMeiHua.bianHex.name}】 (${subMeiHua.finalRelation.label}): ${subMeiHua.bianHex.brief}`;
      }

      return {
        question: q,
        palaceName: subPal.palaceName,
        branch: subPal.branchName,
        headline,
        detail,
        evidence: `Chiếu cung ${subPal.palaceName} (${subPal.branchName}: ${fmtMajors(subPal)}) · Tháng thuận: T.${goodMonths.join(', T.')} ÂL · Tháng cần kỹ: T.${cautionMonths.join(', T.')} ÂL${subMeiHua ? ` · Quẻ hỏi tiếp: ${subMeiHua.mainHex.name} → ${subMeiHua.bianHex.name}` : ''}.`
      };
    }

    function HomeLandingSubsystem({
      horoscope,
      appliedData,

      onJumpToStarEncyclopedia,
      onJumpToPalace
    }) {
      const [quickForm, setQuickForm] = useState(() => ({
        // Nếu đang ở hồ sơ mẫu, để trống ô Họ tên để người mới không lầm tưởng là dữ liệu của mình

        province: appliedData.isSample ? 'Hà Nội' : (appliedData.province || 'Hà Nội'),
        calType: appliedData.isSample ? 'solar' : (appliedData.calType || 'solar'),

        vanTyNextDay: appliedData.vanTyNextDay !== false,
        unknownHour: appliedData.isSample ? false : !!appliedData.unknownHour,
        workStatus: appliedData.workStatus || 'company',
        maritalStatus: appliedData.maritalStatus || 'single'
      }));

      useEffect(() => {
        if (!appliedData.isSample) {
          setQuickForm(prev => ({
            ...prev,
            name: appliedData.name || '',
            year: appliedData.year || 1994,
            month: appliedData.month || 6,
            day: appliedData.day || 15,
            hour: appliedData.hour ?? 8,
            minute: appliedData.minute ?? 30,
            gender: appliedData.gender || 'male',
            province: appliedData.province || 'Hà Nội',
            calType: appliedData.calType || 'solar',
            isLeapMonth: !!appliedData.isLeapMonth,
            leapMonthRule: appliedData.leapMonthRule || 'split15',
            historicalMode: appliedData.historicalMode || 'auto',
            intlDst: !!appliedData.intlDst,
            intlOffsetMin: Number(appliedData.intlOffsetMin) || 0,
            unknownHour: !!appliedData.unknownHour
          }));
        }
      }, [appliedData]);

      const [wheelPalaceName, setWheelPalaceName] = useState('MỆNH CUNG');

      const now = new Date();
      const curChiIdx = Math.floor(((now.getHours() + 1) % 24) / 2);
      const curChiName = CHI[curChiIdx];
      const selProv = PROVINCES.find(p => p.name === quickForm.province) || PROVINCES[0];
      const quickYearLeapMonth = useMemo(() => getYearLeapMonthVN(quickForm.year, 7), [quickForm.year]);

      // Tính nhanh Ngũ hành Dụng thần + Trạch nhật hôm nay + Cung đang chọn trên Vòng Hỗn Thiên Nghi
      const baziQuick = useMemo(() => computeBaziYongShen(horoscope), [horoscope]);
      const todayQuick = useMemo(
        () => evaluateSingleAlmanacDay(now.getDate(), now.getMonth() + 1, now.getFullYear(), 'contract', horoscope, baziQuick),
        [horoscope, baziQuick]
      );

      const menhPal = horoscope.palaces[horoscope.info.menhBranch];
      const menhMainStar = menhPal?.majorStars?.[0]?.name || '';
      const menhMetaphor = menhMainStar
        ? (STAR_EVERYDAY_METAPHOR[menhMainStar] || 'biết nhìn thời thế, giữ chữ tín và đi đường dài bền bỉ')
        : 'mềm dẻo, nhạy bén thích nghi với hoàn cảnh và biết mượn sức tập thể để tiến xa';

      const activeWheelPal = useMemo(() => {
        return Object.values(horoscope.palaces).find(p => p.palaceName === wheelPalaceName) || menhPal;
      }, [horoscope, wheelPalaceName, menhPal]);

      const wheelReading = useMemo(
        () => generatePalaceReading(activeWheelPal, horoscope.palaces),
        [activeWheelPal, horoscope]
      );

      // Tọa độ 12 cung chuẩn La Kinh Hỗn Thiên Nghi (viewBox 500x500 · Tý Bắc Hạ 90° · Ngọ Nam Thượng 270°)
      const wheelGeometry = useMemo(() => {
        const cx = 250;
        const cy = 250;
        const rInnerPin = 98;
        const rWedgeIn = 134;
        const rWedgeOut = 212;
        const rCollarOut = 236;
        const CHI_HAN = ['子', '丑', '寅', '卯', '辰', '巳', '午', '未', '申', '酉', '戌', '亥'];

        const arcSector = (rIn, rOut, startDeg, endDeg) => {
          const a0 = (startDeg * Math.PI) / 180;
          const a1 = (endDeg * Math.PI) / 180;
          const x1 = (cx + rOut * Math.cos(a0)).toFixed(2);
          const y1 = (cy + rOut * Math.sin(a0)).toFixed(2);
          const x2 = (cx + rOut * Math.cos(a1)).toFixed(2);
          const y2 = (cy + rOut * Math.sin(a1)).toFixed(2);
          const x3 = (cx + rIn * Math.cos(a1)).toFixed(2);
          const y3 = (cy + rIn * Math.sin(a1)).toFixed(2);
          const x4 = (cx + rIn * Math.cos(a0)).toFixed(2);
          const y4 = (cy + rIn * Math.sin(a0)).toFixed(2);
          return `M ${x1} ${y1} A ${rOut} ${rOut} 0 0 1 ${x2} ${y2} L ${x3} ${y3} A ${rIn} ${rIn} 0 0 0 ${x4} ${y4} Z`;
        };

        const nodes = CHI.map((br, idx) => {
          const centerDeg = 90 + idx * 30;
          const rad = (centerDeg * Math.PI) / 180;
          const rMidWedge = (rWedgeIn + rWedgeOut) / 2;
          const rMidCollar = (rWedgeOut + rCollarOut) / 2;
          return {
            idx,
            branch: br,
            han: CHI_HAN[idx],
            centerDeg,
            pinX: Number((cx + rInnerPin * Math.cos(rad)).toFixed(1)),
            pinY: Number((cy + rInnerPin * Math.sin(rad)).toFixed(1)),
            midX: Number((cx + rMidWedge * Math.cos(rad)).toFixed(1)),
            midY: Number((cy + rMidWedge * Math.sin(rad)).toFixed(1)),
            collarX: Number((cx + rMidCollar * Math.cos(rad)).toFixed(1)),
            collarY: Number((cy + rMidCollar * Math.sin(rad)).toFixed(1)),
            wedgePath: arcSector(rWedgeIn, rWedgeOut, centerDeg - 15, centerDeg + 15),
            collarPath: arcSector(rWedgeOut, rCollarOut, centerDeg - 15, centerDeg + 15),
            pal: horoscope.palaces[br]
          };
        });
        const actIdx = activeWheelPal.branchIndex;
        const tri1Idx = (actIdx + 4) % 12;
        const tri2Idx = (actIdx + 8) % 12;
        const oppIdx = (actIdx + 6) % 12;
        return { cx, cy, rInnerPin, nodes, actIdx, tri1Idx, tri2Idx, oppIdx };
      }, [horoscope, activeWheelPal]);

      const handleQuickSubmit = (e) => {

          isLeapMonth: quickForm.calType === 'lunar' ? !!quickForm.isLeapMonth : false,
          historicalUtc8: quickForm.historicalMode === 'utc8',
          name: (quickForm.name || '').trim() || 'Lá Số Của Tôi'
        }, 'tuvi');
      };

      const handleResetBlankForm = () => {
        setQuickForm({
          name: '',
          year: 1995,
          month: 6,
          day: 15,
          hour: 8,
          minute: 30,
          gender: 'male',
          province: 'Hà Nội',
          calType: 'solar',
          isLeapMonth: false,
          leapMonthRule: 'split15',
          historicalMode: 'auto',
          intlDst: false,
          intlOffsetMin: 0,
          vanTyNextDay: true,
          unknownHour: false,
          workStatus: 'company',
          maritalStatus: 'single'
        });

      const activeLifeMeta = HOME_PALACE_LIFE_MAP[activeWheelPal.palaceName] || HOME_PALACE_LIFE_MAP['MỆNH CUNG'];

    function DecisionAdvisorSubsystem({
      horoscope,
      appliedData,
      presetConfig,
      onUpdateContext,
      onCreateNewProfile,
      onJumpToPalace,
      onJumpToAlmanac,
      onOpenFormModal
    }) {
      const initialQ = presetConfig?.question || 'Đang phân vân hướng công việc và giữ tiền sắp tới: nên giữ nhịp ổn định hay mở hướng mới?';

      const [targetYear, setTargetYear] = useState(presetConfig?.year || DEFAULT_ADVISOR_YEAR);
      const [category, setCategory] = useState(presetConfig?.category || 'career');
      const [draftQuestion, setDraftQuestion] = useState(initialQ);
      const [questionText, setQuestionText] = useState(initialQ);
      const [useIChing, setUseIChing] = useState(true);
      const [copied, setCopied] = useState(false);
      const [justUpdated, setJustUpdated] = useState(false);
      const [askNonce, setAskNonce] = useState(0);
      const [followUps, setFollowUps] = useState([]);
      const [followUpDraft, setFollowUpDraft] = useState('');
      const followUpEndRef = useRef(null);
      const articleTopRef = useRef(null);
      const leftInputRef = useRef(null);

      useEffect(() => {
        if (presetConfig) {
          if (presetConfig.mode) setMode(presetConfig.mode);
          if (presetConfig.year) setTargetYear(presetConfig.year);
          if (presetConfig.category) setCategory(presetConfig.category);
          if (presetConfig.question) {
            setDraftQuestion(presetConfig.question);
            setQuestionText(presetConfig.question);
            setFollowUps([]);
          }
        }
      }, [presetConfig]);

      // Khi đổi lá số, xóa mạch hỏi tiếp cũ để tránh nhầm người
      useEffect(() => {
        setFollowUps([]);
      }, [horoscope.info.name, horoscope.info.lunarText]);

        horoscope,
        targetYear,
        mode,
        questionText,
        category,
        workStatus,
        maritalStatus,
        useIChing

      const triggerUpdatedFeedbackAndScroll = () => {
        setJustUpdated(true);

        setTimeout(() => {

            articleTopRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' });

        if (e) e.preventDefault();

        setAskNonce(n => n + 1);
        setFollowUps([]);
        triggerUpdatedFeedbackAndScroll();
      };

      const handleAskFollowUp = (textToAsk) => {
        const q = (textToAsk ?? followUpDraft).trim();

          followUpText: q,
          baseReport: report,
          horoscope,
          targetYear,
          workStatus,
          maritalStatus,
          useIChing
        });
        setFollowUps(prev => [...prev, { id: Date.now() + Math.random(), ...ans }]);
        if (textToAsk === undefined) {
          setFollowUpDraft('');
        }
        setTimeout(() => {
          if (followUpEndRef.current) {
            followUpEndRef.current.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          }
        }, 60);

          : '';
        const text = mode === 'one'

                    { id: 'one', label: '① Hỏi Một Chuyện Đang Phân Vân', sub: 'Trả lời thẳng · 4 việc nên làm + Hỏi tiếp' },
                    { id: 'year', label: `② Xem Vận Hạn Cả Năm ${targetYear}`, sub: 'Đủ 4 tầng hạn · Luận rõ 12 mặt đời sống trong năm' },

                      onClick={() => setMode(m.id)}
                      className={`p-2.5 rounded-sm border text-left transition cursor-pointer ${

                    >
                      <div className="font-bold text-xs">{m.label}</div>
                      <div className={`text-[10.5px] mt-0.5 ${mode === m.id ? 'text-[#FFF4DC]' : 'text-[#6E5638]'}`}>{m.sub}</div>

                            if (d.workStatus) onUpdateContext({ workStatus: d.workStatus });
                            triggerUpdatedFeedbackAndScroll();

                          {d.tag}
                        </button>
                      ))}
                    </div>
                  </div>
                </form>

                      <span className={`px-2 py-0.5 rounded-sm font-bold text-[11px] ${report.confidence.badge}`}>
                        Độ rõ lá số: {report.confidence.label}
                      </span>
                      <span className="text-[#6E5638] font-mono font-semibold">
                        Mức thuận lợi: {report.compositeScore}/10
                      </span>
                      {justUpdated && (
                        <span className="px-2 py-0.5 rounded-sm seal-jade font-bold text-[10.5px]">
                          ✓ Vừa cập nhật theo câu hỏi mới
                        </span>
                      )}
                    </div>
                    <button
                      type="button"
                      onClick={handleCopySummary}
                      className="px-2.5 py-1 rounded-sm bg-[#EFE6D4] hover:border-[#9E241E] border border-[#C7B28E] font-bold text-[11px] text-[#57452F] cursor-pointer"
                    >
                      {copied ? '✓ Đã chép bài luận' : '📋 Chép bài luận'}
                    </button>
                  </div>

                  <h2 className="text-xl sm:text-2xl font-bold text-[#9E241E] leading-snug">
                    {mode === 'one'
                      ? `Luận Giải Chuyện Đang Hỏi Năm ${targetYear} · ${horoscope.info.name}`
                      : mode === 'year'
                      ? `Vận Hạn Trọn Năm ${targetYear} — 12 Mặt Đời Sống (${report.f4.luuTinh.stem} ${report.f4.luuTinh.branch} · ${report.f4.lunarAge} tuổi ÂL)`
                      : `Tổng Luận Cốt Cách & Đại Vận 10 Năm Đang Đi · ${horoscope.info.name}`}
                  </h2>
                  <p className="text-xs font-ui text-[#6E5638]">
                    Hoàn cảnh hiện tại: <strong>{WORK_STATUS_LABELS[workStatus]}</strong> · <strong>{MARITAL_STATUS_LABELS[maritalStatus]}</strong> · Nơi sinh: <strong>{horoscope.info.city}</strong>
                  </p>
                </header>

                <ResultAssumptionsBanner
                  horoscope={horoscope}
                  appliedData={appliedData}
                  onUpdateApplied={onUpdateContext}
                  onCreateNewProfile={onCreateNewProfile}
                  onOpenFormModal={onOpenFormModal}
                />

                {mode === 'one' && (
                  <article className="space-y-5 text-[14.5px] text-[#1C1610]">
                    <blockquote className="pl-3.5 border-l-4 border-[#8C6226] italic text-[#57452F] text-sm">

                    <section className="space-y-1.5">
                      <h3 className="text-base font-bold text-[#9E241E]">1. Trả lời thẳng trọng tâm</h3>
                      <p>{report.directAnswer}</p>
                    </section>

                    <hr className="editorial-divider" />

                    <section className="space-y-1.5">
                      <h3 className="text-base font-bold text-[#8C6226]">2. Vì sao lá số của bạn vận hành như vậy</h3>
                      <p>{report.whyMechanism}</p>
                    </section>

                    <hr className="editorial-divider" />

                    <section className="space-y-1.5">
                      <h3 className="text-base font-bold text-[#156839]">3. Chuyện sẽ đi thế nào & chỗ dễ vướng</h3>

                    <hr className="editorial-divider" />

                      <h3 className="text-base font-bold text-[#9E241E]">4. Bốn việc bạn nên làm ngay</h3>

                    <section className="p-3.5 bg-[#FAF6ED] border border-[#D4C4A8] rounded-sm text-xs space-y-2 font-ui">
                      <div className="flex items-center justify-between flex-wrap gap-2">

                          <button

    function sanitizeProfile(raw) {
      const base = DEFAULT_SAVED_PROFILES[0];
      if (!raw || typeof raw !== 'object') return { ...base };
      const builtinSampleIds = new Set(DEFAULT_SAVED_PROFILES.map(p => p.id));
      const inferredSample = typeof raw.isSample === 'boolean'
        ? raw.isSample
        : builtinSampleIds.has(raw.id);
      return {
        ...base,
        ...raw,
        name: String(raw.name || base.name),
        isSample: inferredSample,
        year: Math.max(1900, Math.min(2100, Number(raw.year) || base.year)),
        month: Math.max(1, Math.min(12, Number(raw.month) || base.month)),
        day: Math.max(1, Math.min(31, Number(raw.day) || base.day)),
        hour: Math.max(0, Math.min(23, Number(raw.hour ?? base.hour) || 0)),
        minute: Math.max(0, Math.min(59, Number(raw.minute ?? base.minute) || 0)),
        gender: raw.gender === 'female' ? 'female' : 'male',
        calType: raw.calType === 'lunar' ? 'lunar' : 'solar',
        isLeapMonth: !!raw.isLeapMonth,
        leapMonthRule: ['split15', 'keep', 'next'].includes(raw.leapMonthRule) ? raw.leapMonthRule : 'split15',
        historicalMode: ['auto', 'utc7', 'utc8'].includes(raw.historicalMode)
          ? raw.historicalMode
          : (raw.historicalUtc8 ? 'utc8' : 'auto'),
        intlDst: !!raw.intlDst,
        intlOffsetMin: Math.max(-90, Math.min(90, Number(raw.intlOffsetMin) || 0)),
        province: raw.province || base.province,
        sihuaSchool: raw.sihuaSchool === 'trungchau' ? 'trungchau' : 'namphai',
        thienMaBy: raw.thienMaBy === 'month' ? 'month' : 'year',
        workStatus: WORK_STATUS_LABELS[raw.workStatus] ? raw.workStatus : 'company',
        maritalStatus: MARITAL_STATUS_LABELS[raw.maritalStatus] ? raw.maritalStatus : 'single'
      };
    }

    // =========================================================================
    // 3K. BỘ PHÁT ÂM NỀN CỔ PHONG (NGŨ CUNG CỔ CẦM WEB AUDIO - KHÔNG CẦN FILE MP3)
    //     + THANH NGHE ĐỌC MỆNH THƯ TỪNG CÂU & HỎI TRỰC TIẾP TRONG LÁ SỐ
    // =========================================================================
    const AncientZitherAudio = (() => {
      let ctx = null;
      let timerId = null;
      let droneOsc = null;
      let droneGain = null;
      let playing = false;

      // Thang âm Ngũ Cung Cung – Thương – Giốc – Chủy – Vũ (D - E - F# - A - B / C - D - E - G - A êm dịu)
      const PENTATONIC_NOTES = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25];
      const MELODY_PATTERN = [0, 2, 3, 4, 3, 2, 1, 0, 3, 5, 4, 3, 2, 4, 1, 0];
      let stepIdx = 0;

      function ensureCtx() {
        if (!ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) ctx = new AudioCtx();
        }
        if (ctx && ctx.state === 'suspended') {
          ctx.resume();
        }
        return ctx;
      }

      function pluckNote(freq, delaySec = 0, volume = 0.045) {
        const audio = ensureCtx();
        if (!audio) return;
        const now = audio.currentTime + delaySec;

        const osc = audio.createOscillator();
        const sub = audio.createOscillator();
        const filter = audio.createBiquadFilter();
        const gain = audio.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now);

        sub.type = 'sine';
        sub.frequency.setValueAtTime(freq * 0.5, now);

        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(1150, now);
        filter.frequency.exponentialRampToValueAtTime(360, now + 2.6);

        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.linearRampToValueAtTime(volume, now + 0.035);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 2.9);

        osc.connect(filter);
        sub.connect(filter);
        filter.connect(gain);
        gain.connect(audio.destination);

        osc.start(now);
        sub.start(now);
        osc.stop(now + 3.0);
        sub.stop(now + 3.0);
      }

      function start() {
        const audio = ensureCtx();
        if (!audio || playing) return;
        playing = true;

        // Lớp âm trầm ngân nhẹ như tiếng tiêu / khánh xa
        droneOsc = audio.createOscillator();
        droneGain = audio.createGain();
        droneOsc.type = 'sine';
        droneOsc.frequency.setValueAtTime(130.81, audio.currentTime); // C3 trầm ấm
        droneGain.gain.setValueAtTime(0.0001, audio.currentTime);
        droneGain.gain.linearRampToValueAtTime(0.014, audio.currentTime + 1.5);
        droneOsc.connect(droneGain);
        droneGain.connect(audio.destination);
        droneOsc.start();

        const playPhrase = () => {
          if (!playing) return;
          const noteIdx = MELODY_PATTERN[stepIdx % MELODY_PATTERN.length];
          stepIdx++;
          const mainFreq = PENTATONIC_NOTES[noteIdx];
          pluckNote(mainFreq, 0, 0.042);
          if (stepIdx % 3 === 0) {
            const harmFreq = PENTATONIC_NOTES[(noteIdx + 2) % PENTATONIC_NOTES.length];
            pluckNote(harmFreq, 0.42, 0.025);
          }
        };

        playPhrase();
        timerId = window.setInterval(playPhrase, 1850);
      }

      function stop() {
        playing = false;
        if (timerId) {
          clearInterval(timerId);
          timerId = null;
        }
        if (droneGain && ctx) {
          try {
            droneGain.gain.linearRampToValueAtTime(0.0001, ctx.currentTime + 0.35);
          } catch (e) {}
        }
        if (droneOsc) {
          const oldOsc = droneOsc;
          droneOsc = null;
          setTimeout(() => {
            try { oldOsc.stop(); oldOsc.disconnect(); } catch (e) {}
          }, 400);
        }
      }

      return {
        start,
        stop,
        isPlaying: () => playing
      };
    })();

    function cleanSpeechText(raw) {
      if (!raw) return '';
      return String(raw)
        .replace(/【[^】]*】/g, '')
        .replace(/\[([^\]]+)\]/g, '$1')
        .replace(/\(M\)/g, ' Miếu địa ')
        .replace(/\(V\)/g, ' Vượng địa ')
        .replace(/\(Đ\)/g, ' Đắc địa ')
        .replace(/\(B\)/g, ' Bình hòa ')
        .replace(/\(H\)/g, ' Hãm địa ')
        .replace(/T\.(\d+)/g, 'Tháng $1')
        .replace(/(\d+)–(\d+)t\b/g, '$1 đến $2 tuổi')
        .replace(/(\d+)-(\d+)t\b/g, '$1 đến $2 tuổi')
        .replace(/[★✦☯☰→↳•]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function splitIntoSpeechSentences(blocks) {
      const result = [];
      blocks.forEach((b) => {
        const cleaned = cleanSpeechText(b);
        if (!cleaned) return;
        const parts = cleaned.split(/(?<=[.!?।;])\s+/).map(x => x.trim()).filter(Boolean);
        parts.forEach(p => {
          if (p.length > 3) result.push(p);
        });
      });
      return result.length > 0 ? result : ['Chưa có nội dung luận giải để đọc.'];
    }
